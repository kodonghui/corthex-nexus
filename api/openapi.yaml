      description: "The HTML of a stage-09 mockup as the hub sent it, from the diagram's current drawing or, when that failed, its last good one (SPEC-009). It is served apart from NEXUS, as text/html; charset=utf-8: the Content-Security-Policy makes it a sandbox in which its scripts run but which has no NEXUS origin, so they reach neither NEXUS's cookies nor its API, and the page itself loads nothing from the network; only a NEXUS page may frame it. The diagram view first requests the page itself and reads only its status, stopping the transfer once the status arrives, because a page cannot read the status of a frame; it opens the page in an iframe with sandbox allow-scripts and nothing more only on 200, and lists the mockup's elements from API-265, its tokens, beside it. A page the mockup navigates its frame to is outside this policy, and text typed into the mockup can leave with that navigation, which no header stops; so a bar above the frame always marks it as a mockup page, NEXUS never asks for a sign-in inside it, and the view watches the frame: when it loads a second document, the view opens the mockup page again once and says that the mockup tried to open another page, and a second time it stops with \"The mockup keeps opening other pages\" and an Open again button. The Content-Security-Policy also sandboxes the page when it is opened in a tab of its own. Fonts the page loads from the network do not load."
      tags: [owner]
      x-corthex:
        id: API-293
        spec: [SPEC-009]
        tables: [TBL-147, TBL-149, TBL-150, TBL-151, TBL-152]
        release: Must
        family: owner
        media: text/html
        omit:
          "400": it takes no input but its path, and a malformed path value gets 404
      security:
        - ownerSignIn: []
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/diagram"
      responses:
        "200":
          description: The mockup page
          headers:
            Content-Security-Policy:
              description: The page runs in a sandbox with no network.
              schema:
                type: string
                const: "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
            X-Content-Type-Options:
              description: The page is read only as HTML.
              schema:
                type: string
                const: nosniff
            Cache-Control:
              description: The page is not kept outside the browser's session.
              schema:
                type: string
                const: "private, no-store"
          content:
            text/html:
              schema:
                type: string
                maxLength: 1048576
              examples:
                page:
                  value: "<!doctype html><title>NEXUS mockup</title><main>SCR-145</main>"
        "401":
          description: "Refused: no valid credential or sign-in"
          headers:
            Content-Security-Policy:
              description: Every answer of this operation is a sandbox, so a page opened in a tab of its own is one too.
              schema:
                type: string
                const: "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
            X-Content-Type-Options:
              description: The answer is read only as what it says it is.
              schema:
                type: string
                const: nosniff
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unauthenticated:
                  value:
                    title: Sign in to NEXUS
                    status: 401
                    detail: this request carries no valid sign-in
                    code: unauthenticated
                    traceId: "7b1e0c94d2a35f68"
        "403":
          description: "Refused: this caller may not do this"
          headers:
            Content-Security-Policy:
              description: Every answer of this operation is a sandbox, so a page opened in a tab of its own is one too.
              schema:
                type: string
                const: "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
            X-Content-Type-Options:
              description: The answer is read only as what it says it is.
              schema:
                type: string
                const: nosniff
          content:
            "application/problem+json":
              schema:
