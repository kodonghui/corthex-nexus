# NEXUS v3 API contract, stage 06 of the project. docs/06-api/README.md explains it.
# Written in plain block YAML that any YAML tool loads and tests/yaml_subset.py reads.
openapi: "3.1.0"
info:
  title: NEXUS v3
  version: "3.0.0-design"
  description: "The HTTP contract of NEXUS v3, stage 06 of the project. Two families of operations share one error shape.\n\nThe agent family serves the pinned corthex-hub (0.6.0 in the push job, which hub-ref.json pins, and the published 0.5.x in sessions until 0.6.0 is published) as it is (SPEC-014): the same paths, methods, headers and fields, and answers it reads without error. Every success is a non-empty JSON object, since the hub reads an empty answer as a failure. Writes that the hub queues carry Idempotency-Key and Nexus-Session; push and claims carry neither key, and are repeated safely by commit and by session. The hub sends no query strings and reads no ETag, so there are none.\n\nThe owner family serves the pages: the owner's sign-in from the gate on every request, and a request key on every write. An agent credential on an owner path gets owner_only; the owner's sign-in on an agent path gets agent_only.\n\nWrites to one project run one at a time in arrival order (rule 4); a write made invalid by an earlier one is refused with its reason, such as document_changed. Validation errors are 400 in every operation. No answer carries a credential secret after it is issued, a digest, a sign-in token, a server path or the text of a refused source (rule 5). NEXUS calls no AI model and no outside service while answering (rule 6). Refused requests are logged with time, action, sender and code (rule 8)."
  license:
    name: See the repository
    identifier: MIT
servers:
  - url: /
    description: The NEXUS that serves the pages, at its own address.
tags:
  - name: agent
    description: Commands of the pinned corthex-hub, with an agent credential.
  - name: owner
    description: Actions of the owner's pages, with the owner's sign-in.
paths:
  /api/snapshots:
    post:
      operationId: pushSnapshot
      summary: Accept a snapshot
      description: "The hub's push. NEXUS stores the snapshot, keeps each picture source and each stage's items as a document (TBL-149, TBL-150), draws the stage diagrams and item tables from them and answers with the revision. A corthex-hub/0.3 snapshot also carries the user flows, screen states and mockups, one picture per file with its key (SPEC-006, SPEC-008, SPEC-009). A project without a space gets one (SPEC-002): the pinned hub sends a snapshot of a project the server does not hold only after the user's yes, given as push --first. When the project holds a commit, the snapshot must name it in replaces, which the hub sets only for a commit that descends from it or after the user agreed to replace it. The same commit again answers its revision and redraws nothing, unless it comes in a newer format than the one that commit came in: then it completes that revision, so NEXUS keeps the files the older format did not carry, draws those stages (a stage's item table makes way for its pictures, SPEC-005) and answers the same revision with same_commit true and what it drew. A stage drawn as pictures before keeps its last pictures when a snapshot's format does not carry them (SPEC-005). A source whose text looks like a secret or an email address is left out and named in refused (REQ-077). A source that cannot be parsed keeps the diagram's last good drawing and is named in failures. The hub sends no request key and no session here; a repeat is recognised by its commit. After drawing, NEXUS invalidates confirmations whose document changed (SPEC-033), marks reflected the change sets of reported reflections (SPEC-025) and moves the threads of removed elements to their diagram (SPEC-027)."
      tags: [agent]
      x-corthex:
        id: API-242
        spec: [SPEC-001, SPEC-002, SPEC-003, SPEC-004, SPEC-005, SPEC-006, SPEC-007, SPEC-008, SPEC-009, SPEC-012, SPEC-014, SPEC-025, SPEC-027, SPEC-033, SPEC-035]
        tables: [TBL-147, TBL-148, TBL-149, TBL-150, TBL-151, TBL-152, TBL-153, TBL-154, TBL-155, TBL-157, TBL-158, TBL-160, TBL-161, TBL-166]
        release: Must
        family: agent
        omit:
          "404": a project without a space gets one, so the path names nothing that can be missing
      security:
        - agentClientId: []
          agentClientSecret: []
      requestBody:
        required: true
        description: At most 8388608 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Snapshot"
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushAnswer"
              examples:
                drawn:
                  value:
                    project: demo
                    revision: 4
                    commit: "5f2c8a1e9b0d4c7a3e6f8b2d1c0a9e8f7b6d5c4a"
                    replaced: "0a1b2c3d4e5f60718293a4b5c6d7e8f901234567"
                    created: false
                    same_commit: false
                    diagrams:
                      drawn: 2
                      unchanged: 11
                      failed: 0
                      removed: 0
                    failures: []
                    refused: []
                    confirmations_invalidated: 1
                    change_sets_reflected: 0
                    threads_moved: 0
                  summary: A newer commit, drawn
                same-commit:
                  value:
                    project: demo
                    revision: 4
                    commit: "5f2c8a1e9b0d4c7a3e6f8b2d1c0a9e8f7b6d5c4a"
                    replaced: null
                    created: false
                    same_commit: true
                    diagrams:
                      drawn: 0
                      unchanged: 13
                      failed: 0
                      removed: 0
                    failures: []
                    refused: []
                    confirmations_invalidated: 0
                    change_sets_reflected: 0
                    threads_moved: 0
                  summary: The same commit again
        "201":
          description: Project space created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushAnswer"
              examples:
                first-send:
                  value:
                    project: demo
                    revision: 1
                    commit: "5f2c8a1e9b0d4c7a3e6f8b2d1c0a9e8f7b6d5c4a"
                    replaced: null
                    created: true
                    same_commit: false
                    diagrams:
                      drawn: 13
                      unchanged: 0
                      failed: 0
                      removed: 0
                    failures: []
                    refused: []
                    confirmations_invalidated: 0
                    change_sets_reflected: 0
                    threads_moved: 0
                  summary: The first send of a project
        "400":
          description: "Refused: the request is not valid"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid-request:
                  value:
                    title: The request is not valid
                    status: 400
                    detail: text must not be empty
                    code: invalid_request
                    traceId: e8ad2a4ee205caf7
                    field: text
                invalid-snapshot:
                  value:
                    title: The snapshot is not valid
                    status: 400
                    detail: project.name must be 1 to 64 lowercase letters, digits and hyphens
                    code: invalid_snapshot
                    traceId: "17feabe66e19073e"
                    field: project.name
                unsupported-format:
                  value:
                    title: This snapshot format is not known
                    status: 400
                    detail: NEXUS takes the snapshot formats corthex-hub/0.2 and corthex-hub/0.3
                    code: unsupported_format
                    traceId: "169bc015ddfa3aab"
                    versions: [corthex-hub/0.2, corthex-hub/0.3]
        "401":
          description: "Refused: no valid credential or sign-in"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                access-missing:
                  value:
                    title: No valid agent credential
                    status: 401
                    detail: this request carries no valid agent credential
                    code: access_missing
                    traceId: "995b2d7e1493feaf"
        "403":
          description: "Refused: this caller may not do this"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                agent-only:
                  value:
                    title: This is an agent command
                    status: 403
                    detail: this path takes an agent credential; the owner uses the page
                    code: agent_only
                    traceId: "30bffdf8e553dc05"
        "409":
          description: "Refused: it clashes with the current state"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                commit-not-replaced:
                  value:
                    title: The commit does not follow the held one
                    status: 409
                    detail: the snapshot does not replace the held commit
                    code: commit_not_replaced
                    traceId: aab334d35db5b952
                    held_commit: "0a1b2c3d4e5f60718293a4b5c6d7e8f901234567"
                older-snapshot:
                  value:
                    title: NEXUS held this commit before
                    status: 409
                    detail: NEXUS held this commit at an earlier revision
                    code: older_snapshot
                    traceId: e2884c124e3f8612
                    revision: 3
                repository-mismatch:
                  value:
                    title: Another repository
                    status: 409
                    detail: this is another repository than the project's
                    code: repository_mismatch
                    traceId: "193f0b047b14d732"
        "413":
          description: "Refused: too large"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                snapshot-too-large:
                  value:
                    title: The snapshot is too large
                    status: 413
                    detail: the snapshot is over 8388608 bytes
                    code: snapshot_too_large
                    traceId: "04299fcf97e6276c"
                    limit: 8388608
        "415":
          description: "Refused: not JSON"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                json-required:
                  value:
                    title: Send JSON
                    status: 415
                    detail: send the body as application/json
                    code: json_required
                    traceId: "4a90ef32ab51e564"
        default:
          description: Any other error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                internal:
                  value:
                    title: Something went wrong
                    status: 500
                    detail: an unexpected error; the trace ID names it
                    code: internal
                    traceId: b5491065eaf40b1c
  /api/snapshots/{project}/held:
    get:
      operationId: getHeldCommit
      summary: Read the held commit
      description: Read before every push. The answer lists the snapshot formats the server takes and names the one the held commit came in, so a hub that knows a newer format the server takes sends the same commit again in it (API-242). The pinned hub 0.6.0 of the push job reads default_commit, formats and format; the published 0.5.x of sessions reads only default_commit. A project without a space answers project_not_found, which either hub reads as a first push that waits for --first.
      tags: [agent]
      x-corthex:
        id: API-243
        spec: [SPEC-001, SPEC-002, SPEC-014]
        tables: [TBL-147, TBL-148]
        release: Must
        family: agent
        omit:
          "400": it takes no input but its path, and a malformed path value gets 404
          "409": a read changes nothing, so it clashes with no state
      security:
        - agentClientId: []
          agentClientSecret: []
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: The held commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldCommit"
              examples:
                held:
                  value:
                    project: demo
                    default_commit: "5f2c8a1e9b0d4c7a3e6f8b2d1c0a9e8f7b6d5c4a"
                    revision: 4
                    formats: [corthex-hub/0.2, corthex-hub/0.3]
                    format: corthex-hub/0.3
        "401":
          description: "Refused: no valid credential or sign-in"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                access-missing:
