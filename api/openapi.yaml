      x-corthex:
        id: API-245
        spec: [SPEC-014, SPEC-026, SPEC-031, SPEC-043]
        tables: [TBL-147, TBL-149, TBL-150, TBL-151, TBL-152, TBL-155, TBL-156, TBL-157, TBL-158, TBL-160, TBL-163, TBL-166, TBL-167]
