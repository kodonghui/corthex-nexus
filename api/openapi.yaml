              minimum: 0
              maximum: 1000000
            threads:
              type: integer
              minimum: 0
              maximum: 1000000
            comments:
              type: integer
              minimum: 0
              maximum: 1000000
            change_sets:
              type: integer
              minimum: 0
              maximum: 1000000
            confirmations:
              type: integer
              minimum: 0
              maximum: 1000000
            positions:
              type: integer
              minimum: 0
              maximum: 1000000
            workshops:
              type: integer
              minimum: 0
              maximum: 1000000
            notes:
