components:
  x-corthex:
    errors:
      access_missing:
        status: 401
        meaning: "An agent path without a valid agent credential: none, an unknown client ID, a wrong secret or a revoked credential. One code for all four, so a caller learns nothing about which."
        message: Set a valid agent credential and send again.
        message_ko: "유효한 에이전트 자격 증명을 설정하고 다시 보내세요."
        client: The pinned hub keeps a queued write and sends it again later; set the credential.
      agent_only:
        status: 403
        meaning: The owner's sign-in on an agent path.
        message: This is an agent command. Do it on the page instead.
        message_ko: "에이전트 명령이에요. 화면에서 직접 하세요."
        client: Open the matching page.
      body_too_large:
        status: 413
        meaning: A request body over its limit, in bytes.
        message: Send less at once.
        message_ko: "한 번에 보내는 양을 줄이세요."
        client: Show the limit.
      change_set_not_found:
        status: 404
        meaning: No change set has that ID in this project.
        message: This change is no longer in NEXUS.
        message_ko: "NEXUS에 더 이상 없는 변경이에요."
        client: Reload the page.
      change_set_state:
        status: 409
        meaning: The change set's state does not allow the action, such as accepting a rejected proposal or cancelling a reflected edit; state names it.
        message: This change has already been decided.
        message_ko: "이미 결정된 변경이에요."
        client: Reload and show its state.
      checkpoint_not_found:
        status: 404
        meaning: No confirmation has that nk_ ID in this project.
        message: This confirmation is not in NEXUS.
        message_ko: "NEXUS에 없는 확정이에요."
        client: Read the to-do again.
      claimed:
        status: 409
        meaning: Another session claims the entry (SPEC-044); session and last_write_at name the holder, ends_at when the claim ends, null while its pull request is open.
        message: Another session is working on this.
        message_ko: "다른 세션이 작업 중이에요."
        client: Leave the entry to that session.
      comment_not_found:
        status: 404
        meaning: No comment thread has that nc_ ID in this project.
        message: This comment is not in NEXUS.
        message_ko: "NEXUS에 없는 댓글이에요."
        client: Read the to-do again.
      commit_not_replaced:
        status: 409
        meaning: The project holds a commit and the snapshot does not name it in replaces (REQ-002); held_commit names it, and the held diagrams stay as they were.
        message: Push a commit that follows the held one.
        message_ko: "보관된 커밋 뒤의 커밋을 보내세요."
        client: The hub checks the ancestry and asks the user before replacing.
      confirmation_cancelled:
        status: 409
        meaning: The record of a confirmation cancelled meanwhile (SPEC-032); the agent to-do now has recording the cancel.
        message: The owner cancelled this confirmation.
        message_ko: "소유자가 이 확정을 취소했어요."
        client: Read the to-do and record the cancel.
      confirmation_not_found:
        status: 404
        meaning: No confirmation has that ID in this project.
        message: This confirmation is no longer in NEXUS.
        message_ko: "NEXUS에 더 이상 없는 확정이에요."
        client: Reload the page.
      credential_not_found:
        status: 404
        meaning: No agent credential has that ID.
        message: This credential is not in NEXUS.
        message_ko: "NEXUS에 없는 자격 증명이에요."
        client: Reload the credential list.
      cross_site:
        status: 403
        meaning: A browser write whose Sec-Fetch-Site is neither same-origin nor none.
        message: This change has to come from NEXUS itself.
        message_ko: "이 변경은 NEXUS 화면에서만 할 수 있어요."
        client: Reload the page and try again.
      diagram_ambiguous:
        status: 409
        meaning: A comment or a proposal without diagram whose item several diagrams of the stage hold (SPEC-016, SPEC-018); diagrams lists them.
        message: Name the diagram.
        message_ko: "그림을 하나 골라 주세요."
        client: An agent sends the request again with diagram.
      diagram_not_found:
        status: 404
        meaning: No diagram has that ID, or the stage has nothing drawn yet, or the diagram that a direct edit, a move, a confirmation or a new thread names was removed (SPEC-027).
        message: This diagram is not in NEXUS.
        message_ko: "NEXUS에 없는 다이어그램이에요."
        client: "Link to the project; after a write, read the diagram again first, since a removed one still listed opens for its threads only (SPEC-027). An agent does not send the comment again as it is: it pushes the stage so that it draws, or names an item that a drawn diagram of the stage holds; an open thread of a removed diagram still takes replies (API-253)."
      discrepancy_not_found:
        status: 404
        meaning: NEXUS v3 has no discrepancies, so every nd_ ID is unknown.
        message: NEXUS opens no discrepancies.
        message_ko: "NEXUS는 차이를 열지 않아요."
        client: Leave the discrepancy out.
      document_changed:
        status: 409
        meaning: The request was made against a drawing that is no longer current (rule 4, SPEC-018, SPEC-019, SPEC-029); drawing and version name the current one.
        message: The document changed. Look at the new version.
        message_ko: "문서가 바뀌었어요. 새 버전을 보세요."
        client: Reload the diagram; an agent proposes against the current version.
      drawing_not_found:
        status: 404
        meaning: The drawing the request names is not one of the diagram's.
        message: Reload the page.
        message_ko: "페이지를 다시 여세요."
        client: Reload the diagram.
      edit_not_found:
        status: 404
        meaning: No reflection entry has that ne_ ID in this project.
        message: This reflection is not in NEXUS.
        message_ko: "NEXUS에 없는 반영 항목이에요."
        client: Read the to-do again.
      element_not_found:
        status: 404
        meaning: The element is in neither the drawing shown nor the current one.
        message: This element is no longer in the diagram.
        message_ko: "다이어그램에 더 이상 없는 요소예요."
        client: Reload the diagram.
      entry_closed:
        status: 409
        meaning: The entry is done, withdrawn or waits on the owner.
        message: This to-do is no longer open.
        message_ko: "더 이상 열려 있지 않은 할 일이에요."
        client: Read the to-do again.
      entry_not_found:
        status: 404
        meaning: "The claim names no to-do entry: an unknown ID, an nd_ ID or another kind."
        message: This to-do entry is not in NEXUS.
        message_ko: "NEXUS에 없는 할 일이에요."
        client: Read the to-do again.
      internal:
        status: 500
        meaning: An unexpected server error; traceId names it in the log.
        message: Something went wrong. Try again.
        message_ko: "문제가 생겼어요. 다시 해 보세요."
        client: Offer a retry and show the trace ID; the hub keeps a queued write.
      invalid_request:
        status: 400
        meaning: A header, a field or a value breaks the contract; field names it.
        message: Check the marked field.
        message_ko: "표시한 입력을 확인하세요."
        client: Show the message by the field it names.
      invalid_snapshot:
        status: 400
        meaning: A snapshot field breaks the hub's format; field names it.
        message: Fix the snapshot and push again.
        message_ko: "스냅숏을 고친 뒤 다시 보내세요."
        client: The hub reports the field; nothing was stored.
      item_not_found:
        status: 404
        meaning: Trace IDs the stage's drawing does not hold; items lists them (SPEC-018).
        message: These items are not in the stage.
        message_ko: "단계에 없는 항목이에요."
        client: The agent names items the drawing holds.
      json_required:
        status: 415
        meaning: A body that is not application/json.
        message: Send the body as JSON.
        message_ko: "본문을 JSON으로 보내세요."
        client: A client error; fix the client.
      method_not_allowed:
        status: 405
        meaning: A method the path does not take; the answer has Allow.
        message: This address does not take that request.
        message_ko: "이 주소는 그 요청을 받지 않아요."
        client: A client error; fix the client.
      name_taken:
        status: 409
        meaning: Another agent credential has this name (SPEC-049).
        message: Choose another name.
        message_ko: "다른 이름을 고르세요."
        client: Keep the form and mark the name.
      not_drawn:
        status: 409
        meaning: A confirmation of a diagram whose current drawing failed or that has none, a mockup page that has never drawn, or a proposal for a stage with no drawn picture.
        message: Fix the document so that it draws, then confirm.
        message_ko: "문서를 고쳐 그려지게 한 뒤 확정하세요."
        client: For a confirmation, show where the drawing failed; an agent whose proposal gets it comments instead, since the message is the owner's.
      not_found:
        status: 404
        meaning: A path that is no operation. Under /api/spaces the detail names the agent commands NEXUS takes (SPEC-014).
        message: This address does not exist.
        message_ko: "없는 주소예요."
        client: Link home.
      not_owner:
        status: 403
        meaning: A valid sign-in of someone other than the one owner (REQ-063).
        message: Only the owner of this NEXUS can open it.
        message_ko: "이 NEXUS의 소유자만 열 수 있어요."
        client: Show the message; offer nothing else.
      note_link_not_found:
        status: 404
        meaning: No link between sticky notes has that ID in the open workshop.
        message: This link is no longer on the board.
        message_ko: "보드에 더 이상 없는 연결이에요."
        client: Reload the board.
      note_made_by_owner:
        status: 409
        meaning: An agent draft that would remove a note the owner made (REQ-047).
        message: The agent cannot remove a note a person made.
        message_ko: "사람이 만든 스티커는 에이전트가 지울 수 없어요."
        client: Draft without removing it.
      note_not_found:
        status: 404
        meaning: No sticky note has that ID in the open workshop.
        message: This sticky note is no longer on the board.
        message_ko: "보드에 더 이상 없는 스티커예요."
        client: Reload the board.
      older_snapshot:
        status: 409
        meaning: The snapshot's commit is one of an earlier revision; revision names it.
        message: Push the current commit.
        message_ko: "현재 커밋을 보내세요."
        client: Push the default branch again.
      owner_only:
        status: 403
        meaning: An agent credential on an owner action (rule 1).
        message: Only the owner can do this, in NEXUS.
        message_ko: "소유자만 NEXUS에서 할 수 있는 일이에요."
        client: An agent tells the owner what to do in NEXUS.
      part_not_found:
        status: 404
        meaning: The project has no part of that name.
        message: This part is not in the project.
        message_ko: "프로젝트에 없는 부분이에요."
        client: Name a part of the project.
      project_not_found:
        status: 404
        meaning: No project space has that name, or it was deleted.
        message: This project is not in NEXUS.
        message_ko: "NEXUS에 없는 프로젝트예요."
        client: Link to the project list.
      proposal_not_found:
        status: 404
        meaning: No change set has that np_ ID in this project.
        message: This proposal is not in NEXUS.
        message_ko: "NEXUS에 없는 제안이에요."
        client: Read the to-do again.
      pull_request_mismatch:
        status: 409
        meaning: The entry is linked to another pull request (SPEC-024); pull_request names it.
        message: This work is in another pull request.
        message_ko: "다른 풀 리퀘스트에 들어간 작업이에요."
        client: Report the linked pull request.
      pull_request_needed:
        status: 409
        meaning: A report of reflected for an entry that names no pull request, in the body or before.
        message: Report the pull request first.
        message_ko: "풀 리퀘스트를 먼저 보고하세요."
        client: Report opened with the pull request, then reflected.
      repository_mismatch:
        status: 409
        meaning: The snapshot or the pull request is of another repository than the project's (SPEC-024).
        message: Use the project's own repository.
        message_ko: "프로젝트의 저장소를 쓰세요."
        client: Report a pull request of the project's repository.
      request_key_reused:
        status: 409
        meaning: An Idempotency-Key that an earlier request of another action took (rule 3).
        message: Send it again as a new request.
        message_ko: "새 요청으로 다시 보내세요."
        client: Make a new key.
      snapshot_too_large:
        status: 413
        meaning: A snapshot over 8 MiB (SPEC-001).
        message: Send a smaller snapshot.
        message_ko: "더 작은 스냅숏을 보내세요."
        client: The hub leaves pictures out to fit; nothing was stored.
      space_not_found:
        status: 404
        meaning: The to-do of a project with no space; the pinned hub reads it as an empty to-do.
        message: This project is not in NEXUS yet.
        message_ko: "아직 NEXUS에 없는 프로젝트예요."
        client: The hub shows an empty to-do.
      step_confirmed:
        status: 409
        meaning: An agent draft for a confirmed step (SPEC-037).
        message: This step is already confirmed.
        message_ko: "이미 확정된 단계예요."
        client: Draft an open step.
      step_empty:
        status: 409
        meaning: Confirming a step without notes (SPEC-039).
        message: Add notes before confirming.
        message_ko: "확정하기 전에 스티커를 붙이세요."
        client: Keep the step open.
      step_not_found:
        status: 404
        meaning: A step that is not one of event storming's steps.
        message: This step does not exist.
        message_ko: "없는 단계예요."
        client: A client error; fix the client.
      steps_open:
        status: 409
        meaning: A written report for a step before it is confirmed (SPEC-040); steps lists the open ones.
        message: Confirm these steps first.
        message_ko: "이 단계들을 먼저 확정하세요."
        client: Show the open steps.
      text_too_long:
        status: 400
        meaning: A text is over its limit; field and limit name them.
        message: Shorten the text to the limit.
        message_ko: "글자 수 제한까지 줄여 주세요."
        client: Keep the text and show the limit by the field.
      thread_closed:
        status: 409
        meaning: A reply to a closed thread (SPEC-017).
        message: This thread is closed. Start a new comment.
        message_ko: "닫힌 스레드예요. 새 댓글을 쓰세요."
        client: Offer a new comment on the same target.
      thread_not_found:
        status: 404
        meaning: No comment thread has that ID in this project.
        message: This thread is no longer in NEXUS.
        message_ko: "NEXUS에 더 이상 없는 댓글 스레드예요."
        client: Reload the page.
      tool_link_not_found:
        status: 404
        meaning: No tool link has that ID in this project.
        message: This link is not in NEXUS.
        message_ko: "NEXUS에 없는 링크예요."
        client: Reload the page.
      unauthenticated:
        status: 401
        meaning: An owner path without a valid sign-in from the gate, or with an expired one.
        message: Sign in again.
        message_ko: "다시 로그인하세요."
        client: Send the owner to the gate and keep an unsent comment in the page (SPEC-048).
      unsupported_format:
        status: 400
        meaning: A snapshot schema NEXUS does not know; versions lists the ones it takes (SPEC-014).
        message: Use a hub that sends a format NEXUS knows.
        message_ko: "NEXUS가 아는 형식을 보내는 hub를 쓰세요."
        client: Pin a hub version that sends one of versions.
      waiting_reflection:
        status: 409
        meaning: A confirmation while accepted change sets wait for reflection (SPEC-029); change_sets lists them.
        message: Reflect or cancel the waiting changes first.
        message_ko: "반영을 기다리는 변경을 먼저 반영하거나 취소하세요."
        client: List the waiting changes with their cancel buttons.
      workshop_closed:
        status: 409
        meaning: A change to the board when no workshop is open.
        message: The workshop is closed.
        message_ko: "워크숍이 닫혀 있어요."
        client: Reload the board.
      workshop_not_found:
        status: 404
        meaning: The project has no workshop.
        message: This project has no workshop.
        message_ko: "이 프로젝트에는 워크숍이 없어요."
        client: Offer to open one.
      workshop_open:
        status: 409
        meaning: The project already has an open workshop (SPEC-036); workshop names it.
        message: A workshop is already open.
        message_ko: "이미 열린 워크숍이 있어요."
        client: Open the named workshop.
    no_operation:
      SPEC-052: "A server job, not a request: the daily backup and its retry. Its failure reaches the owner through getOwnerTodo (SPEC-042)."
    limits:
      snapshot_bytes: 8388608
      body_bytes: 2097152
      miro_bytes: 5242880
      text_characters: 4000
      name_characters: 200
      credential_name_characters: 64
      checkpoint_request: "10 lines and 1,200 characters"
      request_key_days: 7
      claim_minutes: 60
  securitySchemes:
    agentClientId:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: "The agent credential's ID (ac_…), which the pinned hub reads from CORTHEX_NEXUS_CLIENT_ID. NEXUS checks it with the secret against the credential's digest (SPEC-049). Open: whether the gate in front of NEXUS passes the agent paths through or also checks these headers as its own service token is decided in stage 11."
    agentClientSecret:
      type: apiKey
      in: header
      name: CF-Access-Client-Secret
      description: The agent credential's secret, which the pinned hub reads from CORTHEX_NEXUS_CLIENT_SECRET.
    ownerSignIn:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The gate's signed sign-in, which NEXUS verifies (signature, audience, issuer and expiry) and admits only for the one owner (SPEC-048).
  parameters:
    project:
      name: project
      in: path
      required: true
      description: The project's name. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/ProjectName"
    comment:
      name: comment
      in: path
      required: true
      description: A comment thread. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/CommentId"
    proposal:
      name: proposal
      in: path
      required: true
      description: A change set. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/ProposalId"
    edit:
      name: edit
      in: path
      required: true
      description: A reflection entry. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/EditId"
    checkpoint:
      name: checkpoint
      in: path
      required: true
      description: A confirmation. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/CheckpointId"
    entry:
      name: entry
      in: path
      required: true
      description: "An entry of the agent to-do: nc_, ne_ or nk_; nd_ is never found. A value in another form gets the 404 of what it names."
      schema:
        $ref: "#/components/schemas/EntryId"
    diagram:
      name: diagram
      in: path
      required: true
      description: A diagram. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/DiagramId"
    thread:
      name: thread
      in: path
      required: true
      description: A comment thread. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/CommentId"
    change_set:
      name: change_set
      in: path
      required: true
      description: A change set. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/ProposalId"
    confirmation:
      name: confirmation
      in: path
      required: true
      description: A confirmation. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/CheckpointId"
    credential:
      name: credential
      in: path
      required: true
      description: An agent credential. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/CredentialId"
    link:
      name: link
      in: path
      required: true
      description: A tool link. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/ToolLinkId"
    note:
      name: note
      in: path
      required: true
      description: A sticky note. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/NoteId"
    notelink:
      name: link
      in: path
      required: true
      description: A link between sticky notes. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/NoteLinkId"
    step:
      name: step
      in: path
      required: true
      description: An event storming step. A value in another form gets the 404 of what it names.
      schema:
        $ref: "#/components/schemas/Step"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "The request key (rule 3): a write ID in double quotes, as the pinned hub sends it. The same key from the same caller within 7 days returns the first status and answer and writes nothing, except that a credential's secret is never shown again (API-280); 7 days because the hub keeps an unsent write that long. A key that another action took gets request_key_reused; a refused request leaves no key behind."
      schema:
        type: string
        maxLength: 17
        pattern: "^\"nw_[0-9a-hjkmnp-tv-z]{12}\"$"
      example: "\"nw_6t9w2z5c8f1j\""
    SessionRequired:
      name: Nexus-Session
      in: header
      required: true
      description: The agent session's label; claims belong to it.
      schema:
        $ref: "#/components/schemas/SessionLabel"
      example: claude-code-4f2a91
    SessionOptional:
      name: Nexus-Session
      in: header
      required: false
      description: The agent session's label, so that claim.mine is set.
      schema:
        $ref: "#/components/schemas/SessionLabel"
      example: claude-code-4f2a91
  schemas:
    ProjectName:
      type: string
      description: "A project's name: 1 to 64 lowercase letters, digits and single hyphens (SPEC-002)."
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Commit:
      type: string
      description: A Git commit in lowercase hex, 40 or 64 characters.
      maxLength: 64
      pattern: "^[0-9a-f]{40}(?:[0-9a-f]{24})?$"
    Time:
      type: string
      description: A UTC time with milliseconds, as the pinned hub reads it.
      maxLength: 24
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
      format: date-time
    TraceId:
      type: string
      description: A CORTHEX trace ID such as CTX-037.
      maxLength: 30
      pattern: "^[A-Z][A-Z0-9]*-[0-9]{1,6}$"
    ItemRef:
      type: string
      description: A trace ID, or the empty string for the stage as a whole.
      maxLength: 30
      pattern: "^(?:[A-Z][A-Z0-9]*-[0-9]{1,6})?$"
    Stage:
      type: string
      enum: ["01-domain", "02-prd", "03-user-flow", "04-functional-spec", "05-erd", "06-api", "07-sitemap", "08-screen-states", "09-mockup", "10-wbs", "11-development", "12-qa", "13-presentation"]
      description: One of the thirteen CORTHEX stages.
    PictureStage:
      type: string
      enum: ["01-domain", "03-user-flow", "05-erd", "07-sitemap", "08-screen-states", "09-mockup"]
      description: "A stage the hub sends a picture source for: 01, 05 and 07 in corthex-hub/0.2, and also 03, 08 and 09 in corthex-hub/0.3. A 0.2 snapshot with a picture of stage 03, 08 or 09 is invalid_snapshot."
    ProposalStage:
      type: string
      enum: ["01-domain", "03-user-flow", "05-erd", "07-sitemap", "08-screen-states"]
      description: "A stage that takes AI proposals: a picture stage other than 09, whose mockup page takes no overlay and whose tokens have no trace ID; an agent comments on a mockup instead. A stage with no drawn picture, such as one shown as an item table, answers not_drawn."
    Part:
      type: string
      description: A part of the project, or the empty string for the project as a whole.
      maxLength: 100
      pattern: "^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$"
    Link:
      type: string
      description: An https address.
      maxLength: 2000
      pattern: "^https://\\S+$"
      format: uri
    Text:
      type: string
      description: Text of 1 to 4,000 characters that is not only white space (SPEC-016).
      minLength: 1
      maxLength: 4000
      pattern: "\\S"
    Author:
      type: string
      enum: [owner, agent]
    SessionLabel:
      type: string
      description: An agent session's label.
      minLength: 1
      maxLength: 100
      pattern: "^[A-Za-z0-9._:-]{1,100}$"
    ElementKey:
      type: string
      description: "An element's key, the same across drawings: its trace ID when it has one."
      minLength: 1
      maxLength: 200
      pattern: "^\\S(?:.*\\S)?$"
    Step:
      type: string
      enum: ["0", "1", "1-b", "2", "3", "4", "5", "6", "7", "8", "9"]
      description: One of event storming's steps (TERM-212).
    CommentId:
      type: string
      description: A comment thread.
      maxLength: 15
      pattern: "^nc_[0-9a-hjkmnp-tv-z]{12}$"
    ProposalId:
      type: string
      description: "A change set: an AI proposal or a direct edit."
      maxLength: 15
      pattern: "^np_[0-9a-hjkmnp-tv-z]{12}$"
    EditId:
      type: string
      description: A reflection entry of the agent to-do.
      maxLength: 15
      pattern: "^ne_[0-9a-hjkmnp-tv-z]{12}$"
    CheckpointId:
      type: string
      description: A confirmation, which the hub calls a checkpoint.
      maxLength: 15
      pattern: "^nk_[0-9a-hjkmnp-tv-z]{12}$"
    DiscrepancyId:
      type: string
      description: A discrepancy of the hub's format; NEXUS v3 has none.
      maxLength: 15
      pattern: "^nd_[0-9a-hjkmnp-tv-z]{12}$"
    EntryId:
      type: string
      description: An entry the pinned hub can claim.
      maxLength: 15
      pattern: "^n[cdek]_[0-9a-hjkmnp-tv-z]{12}$"
    DiagramId:
      type: string
      description: A diagram.
      maxLength: 15
      pattern: "^dg_[0-9a-hjkmnp-tv-z]{12}$"
    DrawingId:
      type: string
      description: A drawing of a diagram.
      maxLength: 15
      pattern: "^dw_[0-9a-hjkmnp-tv-z]{12}$"
    CredentialId:
      type: string
      description: An agent credential; also the client ID an agent sends.
      maxLength: 15
      pattern: "^ac_[0-9a-hjkmnp-tv-z]{12}$"
    WorkshopId:
      type: string
      description: A workshop.
      maxLength: 15
      pattern: "^ws_[0-9a-hjkmnp-tv-z]{12}$"
    NoteId:
      type: string
      description: A sticky note.
      maxLength: 15
      pattern: "^sn_[0-9a-hjkmnp-tv-z]{12}$"
    NoteLinkId:
      type: string
      description: A link between two sticky notes.
      maxLength: 15
      pattern: "^sl_[0-9a-hjkmnp-tv-z]{12}$"
    ToolLinkId:
      type: string
      description: A tool link.
      maxLength: 15
      pattern: "^tl_[0-9a-hjkmnp-tv-z]{12}$"
    Claim:
      type: object
      required: [entry, session, mine, claimed_at, last_write_at, ends_at, pull_request]
      additionalProperties: false
      properties:
        entry:
          $ref: "#/components/schemas/EntryId"
        session:
          $ref: "#/components/schemas/SessionLabel"
        mine:
          type: boolean
          description: Whether the session that asked holds it.
        claimed_at:
          $ref: "#/components/schemas/Time"
        last_write_at:
          $ref: "#/components/schemas/Time"
        ends_at:
          anyOf:
            - $ref: "#/components/schemas/Time"
            - type: "null"
          description: null while a pull request of its work is open (SPEC-045).
        pull_request:
          anyOf:
            - $ref: "#/components/schemas/Link"
            - type: "null"
    Problem:
      type: object
      description: "Problem Details (RFC 9457) as application/problem+json. NEXUS sends no type, which reads as about:blank, and no instance; the other members are those the code's entry names."
      required: [title, status, detail, code, traceId]
      additionalProperties: false
      properties:
        type:
          type: string
          maxLength: 2000
          format: uri-reference
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 300
        instance:
          type: string
          maxLength: 2000
          format: uri-reference
        code:
          type: string
          enum: [access_missing, agent_only, body_too_large, change_set_not_found, change_set_state, checkpoint_not_found, claimed, comment_not_found, commit_not_replaced, confirmation_cancelled, confirmation_not_found, credential_not_found, cross_site, diagram_ambiguous, diagram_not_found, discrepancy_not_found, document_changed, drawing_not_found, edit_not_found, element_not_found, entry_closed, entry_not_found, internal, invalid_request, invalid_snapshot, item_not_found, json_required, method_not_allowed, name_taken, not_drawn, not_found, not_owner, note_link_not_found, note_made_by_owner, note_not_found, older_snapshot, owner_only, part_not_found, project_not_found, proposal_not_found, pull_request_mismatch, pull_request_needed, repository_mismatch, request_key_reused, snapshot_too_large, space_not_found, step_confirmed, step_empty, step_not_found, steps_open, text_too_long, thread_closed, thread_not_found, tool_link_not_found, unauthenticated, unsupported_format, waiting_reflection, workshop_closed, workshop_not_found, workshop_open]
          description: The error code, listed under components.x-corthex.errors.
        traceId:
          type: string
          description: The ID the server writes to its log for the request.
          maxLength: 20
          pattern: "^[0-9a-f]{16}(?:-[A-Z]{3})?$"
        field:
          type: string
          maxLength: 120
        limit:
          type: integer
          minimum: 1
          maximum: 1099511627776
        items:
          type: array
          items:
            $ref: "#/components/schemas/TraceId"
          minItems: 1
          maxItems: 50
        element:
          $ref: "#/components/schemas/ElementKey"
        held_commit:
          $ref: "#/components/schemas/Commit"
        revision:
          type: integer
          minimum: 1
          maximum: 1000000
        versions:
          type: array
          items:
            type: string
            maxLength: 40
          minItems: 1
          maxItems: 10
        state:
          type: string
          maxLength: 40
        pull_request:
          $ref: "#/components/schemas/Link"
        session:
          $ref: "#/components/schemas/SessionLabel"
        last_write_at:
          $ref: "#/components/schemas/Time"
        ends_at:
          anyOf:
            - $ref: "#/components/schemas/Time"
            - type: "null"
        diagrams:
          type: array
          items:
            $ref: "#/components/schemas/DiagramId"
          minItems: 2
          maxItems: 500
        change_sets:
          type: array
          items:
            $ref: "#/components/schemas/ProposalId"
          minItems: 1
          maxItems: 200
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
          minItems: 1
          maxItems: 11
        drawing:
          $ref: "#/components/schemas/DrawingId"
        version:
          $ref: "#/components/schemas/Commit"
        workshop:
          $ref: "#/components/schemas/WorkshopId"
    Snapshot:
      type: object
      description: The snapshot of the pinned corthex-hub, as it sends it. Only the fields NEXUS reads are listed; it keeps the others as they come.
      required: [schema, generator, generated_at, project, repos, stages, items, checks, pictures]
      additionalProperties: true
      if:
        required: [schema]
        properties:
          schema:
            const: corthex-hub/0.2
      then:
        properties:
          pictures:
            items:
              properties:
                stage:
                  enum: ["01-domain", "05-erd", "07-sitemap"]
      properties:
        schema:
          type: string
          enum: [corthex-hub/0.2, corthex-hub/0.3]
          description: "The snapshot format. corthex-hub/0.3 adds the picture sources of stages 03, 08 and 09, one picture per file, each with key; a hub sends it only to a server whose held commit (API-243) lists it in formats. Another format gets unsupported_format."
        generator:
          type: string
          maxLength: 40
          pattern: "^corthex-nexus [0-9]+\\.[0-9]+\\.[0-9]+$"
        generated_at:
          type: string
          maxLength: 40
        project:
          type: object
          required: [name]
          additionalProperties: true
          properties:
            name:
              $ref: "#/components/schemas/ProjectName"
            title:
              type: string
              maxLength: 120
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
              minItems: 1
              maxItems: 50
              uniqueItems: true
        ids:
          type: object
          additionalProperties: true
          properties: {}
        repos:
          type: object
          additionalProperties: true
          properties: {}
        stages:
          type: object
          additionalProperties: true
          properties: {}
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
          maxItems: 3000
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
          maxItems: 2001
        summary:
          type: object
          additionalProperties: true
          properties: {}
        truncated:
          type: boolean
        records:
          type: object
          additionalProperties: true
          properties: {}
        ask_before:
          type: object
          additionalProperties: true
          properties: {}
        pictures:
          type: array
          items:
            type: object
            required: [part, stage, commit, source]
            additionalProperties: true
            properties:
              part:
                $ref: "#/components/schemas/Part"
              stage:
                $ref: "#/components/schemas/PictureStage"
              key:
                type: string
                minLength: 1
                maxLength: 300
                description: "In corthex-hub/0.3, the repository path of the source file of a picture of stage 03, 08 or 09, which has one picture per file. NEXUS keeps it as the diagram's source_key (TBL-151); a picture of those stages without it is invalid_snapshot. Translation copies, such as a .ko.md beside its .md, are not sent."
              commit:
                $ref: "#/components/schemas/Commit"
              source:
                type: object
                description: "For stages 01, 05 and 07, the pinned hub's parsed picture. For stages 03, 08 and 09, text: the whole text of the file that key names, which NEXUS parses itself (the Mermaid flow of a user flow, the state table of a screen definition, the HTML of a mockup page)."
                additionalProperties: true
                properties:
                  text:
                    type: string
                    maxLength: 1048576
            if:
              required: [stage]
              properties:
                stage:
                  enum: ["03-user-flow", "08-screen-states", "09-mockup"]
            then:
              required: [key]
              properties:
                source:
                  required: [text]
          maxItems: 1000
        left_out:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
          maxItems: 1000
        replaces:
          $ref: "#/components/schemas/Commit"
    PushAnswer:
      type: object
      required: [project, revision, commit, replaced, created, same_commit, diagrams, failures, refused, confirmations_invalidated, change_sets_reflected, threads_moved]
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/ProjectName"
        revision:
          type: integer
          minimum: 1
          maximum: 1000000
        commit:
          $ref: "#/components/schemas/Commit"
        replaced:
          anyOf:
            - $ref: "#/components/schemas/Commit"
            - type: "null"
        created:
          type: boolean
          description: Whether this send created the project space (SPEC-002).
        same_commit:
          type: boolean
          description: "The same commit again: the same revision; nothing is redrawn unless the commit came in a newer format than before, which completes the revision (SPEC-001, SPEC-005)."
        diagrams:
          type: object
          required: [drawn, unchanged, failed, removed]
          additionalProperties: false
          properties:
            drawn:
              type: integer
              minimum: 0
              maximum: 1000000
            unchanged:
              type: integer
              minimum: 0
              maximum: 1000000
            failed:
              type: integer
              minimum: 0
              maximum: 1000000
            removed:
              type: integer
              minimum: 0
              maximum: 1000000
        failures:
          type: array
          items:
            type: object
            required: [diagram, part, stage, where]
            additionalProperties: false
            properties:
              diagram:
                $ref: "#/components/schemas/DiagramId"
              part:
                $ref: "#/components/schemas/Part"
              stage:
                $ref: "#/components/schemas/Stage"
              where:
                type: string
                maxLength: 300
          maxItems: 500
        refused:
          type: array
          description: Sources left out because their text looks like a secret or an email address (REQ-077).
          items:
            type: object
            required: [part, stage, where, why]
            additionalProperties: false
            properties:
              part:
                $ref: "#/components/schemas/Part"
              stage:
                $ref: "#/components/schemas/Stage"
              where:
                type: string
                maxLength: 300
              why:
                type: string
                enum: [secret, email]
          maxItems: 500
        confirmations_invalidated:
          type: integer
          minimum: 0
          maximum: 1000000
        change_sets_reflected:
          type: integer
          minimum: 0
          maximum: 1000000
        threads_moved:
          type: integer
          minimum: 0
          maximum: 1000000
    HeldCommit:
      type: object
      required: [project, default_commit, revision, formats, format]
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/ProjectName"
        formats:
          type: array
          description: The snapshot formats this server takes. A hub sends corthex-hub/0.3 only when it is listed; the pinned hub 0.6.0 of the push job reads formats and format, and the published 0.5.x of sessions reads only default_commit and sends 0.2. A later server may list formats this contract does not name, so a hub picks the newest one it knows.
          items:
            $ref: "#/components/schemas/FormatName"
          minItems: 1
          maxItems: 10
          uniqueItems: true
        format:
          description: The format the held commit came in, the newest when it came in more than one; null with no held commit.
          anyOf:
            - $ref: "#/components/schemas/FormatName"
            - type: "null"
        default_commit:
          anyOf:
            - $ref: "#/components/schemas/Commit"
            - type: "null"
        revision:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 1000000
            - type: "null"
    FormatName:
      type: string
      description: A snapshot format, such as corthex-hub/0.3.
      maxLength: 40
      pattern: "^corthex-hub/[0-9]{1,3}\\.[0-9]{1,3}$"
