        el("span", { class: "sl", "aria-hidden": "true", text: S.short[index] + (hasPicture ? " ◇" : "") }),
        el("span", { class: "sc", "aria-hidden": "true" }, [
          stage.items ? String(stage.items) : "",
          errors ? el("span", { class: "se", text: " ✕" + errors }) : null,
          warns ? el("span", { class: "sw", text: " !" + warns }) : null
        ])
      ]);
      strip.appendChild(el("li", null, [button]));
    });
    var node = el("article", { class: "card", id: "project-" + info.name }, [
      head,
      el("p", { class: "meta", text: metaParts.join(" · ") }),
      counts,
      nowLine(p),
      spaceSummary(p),
      p.truncated ? el("p", { class: "alert", text: S.truncated }) : null,
      strip,
      detail,
      checkList(p, p.checks || [], true)
    ]);
    node.detail = detail;
    node.strip = strip;
    return node;
  }

  function nowLine(p) {
    if((p.project.parts || []).length){var all=el("div");p.project.parts.forEach(function(part){var current=STAGE_KEYS.filter(function(k){return recordOf(p,k,part).state==="in_progress";})[0] || STAGE_KEYS.filter(function(k){return recordOf(p,k,part).state==="not_started";})[0];var recorded=STAGE_KEYS.some(function(k){var state=recordOf(p,k,part).state;return state&&state!=="unknown";});if(!current&&recorded)return;var record=current?recordOf(p,current,part):null;all.appendChild(el("p",{class:"now",text:part+" · "+(record?fmt(S.now,{stage:stageName(current)})+(record.next?" · "+fmt(S.next,{text:record.next}):""):S.noProgress)}));});return all;}
    var stages = p.stages || {};
    var recorded = STAGE_KEYS.filter(function (key) { return stages[key] && stages[key].state && stages[key].state !== "unknown" && stages[key].state !== "skipped"; });
    if (!recorded.length) { return el("p", { class: "now note", text: S.noProgress }); }
    var current = STAGE_KEYS.filter(function (key) { return stages[key] && stages[key].state === "in_progress"; })[0];
    if (!current) {
      current = STAGE_KEYS.filter(function (key) { return stages[key] && stages[key].state === "not_started"; })[0];
    }
    if (!current) { return null; }
    var parts = [fmt(S.now, { stage: stageName(current) })];
    if (stages[current].next) { parts.push(fmt(S.next, { text: stages[current].next })); }
    return el("p", { class: "now", text: parts.join(" · ") });
  }

  function checkList(p, checks, collapsible) {
    if (!checks.length) {
      return collapsible ? el("p", { class: "note", text: S.noChecks }) : null;
    }
    var rows = el("ul", { class: "plain rows" }, checks.map(function (c) { return checkRow(p, c); }));
    if (!collapsible) { return rows; }
    var serious = checks.some(function (c) { return c.level !== "info"; });
    return el("details", { class: "checks", open: serious }, [el("summary", { text: fmt(S.checksN, { n: checks.length }) }), rows]);
  }

  function stageDetail(p, key) {
    var found = stageInfo(p, key);
    var stage = found.stage;
    var index = stageIndex(key);
    var facts = el("dl", { class: "facts" });
    function fact(label, value) {
      if (value === null || value === undefined || value === "") { return; }
      facts.appendChild(el("dt", { text: label }));
      facts.appendChild(el("dd", null, [value]));
    }
    var state = stage.state || "unknown";
    fact(S.state, S.states[state] || state);
    if (stage.checkpoint || stage.checkpoint_date) {
      fact(S.checkpoint, [stage.checkpoint, stage.checkpoint_date].filter(Boolean).join(" · "));
    }
    fact(S.nextAction, stage.next);
    if (stage.human || stage.link) {
      var human = el("span", null, [stage.human || ""]);
      if (safeUrl(stage.link)) { human.appendChild(document.createTextNode(stage.human ? " · " : "")); human.appendChild(link(stage.link, S.open)); }
      fact(S.human, human);
    }
    fact(S.truth, stage.truth === "human" ? S.truthHuman : S.truthSource);
    var sourceParts = [];
    if (stage.source) { sourceParts.push(stage.source + (stage.default_source ? " (" + S.defaultSource + ")" : "")); }
    sourceParts.push(remote && stage.source_state === "no-checkout" ? S.serverNoCheckout : (S.sourceStates[stage.source_state] || stage.source_state || ""));
    if (stage.files !== undefined) { sourceParts.push(count(S.files, stage.files)); }
    if (stage.copied) { sourceParts.push(fmt(S.copied, { time: when(stage.copied.oldest) + (stage.copied.newest !== stage.copied.oldest ? "–" + when(stage.copied.newest) : "") })); }
    if (stage.skipped) { sourceParts.push(fmt(S.notRead, { list: Object.keys(stage.skipped).map(function (r) { return r + " " + stage.skipped[r]; }).join(", ") })); }
    fact(S.source, sourceParts.filter(Boolean).join(" · "));
    fact(S.note, stage.note);
    var parts = [el("h3", { text: stageName(key) + " · " + (S.states[state] || state) }), facts];
    partKeys(p).forEach(function(part){var record=recordOf(p,key,part),section=el("section",{class:"part-record"});if(part)section.appendChild(el("h4",{text:part}));section.appendChild(el("p",{text:(S.states[record.state] || S.states.unknown)+(record.next?" · "+fmt(S.next,{text:record.next}):"")}));(record.checkpoints || []).forEach(function(c){section.appendChild(el("p",null,[c.approved || c.date || "",c.date?" · "+c.date:"",safeUrl(c.where)?link(c.where,S.open):null]));});
      if(remote){section.appendChild(viewLink(p,part,key,false));var picture=(spaceOf(p).pictures || []).filter(function(pic){return pic.part===part&&pic.stage===key;})[0];if(picture){section.appendChild(viewLink(p,part,key,true));section.appendChild(el("p",{class:"note",text:picture.commit+(picture.not_current?" · "+N.notCurrent[picture.not_current]:"")}));}spaceNotes(p,part,key).forEach(function(n){section.appendChild(n);});}else section.appendChild(el("p",{class:"note",text:N.onServer}));parts.push(section);
    });
    if (found.checks.length) {
      parts.push(el("p", { class: "sub", text: S.checks }));
      parts.push(checkList(p, found.checks, false));
    } else {
      parts.push(el("p", { class: "note", text: S.noChecks }));
    }
    var items = p.items.filter(function (item) { return item.stage === key || (key === "08-screen-states" && item.screen_doc); });
    if (items.length) {
      parts.push(el("p", { class: "sub", text: S.items + " (" + items.length + ")" }));
      var kinds = Object.create(null);
      items.forEach(function (item) { var kind = item.kind || ""; (kinds[kind] = kinds[kind] || []).push(item); });
      Object.keys(kinds).sort(function (a, b) {
        var ai = KIND_ORDER.indexOf(a), bi = KIND_ORDER.indexOf(b);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
      }).forEach(function (kind) {
        parts.push(el("section", { class: "item-kind", "data-kind": kind }, [el("h4", { text: (kindName(kind) || S.none) + " (" + kinds[kind].length + ")" }), itemList(p, kinds[kind], 30)]));
      });
    }
    return parts;
  }

  function itemList(p, items, limit) {
    var listNode = el("ul", { class: "plain rows" });
    function fill(n) {
      listNode.textContent = "";
      items.slice(0, n).forEach(function (item) {
        var extra = [item.status, item.type, item.priority].filter(Boolean).join(" · ");
        listNode.appendChild(el("li", null, [idButton(p, item.id), el("span", { text: item.title || "" }), extra ? el("span", { class: "badge", text: extra }) : null]));
      });
    }
    fill(limit);
    if (items.length <= limit) { return listNode; }
    var more = el("button", { type: "button", class: "btn more", text: fmt(S.showAll, { n: items.length }), onclick: function () { fill(items.length); more.remove(); } });
    return el("div", null, [listNode, more]);
  }

  // ------------------------------------------------------------ trace

  function chain(p, id, direction) {
    var start = KIND_ORDER.indexOf(kindOf(p, id));
    var seen = {}, found = {};
    seen[id] = true;
    var frontier = [id];
    for (var depth = 0; depth < 8 && frontier.length; depth++) {
      var next = [];
      frontier.forEach(function (current) {
        var here = KIND_ORDER.indexOf(kindOf(p, current));
        neighbours(p, current).forEach(function (other) {
          var there = KIND_ORDER.indexOf(kindOf(p, other));
          if (seen[other] || there < 0 || here < 0) { return; }
          if (direction > 0 ? there > here && there > start : there < here && there < start) {
            seen[other] = true;
            found[kindOf(p, other)] = (found[kindOf(p, other)] || 0) + 1;
            next.push(other);
          }
        });
      });
      frontier = next;
    }
    return KIND_ORDER.filter(function (k) { return found[k]; }).map(function (k) { return kindName(k) + " " + found[k]; }).join(" · ");
  }

  function traceView(p, id) {
    var item = p.byId[id];
    var kind = kindOf(p, id);
    var heading = el("h2", { tabindex: "-1" }, [id + (item && item.title ? " " + item.title : "")]);
    var close = el("button", { type: "button", class: "btn", text: S.close, onclick: function () { go({ p: p.project.name }); } });
    var parts = [el("div", { class: "panel-head" }, [heading, close])];
    var facts = el("dl", { class: "facts" });
    function fact(label, value) {
      if (value === null || value === undefined || value === "") { return; }
      facts.appendChild(el("dt", { text: label }));
      facts.appendChild(el("dd", null, [value]));
    }
    fact(S.project, p.project.title || p.project.name);
    fact(S.kind, kindName(kind));
    if (item) {
      fact(S.stage, stageName(item.stage));
      fact(S.status, item.status);
      fact(S.type, item.type);
      fact(S.priority, item.priority);
      fact(S.where, whereNode(p, item.where));
      if (safeUrl(item.link)) { fact(S.human, link(item.link, S.open)); }
      if (item.parent) { fact(S.parent, idButton(p, item.parent)); }
      if (item.screen_doc) { fact(S.screenDoc, whereNode(p, item.screen_doc)); }
      if (item.states) { fact(S.screenStates, item.states.join(", ")); }
    }
    parts.push(facts);
    if (!item) { parts.push(el("p", { class: "note", text: fmt(S.undefinedId, { id: id }) })); }
    var near = neighbours(p, id).sort(byKind(p));
    var here = KIND_ORDER.indexOf(kind);
    var groups = { up: [], down: [], same: [], decision: [], other: [] };
    near.forEach(function (other) {
      var k = kindOf(p, other);
      var there = KIND_ORDER.indexOf(k);
      if (!item) { groups.other.push(other); }
      else if (k === "decision") { groups.decision.push(other); }
      else if (there < 0 || here < 0) { groups.other.push(other); }
      else if (there < here) { groups.up.push(other); }
      else if (there > here) { groups.down.push(other); }
      else { groups.same.push(other); }
    });
    var box = el("div", { class: "groups" });
    if (!near.length) { box.appendChild(el("p", { class: "note", text: S.none })); }
    [["up", S.upstream], ["down", S.downstream], ["same", S.related], ["decision", S.decisions], ["other", S.linkedFrom]].forEach(function (pair) {
      var ids = groups[pair[0]];
      if (!ids.length) { return; }
      var group = el("div", { class: "group" }, [el("h3", { text: pair[1] + " (" + ids.length + ")" })]);
      var stages = Object.create(null);
      ids.forEach(function (other) {
        var key = p.byId[other] && p.byId[other].stage || "";
        (stages[key] = stages[key] || []).push(other);
      });
      Object.keys(stages).sort(function (a, b) {
        var ai = stageIndex(a), bi = stageIndex(b);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
      }).forEach(function (key) {
        var section = el("section", { class: "trace-stage" }, [el("h4", { text: stageName(key) || S.none })]);
        var rows = el("div", { class: "chips" });
        stages[key].forEach(function (other) {
          var reference = p.byId[other];
          rows.appendChild(el("span", null, [idButton(p, other), !item && reference && reference.where ? whereNode(p, reference.where) : null]));
        });
        section.appendChild(rows);
        group.appendChild(section);
      });
      box.appendChild(group);
    });
    parts.push(box);
    var up = chain(p, id, -1), down = chain(p, id, 1);
    if (up) { parts.push(el("p", { class: "note", text: fmt(S.chainUp, { list: up }) })); }
    if (down) { parts.push(el("p", { class: "note", text: fmt(S.chainDown, { list: down }) })); }
    return el("div", { class: "panel" }, parts);
  }

  function whereNode(p, where) {
    if (!where) { return ""; }
    var match = /^(?:([a-z0-9]+(?:-[a-z0-9]+)*):)?(.+):(\d+)$/.exec(where);
    var repos = p.repos || {};
    var alias = ".", path = where, line = "";
    if (match) {
      alias = match[1] && repos[match[1]] ? match[1] : ".";
      path = match[1] && !repos[match[1]] ? match[1] + ":" + match[2] : match[2];
      line = match[3];
    }
    var repo = repos[alias] || {};
    if (safeUrl(repo.web) && repo.commit && /^[0-9a-f]{7,40}$/.test(repo.commit)) {
      var url = repo.web + "/blob/" + repo.commit + "/" + path.split("/").map(encodeURIComponent).join("/") + (line && line !== "1" ? "#L" + line : "");
      return link(url, where);
    }
    return document.createTextNode(where);
  }

  function searchView(query) {
    var q = query.trim();
    var upper = q.toUpperCase();
    var exact = [], loose = [];
    projects.forEach(function (p) {
      if (p.byId[upper] || p.near[upper]) { exact.push({ p: p, id: upper }); return; }
      var lower = q.toLowerCase();
      p.items.forEach(function (item) {
        if (item.id.toLowerCase().indexOf(lower) >= 0 || (item.title || "").toLowerCase().indexOf(lower) >= 0) {
          loose.push({ p: p, id: item.id });
        }
      });
    });
    if (exact.length === 1 && !loose.length) { return traceView(exact[0].p, exact[0].id); }
    var hits = exact.concat(loose).slice(0, 100);
    var heading = el("h2", { tabindex: "-1", text: hits.length ? count(S.results, hits.length, { q: q }) : fmt(S.noResults, { q: q }) });
    var close = el("button", { type: "button", class: "btn", text: S.close, onclick: function () { go({}); } });
    var rows = el("ul", { class: "plain rows" }, hits.map(function (hit) {
      var item = hit.p.byId[hit.id];
      return el("li", null, [idButton(hit.p, hit.id), el("span", { text: item && item.title ? item.title : "" }),
        el("span", { class: "badge", text: kindName(kindOf(hit.p, hit.id)) || S.states.unknown }),
        el("span", { class: "badge", text: item ? stageName(item.stage) : S.states.unknown }),
        el("span", { class: "badge", text: hit.p.project.title || hit.p.project.name })]);
    }));
    return el("div", { class: "panel" }, [el("div", { class: "panel-head" }, [heading, close]), rows]);
  }

  // ------------------------------------------------------------ routing

  var cards = {};
  function go(state) {
    var params = new URLSearchParams();
    Object.keys(state).forEach(function (key) { params.set(key, state[key]); });
    var hash = params.toString();
    if (("#" + hash) === location.hash || (!hash && !location.hash)) { route(); }
    else { location.hash = hash; }
  }

  function route() {
    var params = new URLSearchParams(location.hash.slice(1));
    var view = document.getElementById("view");
    view.textContent = "";
    Object.keys(cards).forEach(function (name) {
      var c = cards[name];
      c.detail.hidden = true;
      c.detail.textContent = "";
      Array.prototype.forEach.call(c.strip.querySelectorAll(".stage"), function (b) { b.setAttribute("aria-pressed", "false"); });
    });
    var p = byName[params.get("p")];
    var focus = null;
    if (params.get("q")) {
      view.appendChild(searchView(params.get("q")));
      focus = view.querySelector("h2");
    } else if (p && params.get("id")) {
      view.appendChild(traceView(p, params.get("id")));
      focus = view.querySelector("h2");
    } else if (p && params.get("s") && stageIndex(params.get("s")) >= 0) {
      var c = cards[p.project.name];
      stageDetail(p, params.get("s")).forEach(function (part) { c.detail.appendChild(part); });
      c.detail.hidden = false;
      var button = c.strip.querySelector('[data-stage="' + params.get("s") + '"]');
      if (button) { button.setAttribute("aria-pressed", "true"); }
      focus = c.detail.querySelector("h3");
      if (focus) { focus.setAttribute("tabindex", "-1"); }
    } else if(params.has("s") || (params.has("p") && !p)) {
      view.appendChild(el("div",{class:"panel"},[el("h2",{text:!p?N.noProject:N.noStage}),el("button",{class:"btn",text:S.close,onclick:function(){go({});}})]));focus=view.querySelector("h2");focus.setAttribute("tabindex","-1");
    }
    if (focus) {
      focus.focus({ preventScroll: true });
      focus.scrollIntoView({ block: "nearest" });
    }
  }

  function render() {
    document.getElementById("title").textContent = S.title;
    document.getElementById("meta").textContent = [fmt(S.built, { time: when(data.generated_at) }), count(S.projectsN, projects.length)].join(" · ");
    document.getElementById("legend").textContent = projects.length ? S.legend + (remote ? " · ◇ " + N.mark : "") : "";
    document.getElementById("find-label").textContent = S.findLabel;
    document.getElementById("q").setAttribute("placeholder", S.findHint);
    document.getElementById("find-button").textContent = S.find;
    document.getElementById("footer").textContent = remote ? S.footerServer : S.footerLocal;
    var holder = document.getElementById("projects");
    if (!projects.length) {
      holder.appendChild(el("p", { class: "panel note", text: data.broken ? N.broken : remote ? N.emptyServer : S.empty }));
    }
    projects.forEach(function (p) {
      var node = card(p);
      cards[p.project.name] = node;
      holder.appendChild(node);
    });
    var missing = (data.missing || []).filter(function (m) { return m && m.name; }).map(function (m) { return m.name + (m.reason ? " (" + m.reason + ")" : ""); });
    if (missing.length) {
      document.getElementById("missing").appendChild(el("p", { class: "note", text: fmt(S.missing, { list: missing.join(", ") }) }));
    }
    document.getElementById("find").addEventListener("submit", function (event) {
      event.preventDefault();
      var q = document.getElementById("q").value.trim();
      go(q ? { q: q } : {});
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && location.hash) { go({}); }
    });
    window.addEventListener("hashchange", route);
    route();
  }

  render();
})();
</script>
