function header(){const isPublic=['SCR-131','SCR-140'].includes(screen);const projectMenu=isPublic?'<div class="grow"><span class="hint">프로젝트 검토 공간</span></div>':'<div class="grow"><label for="project" class="hint" style="margin:0">프로젝트</label><select id="project" class="project" aria-label="프로젝트 전환">'+['NEXUS 샘플','도서관 예약 샘플','리서치 노트 샘플'].map(x=>'<option '+(x===project?'selected':'')+'>'+x+'</option>').join('')+'</select></div>';return '<header class="app-header"><a class="wordmark" href="#projects" data-go="SCR-132">NEXUS</a>'+projectMenu+badge('샘플 데이터')+'<button class="icon-button" id="theme" aria-label="'+(theme==='light'?'다크 모드로 전환':'라이트 모드로 전환')+'">'+icon('moon')+'</button>'+(isPublic?'<button class="quiet account" data-go="SCR-132">로그인</button>':'<button class="quiet account" data-go="SCR-138">내 계정</button>')+'</header>'}
function sidebar(){return '<nav class="sidebar" aria-label="프로젝트와 단계"><div class="side-intro"><button class="stage-link" data-go="SCR-132">'+icon('grid')+'프로젝트 목록</button><button class="stage-link" data-go="SCR-137">'+icon('layers')+'게시 상태</button></div><p class="eyebrow side-label">프로젝트의 13단계</p>'+names.map((n,i)=>'<button class="stage-link" data-stage="'+i+'" '+(screen==='SCR-134'&&stage===i?'aria-current="page"':'')+'><span class="number">'+String(i+1).padStart(2,'0')+'</span><span>'+n+'</span>'+(i===stage?'<span class="status-dot" aria-hidden="true"></span>':'')+'</button>').join('')+'<p class="hint side-label">통과 여부는 각 버전에<br>연결된 실제 결정으로 표시합니다.</p></nav>'}
function heading(title,desc,actions=''){return '<div class="crumb">'+esc(project)+' / '+(screen==='SCR-134'?String(stage+1).padStart(2,'0')+' '+names[stage]:d().ko)+'</div><div class="page-heading"><div><h1 id="page-title" tabindex="-1">'+title+'</h1><p class="hint">'+desc+'</p></div><div class="row">'+actions+'</div></div>'}
function inspector(){return '<aside class="panel inspector" aria-label="선택한 항목"><div class="panel-head"><span class="eyebrow">선택한 항목</span>'+badge(selected)+'</div><div class="panel-body"><span class="eyebrow">선택 항목</span><h2>'+esc(selectedTitle)+'</h2><p class="summary muted">하나의 산출물 안에서 항목을 선택하고, 같은 버전을 보며 AI와 대화합니다.</p><dl class="keyval"><dt>소유 범위</dt><dd>선택한 프로젝트·파트·단계</dd><dt>콘텐츠 버전</dt><dd>샘플 버전 3</dd><dt>검토 상태</dt><dd>'+badge('검토 대기','warning')+'</dd></dl><button class="full" data-action="source">'+icon('source')+'원본과 버전 보기</button><div class="divider"></div><div class="row between"><h3>이 항목의 대화</h3>'+badge('샘플 1개')+'</div><div class="message"><header><strong>AI 응답 · 샘플</strong><span>버전 3</span></header><p>답변과 원본 변경 제안을 구분합니다. 수락한 제안도 원본이 병합·게시되어야 반영 완료가 됩니다.</p></div><button class="primary full" data-go="SCR-135">'+icon('chat')+'이 항목에 질문하기</button><p class="hint" style="margin-top:var(--space-md)">질문은 항목과 콘텐츠 버전에 연결됩니다.</p></div></aside>'}
function node(id,title,type=''){return '<button class="node '+type+(selected===id?' selected':'')+'" data-item="'+id+'"><span class="mono">'+id+'</span><strong>'+title+'</strong><span class="hint">'+(type==='event'?'이벤트':'항목을 선택해 대화')+'</span></button>'}
function diagram(){return '<div class="board"><div class="board-content"><div class="board-caption"><span><i class="legend-dot"></i>컨텍스트</span><span>↓ 명령 → 이벤트</span><span>항목을 선택하면 상세가 열립니다.</span></div><div class="journey"><section class="domain-group"><div class="group-label"><span>프로젝트 게시</span><span class="mono">CTX-032</span></div>'+node('CMD-SAMPLE-1','스냅샷을 게시하라')+'<div class="node-arrow" aria-hidden="true">↓</div>'+node('EVENT-SAMPLE-1','스냅샷이 게시되었다','event')+'</section><section class="domain-group"><div class="group-label"><span>산출물과 항목 대화</span><span class="mono">CTX-033</span></div>'+node('CTX-033','항목에 질문하라')+'<div class="node-arrow" aria-hidden="true">↓</div>'+node('EVENT-SAMPLE-2','질문이 등록되었다','event')+'</section><section class="domain-group"><div class="group-label"><span>체크포인트</span><span class="mono">CTX-034</span></div>'+node('CMD-SAMPLE-3','콘텐츠를 검토하라')+'<div class="node-arrow" aria-hidden="true">↓</div>'+node('EVENT-SAMPLE-3','체크포인트가 통과되었다','event')+'</section><section class="domain-group"><div class="group-label"><span>마이그레이션·복구</span><span class="mono">CTX-036</span></div>'+node('CMD-SAMPLE-4','데이터를 복원하라')+'<div class="node-arrow" aria-hidden="true">↓</div>'+node('EVENT-SAMPLE-4','복구가 검증되었다','event')+'</section></div></div></div>'}
function itemTable(rows,headers=['ID','내용','상태']){return '<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td class="mono">'+r[0]+'</td><td><button class="quiet" data-item="'+r[0]+'">'+r[1]+'</button></td><td>'+badge(r[2],r[2]==='검토 대기'?'warning':'')+'</td></tr>').join('')+'</tbody></table></div>'}
function artifact(){if(view==='list')return itemTable([['CTX-032','프로젝트 게시','설계'],['CTX-033','산출물과 항목 대화','검토 대기'],['CTX-034','체크포인트','설계'],['CTX-036','마이그레이션·복구','설계']]);if(stage===0)return diagram();if(stage===1)return itemTable([['REQ-301','접근 가능한 프로젝트 목록을 표시한다','Must'],['REQ-305','선택한 원본에서 그림을 표시한다','Must'],['REQ-318','소유자만 체크포인트를 통과시킨다','Must']]);if(stage===2)return '<div class="flow">'+node('FL-SAMPLE-1','프로젝트 선택')+'<span aria-hidden="true">→</span>'+node('FL-SAMPLE-2','산출물 검토')+'<span aria-hidden="true">→</span>'+node('FL-SAMPLE-3','항목 질문')+'<span aria-hidden="true">→</span>'+node('FL-SAMPLE-4','사용자 결정')+'</div><div class="panel-body"><p class="muted">실패한 요청은 입력을 유지합니다. 콘텐츠 버전이 바뀌면 다시 검토합니다.</p></div>';if(stage===3)return itemTable([['SPEC-305','그림과 키보드 목록을 함께 제공한다','설계'],['SPEC-311','질문과 원래 버전을 저장한다','설계'],['SPEC-318','예상 버전·리비전으로 사용자 결정을 비교한다','설계']]);if(stage===4)return '<div class="board"><div class="journey"><div class="domain-group"><h2>projects</h2><p class="mono">id PK<br>owner_id FK<br>repository<br>default_branch</p></div><div class="domain-group"><h2>artifacts</h2><p class="mono">id PK<br>project_id FK → projects<br>content_version<br>source_commit</p></div><div class="domain-group"><h2>discussions</h2><p class="mono">id PK<br>artifact_id FK → artifacts<br>item_id<br>original_version</p></div><div class="domain-group"><h2>checkpoints</h2><p class="mono">id PK<br>artifact_id FK → artifacts<br>human_decision<br>content_version</p></div></div></div>';if(stage===5)return '<div class="panel-body stack">'+['GET /api/v2/projects','GET /api/v2/projects/{id}/stages/{part}/{stage}','POST /api/v2/projects/{id}/checkpoints/{id}/decisions'].map((x,i)=>'<button class="full" data-item="API-'+(205+i)+'"><span class="mono">'+x+'</span></button>').join('')+'<p class="muted">응답을 선택하면 스키마·예시·오류와 연결된 화면 상태를 확인합니다.</p></div>';if(stage===6)return '<div class="tree">'+node('SCR-132','프로젝트 목록')+'<div>'+node('SCR-134','단계 작업 화면')+'<div>'+node('SCR-135','항목 대화')+node('SCR-136','체크포인트 검토')+'</div></div></div>';if(stage===7)return itemTable([['SCR-134','정상 · 로딩 · 빈 화면 · 오류 · 권한 · 버전 충돌','91개 상태 중 샘플'],['SCR-135','작업 대기 · 답변 도착 · 반영 대기','상태별 검토'],['SCR-136','통과 · 철회 · 선행 조건 미충족','상태별 검토']]);if(stage===8)return '<div class="panel-body stack"><h2>라이트·다크 목업</h2><p class="muted">커밋된 HTML을 권한 없는 샌드박스에서 검토합니다.</p><button class="primary" data-go="SCR-141">격리된 미리보기 열기 '+icon('external')+'</button></div>';if(stage===9)return itemTable([['TASK-SAMPLE-1','데이터 격리와 인증 구현','준비'],['TASK-SAMPLE-2','산출물 시각화와 항목 대화','선행 작업 필요'],['TASK-SAMPLE-3','마이그레이션·복구·브라우저 QA','실행 전']]);if(stage===10)return '<div class="panel-body stack"><h2>개발 근거</h2><p>아직 구현 근거가 없습니다. 병합된 PR·커밋·검사 결과를 연결하면 이곳에서 확인할 수 있습니다.</p>'+badge('구현 전')+'</div>';if(stage===11)return itemTable([['TC-SAMPLE-1','프로젝트 전환과 비공개 데이터 격리','미실행'],['TC-SAMPLE-2','체크포인트 버전 충돌','미실행'],['TC-SAMPLE-3','코멘트·체크포인트 이전과 복구','미실행']]);return '<div class="panel-body stack"><span class="eyebrow">발표 · 샘플</span><h2>검증한 결과로 설명합니다.</h2><p>제품의 목적, 사용자 플로우, 검증 근거와 남은 제한을 정리할 공간입니다.</p>'+badge('발표 준비 전')+'</div>'}
function workspace(){return heading(String(stage+1).padStart(2,'0')+' '+names[stage],'산출물을 그림으로 살펴보고, 항목을 선택해 대화를 시작하세요.','<button data-go="SCR-139">버전 이력</button><button data-go="SCR-136">'+icon('check')+'체크포인트 검토</button>')+'<div class="workspace"><section class="panel" aria-label="단계 산출물"><div class="panel-head"><div class="tabs" aria-label="산출물 보기"><button data-view="diagram" aria-pressed="'+(view==='diagram')+'">그림</button><button data-view="list" aria-pressed="'+(view==='list')+'">키보드 목록</button></div>'+badge('샘플 버전 3','warning')+'</div>'+artifact()+'<div class="source-strip"><span class="mono">원본 기반 산출물 · 샘플 버전 3</span><button class="quiet" data-action="source">'+icon('source')+'원본</button></div></section>'+inspector()+'</div>'}
function welcome(){return '<div class="hero"><div><span class="eyebrow">NEXUS / PROJECT REVIEW</span><h1 id="page-title" tabindex="-1">산출물을 보고,<br>함께 묻고,<br>직접 결정하세요.</h1><p>아이디어부터 발표까지 13단계.<br>항목에 대해 AI와 대화하고, 검토한 버전의 체크포인트를 통과시키세요.</p><div class="row"><button class="primary" data-go="SCR-132">로그인하고 시작하기 '+icon('arrow')+'</button><button data-go="SCR-140">샘플 먼저 보기</button></div><p class="hint" style="margin-top:var(--space-lg)">프로젝트는 본인만 볼 수 있습니다.</p></div><div class="hero-art"><span class="eyebrow">한 프로젝트의 흐름</span><div class="mini-stage"><span class="mono">01</span> 도메인 탐색 '+badge('그림으로 검토')+'</div><div class="mini-stage"><span class="mono">02</span> PRD '+badge('항목에 질문')+'</div><div class="mini-stage"><span class="mono">03</span> 유저 플로우 '+badge('사용자가 결정','success')+'</div><p class="hint">설계부터 개발·QA·발표까지 같은 맥락을 유지합니다.</p></div></div><div class="feature-list"><article><span class="mono">01 / VISUALIZE</span><h2>문서를 그림으로 이해합니다.</h2><p>도메인, 플로우, ERD와 사이트맵을 원본에 연결해 살펴봅니다.</p></article><article><span class="mono">02 / DISCUSS</span><h2>질문은 항목 옆에 남습니다.</h2><p>어떤 항목의 어떤 버전을 두고 이야기했는지 놓치지 않습니다.</p></article><article><span class="mono">03 / DECIDE</span><h2>마지막 결정은 사용자가 합니다.</h2><p>AI의 답변이나 제안만으로 체크포인트가 통과되지 않습니다.</p></article></div>'}
function projects(){return heading('프로젝트','각 프로젝트의 현재 맥락을 이어서 확인하세요.','<button class="primary" data-go="SCR-133">프로젝트 연결 '+icon('arrow')+'</button>')+'<div class="row" style="margin-bottom:var(--space-xl)"><div class="grow"><label class="hint" for="project-search">프로젝트 검색</label><input id="project-search" placeholder="프로젝트 이름으로 검색"></div><span class="hint">샘플 프로젝트 3개</span></div><div class="card-grid" id="projects">'+['NEXUS 샘플','도서관 예약 샘플','리서치 노트 샘플'].map((n,i)=>'<button class="card project-card" data-project="'+n+'"><div class="row between"><span class="eyebrow">비공개 · 샘플</span>'+icon('arrow')+'</div><h2>'+n+'</h2><p class="muted">'+['01 도메인 탐색','03 유저 플로우','02 PRD'][i]+'</p><div class="divider"></div><div class="row between">'+badge('검토 대기','warning')+'<span class="hint">샘플 버전 3</span></div></button>').join('')+'</div><p id="filter-empty" class="empty" hidden>검색 결과가 없습니다. 검색어를 지우고 다시 확인해 주세요.</p>'}

function preview(){return heading('HTML 목업 미리보기','원본 버전은 유지하고 HTML 실행 권한은 격리합니다.','<button data-go="SCR-134">단계로 돌아가기</button>')+'<div class="notice"><h2>격리된 샌드박스</h2><p class="muted">프로젝트 세션, 외부 네트워크, 저장소와 상위 화면의 쓰기 권한을 제공하지 않습니다.</p></div><iframe title="격리된 샘플 HTML" class="preview-frame" sandbox="allow-scripts" srcdoc="'+esc('<!doctype html><html lang="ko"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\';style-src \'unsafe-inline\';script-src \'unsafe-inline\';form-action \'none\';base-uri \'none\'"><style>body{margin:0;padding:32px;font:16px/1.6 system-ui;background:'+(theme==='light'?'#f5f7f6':'#111b18')+';color:'+(theme==='light'?'#19362e':'#e6f2e9')+';word-break:keep-all}h1{font-size:28px}button{font:inherit;padding:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px}</style><p>SELF-CONTAINED HTML / SAMPLE</p><h1>원본과 함께 검토하는 목업</h1><p>이 안의 스크립트는 상위 화면의 권한을 갖지 않습니다.</p><button onclick="document.querySelector(\'p\').textContent=\'샘플 내부에서만 동작했습니다.\'">샘플 동작</button></html>')+'"></iframe>'}
function generalState(){const st=d().states.find(s=>s.id===state);if(!st||state==='normal')return '';if(state==='loading')return '<div class="panel" aria-busy="true" aria-label="불러오는 중"><div class="panel-head"><h2>산출물을 불러오고 있습니다.</h2></div><div class="panel-body"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>';if(['empty','error','permission','stale','unsupported','missing','refused','expired','auth-pending','blocked','consent-required','connected','retryable-failure','secret-unavailable','source-changed','proposal-unreflected','outdated','sample-readonly'].includes(state)){const titles={empty:'아직 표시할 내용이 없습니다.',error:'요청을 완료하지 못했습니다.',permission:'로그인 또는 권한 확인이 필요합니다.',stale:'검토 중인 버전이 변경되었습니다.',unsupported:'이 형식은 아직 표시할 수 없습니다.',missing:'아직 게시된 산출물이 없습니다.',refused:'이 동작은 격리 정책에 따라 차단됩니다.',expired:'로그인이 만료되었습니다.','auth-pending':'로그인 요청을 기다리고 있습니다.',blocked:'먼저 확인할 선행 조건이 있습니다.','consent-required':'첫 게시 범위를 확인해 주세요.',connected:'프로젝트가 연결되었습니다.','retryable-failure':'게시를 다시 시도할 수 있습니다.','secret-unavailable':'비밀값은 다시 표시할 수 없습니다.','source-changed':'원래 대화보다 새 버전이 있습니다.','proposal-unreflected':'수락한 제안의 원본 반영을 기다립니다.',outdated:'과거 버전을 보고 있습니다.','sample-readonly':'공개 샘플을 살펴보고 있습니다.'};return '<section class="notice '+(state==='error'?'error':'warning')+'" role="status"><h2>'+titles[state]+'</h2><p>'+esc(st.ko)+'</p><div class="row" style="margin-top:var(--space-lg)"><button class="primary" data-state="normal">'+(state==='stale'?'최신 버전 다시 보기':state==='permission'?'로그인하고 돌아오기':state==='empty'?'시작 안내 보기':'다시 확인')+'</button><button data-go="'+(screen==='SCR-131'?'SCR-140':'SCR-132')+'">'+(screen==='SCR-131'?'샘플 보기':'프로젝트 목록')+'</button></div></section>'}return '<div class="notice"><h2>'+esc(st.id)+'</h2><p>'+esc(st.ko)+'</p></div>'}
function tools(){return '<aside class="review-tools" aria-label="목업 검토 도구"><span class="mock-label">설계 목업 · 샘플 데이터 · 실제 전송 없음</span><label>화면 <select id="screen">'+definitions.map(s=>'<option value="'+s.id+'" '+(screen===s.id?'selected':'')+'>'+s.id+' '+s.ko+'</option>').join('')+'</select></label><label>상태 <select id="state">'+d().states.map(s=>'<option value="'+s.id+'" '+(state===s.id?'selected':'')+'>'+s.id+'</option>').join('')+'</select></label><label>후보 <select id="candidate"><option value="A" '+(candidate==='A'?'selected':'')+'>A · 작업 화면</option><option value="B" '+(candidate==='B'?'selected':'')+'>B · 버전 검토</option></select></label></aside>'}
function render(){if(!d().states.some(s=>s.id===state))state='normal';document.body.classList.toggle('is-loading',state==='loading');document.documentElement.dataset.theme=theme;document.documentElement.dataset.candidate=candidate;const publicScreen=['SCR-131','SCR-140'].includes(screen);let content=({'SCR-131':welcome,'SCR-132':projects,'SCR-133':connect,'SCR-134':workspace,'SCR-135':discussion,'SCR-136':checkpoint,'SCR-137':publications,'SCR-138':credentials,'SCR-139':history,'SCR-140':sample,'SCR-141':preview}[screen])();const generic=generalState();if(state==='loading'){/* Preserve the complete loaded geometry; CSS masks data regions. */}else if(['empty','permission','missing','unsupported','auth-pending','expired'].includes(state))content=heading(d().ko,'현재 상태와 다음 동작을 확인하세요.')+generic;else content=generic+content;content=content.replaceAll('샘플 버전 3','샘플 버전 '+version).replaceAll('원래 버전 3','원래 버전 '+version);document.querySelector('#app').innerHTML=header()+'<div class="shell" '+(publicScreen?'style="grid-template-columns:minmax(0,1fr)"':'')+'>'+(publicScreen?'':sidebar())+'<main id="main" class="main"><div class="mobile-stage"><label for="mobile-stage">프로젝트 단계</label><select id="mobile-stage">'+names.map((x,i)=>'<option value="'+i+'" '+(stage===i?'selected':'')+'>'+String(i+1).padStart(2,'0')+' '+x+'</option>').join('')+'</select></div>'+content+'</main></div>'+tools();const main=document.querySelector('#main');main.inert=state==='loading';main.setAttribute('aria-busy',String(state==='loading'));bind();}
function switchProject(value){memory.set(project,{screen:screen==='SCR-132'?'SCR-134':screen,stage,selected,selectedTitle,version});project=value;const m=memory.get(project);screen=m?.screen||'SCR-134';stage=m?.stage||0;selected=m?.selected||'CTX-033';selectedTitle=m?.selectedTitle||'산출물과 항목 대화';version=m?.version||3;state='normal';messages=[];formDraft='';render();notify('선택한 샘플 프로젝트의 맥락으로 전환했습니다.')}
function bind(){document.querySelector('#theme').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('nexus-mockup-theme',theme)}catch{}render()};document.querySelector('#project')?.addEventListener('change',e=>switchProject(e.target.value));document.querySelector('#screen').onchange=e=>go(e.target.value);document.querySelector('#state').onchange=e=>{state=e.target.value;render()};document.querySelector('#candidate').onchange=e=>{candidate=e.target.value;render()};document.querySelector('#mobile-stage').onchange=e=>{stage=Number(e.target.value);go('SCR-134')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=Number(b.dataset.stage);go('SCR-134')});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;selectedTitle=b.querySelector('strong')?.textContent||b.textContent;render();notify('선택한 항목의 상세와 대화가 열렸습니다.')});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{version=Number(b.dataset.version);go('SCR-134')});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>switchProject(b.dataset.project));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelector('#project-search')?.addEventListener('input',e=>{let shown=0;document.querySelectorAll('[data-project]').forEach(b=>{b.hidden=!b.dataset.project.includes(e.target.value);if(!b.hidden)shown++});document.querySelector('#filter-empty').hidden=shown>0});document.querySelector('#connect-form')?.addEventListener('submit',e=>{e.preventDefault();const u=new URL(document.querySelector('#repository').value);if(u.protocol!=='https:'||u.hostname!=='github.com'||u.pathname.split('/').filter(Boolean).length!==2){document.querySelector('#connect-error').textContent='https://github.com/소유자/저장소 형식으로 입력해 주세요.';document.querySelector('#repository').setAttribute('aria-invalid','true');return}go('SCR-137');notify('샘플 연결 동작입니다. 실제 저장소에 연결하거나 게시하지 않았습니다.')});document.querySelector('#question')?.addEventListener('input',e=>formDraft=e.target.value);document.querySelector('#question-form')?.addEventListener('submit',e=>{e.preventDefault();const text=document.querySelector('#question').value.trim();if(!text)return;messages.push(text);formDraft='';state='queued';render();document.querySelector('#question').focus();notify('샘플 질문을 이 목업의 메모리에만 저장했습니다.')})}
function action(a){if(a==='signout'){messages=[];formDraft='';memory.clear();version=3;go('SCR-131');return notify('샘플 계정의 비공개 초안과 선택을 초기화했습니다.')}if(a==='source')return source();if(a==='pass'&&version!==3){state='stale';render();return notify('과거 버전입니다. 현재 게시본을 다시 검토해 주세요.')}if(a==='pass')return dialog('이 버전의 체크포인트 통과','<p>샘플 버전 3에 대한 검토를 완료한 것으로 표시할까요?</p><p class="hint">실제 NEXUS의 사용자 결정은 변경되지 않습니다.</p>',()=>{state='passed';render();notify('샘플 체크포인트 상태를 통과로 바꿨습니다.')});if(a==='withdraw')return dialog('샘플 통과 철회','<p>이전 통과 이력을 유지하고 이후 단계의 완료 조건에 영향을 표시합니다.</p>',()=>{state='withdrawn';render();notify('샘플 통과를 철회했습니다.')});if(a==='issue'){state='issued';render();return notify('실제 자격 증명을 발급하지 않았습니다.')}if(a==='revoke')return dialog('이 자격 증명을 폐기할까요?','<p>실제 구현에서는 해당 프로젝트·역할의 접근이 즉시 중단됩니다.</p>',()=>{state='revoked';render()});if(a==='proposal'){state='proposal-unreflected';render();return notify('제안을 수락한 샘플입니다. 원본은 바뀌지 않았습니다.')}if(a==='reject')return notify('샘플 제안을 거절했습니다. 원래 대화는 유지됩니다.');if(a==='refresh')return notify('샘플 상태만 표시했습니다. 실제 서버 조회는 하지 않았습니다.');if(a==='copy-sample'){go('SCR-132');return notify('샘플 복사 흐름을 표시했습니다. 실제 프로젝트를 생성하지 않았습니다.')}if(a==='download'){const blob=new Blob(['# Synthetic NEXUS sample\n\nThis file contains no real project data.\n'],{type:'text/markdown'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nexus-sample.md';link.click();URL.revokeObjectURL(url)}}
render();
</script></body></html>
