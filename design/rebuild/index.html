 the same idempotency key/body until the result is known. Missing target offers a list/source link.","ko":"안전한 오류 코드와 추적 ID를 표시하고 비밀값이 아닌 입력을 유지합니다. 결과를 확인할 때까지 같은 멱등성 키·본문으로 재시도합니다. 대상이 없으면 목록·원본 링크를 제공합니다."},{"id":"permission","en":"Clear private content when the session expires. Sign in and restore the validated address; forbidden role explains why and offers back. An absent/foreign target is indistinguishable.","ko":"세션이 만료되면 비공개 내용을 지웁니다. 로그인 후 검증된 주소로 복귀합니다. 허용되지 않은 역할은 사유와 돌아가기를 제공합니다. 없는 대상과 다른 사용자 대상은 구분하지 않습니다."},{"id":"stale","en":"Keep the reviewed version and draft; explain changed revision or conflicting operation. Reload and require a deliberate new action, never auto-submit a human decision.","ko":"검토한 버전과 초안을 유지하고 변경된 리비전 또는 충돌 동작을 설명합니다. 새로고침 후 명시적인 새 동작을 요구하고 사용자 결정을 자동 재전송하지 않습니다."},{"id":"queued","en":"Question saved; show waiting/claimed agent status and allow another separate question.","ko":"질문이 저장되었습니다. 에이전트 대기·처리 상태를 표시하고 별도 질문을 허용합니다."},{"id":"answered","en":"Show the agent reply, its source/version and human decision actions.","ko":"에이전트 답변과 원본·버전, 사용자 결정 동작을 표시합니다."},{"id":"proposal-unreflected","en":"Accepted proposal is awaiting merged-source evidence; original artifact remains unchanged.","ko":"수락한 제안의 병합 원본 근거를 기다립니다. 원래 산출물은 유지합니다."},{"id":"source-changed","en":"A newer artifact exists; keep this original conversation and offer a deliberate version switch.","ko":"새 산출물이 있습니다. 원래 대화를 유지하고 명시적인 버전 전환을 제공합니다."}],"actions":[{"api":211,"en":"Send question","ko":"질문 보내기","result":"Show durable acknowledgement and queued work; retain original item/version.","result_ko":"저장 확인과 작업 대기를 표시하고 원래 항목·버전을 유지합니다."},{"api":213,"en":"Record decision","ko":"결정 기록","result":"Record the decision and cited merged-source evidence, not a fabricated reflection.","result_ko":"결정과 병합된 원본 근거를 기록합니다. 반영 결과를 꾸미지 않습니다."},{"api":218,"en":"Accept or reject proposal","ko":"제안 수락·거절","result":"Record human intent; accepted still waits for a merged and published reflection.","result_ko":"사용자 의사를 기록합니다. 수락 후에도 병합·게시된 반영 결과를 기다립니다."}],"responses":[["API-201#200","SCR-135#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-201#400","SCR-135#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#401","SCR-135#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#403","SCR-135#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#429","SCR-135#error","Show Retry-After; keep drafts and last successful data, no rapid automatic retry.","Retry-After를 표시하고 초안과 마지막 성공 데이터를 유지합니다. 빠른 자동 재시도는 하지 않습니다."],["API-201#default","SCR-135#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#204","SCR-135#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-204#400","SCR-135#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#401","SCR-135#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#403","SCR-135#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#429","SCR-135#error","Show Retry-After; keep drafts and last successful data, no rapid automatic retry.","Retry-After를 표시하고 초안과 마지막 성공 데이터를 유지합니다. 빠른 자동 재시도는 하지 않습니다."],["API-204#default","SCR-135#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-209#200","SCR-135#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-209#400","SCR-135#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-209#401","SC  차단 사유, 이전 결정과 선택적 사유를 표시합니다.","empty":"요청이 없으면 요청 방법을 안내하고 통과로 표시하지 않습니다.","states":[{"id":"normal","en":"Requested scope, immutable content version, default-branch commit, blockers, previous decisions and optional reason.","ko":"요청 범위, 고정 콘텐츠 버전, 기본 브랜치 커밋, 차단 사유, 이전 결정과 선택적 사유를 표시합니다."},{"id":"loading","en":"Keep the normal layout and focus; use inert placeholders only on initial load. Retain prior content during refresh.","ko":"일반 화면의 레이아웃과 포커스를 유지합니다. 최초 로딩에만 비활성 플레이스홀더를 사용하고 새로고침 중에는 이전 내용을 유지합니다."},{"id":"empty","en":"No request exists; explain how to request one without implying approval.","ko":"요청이 없으면 요청 방법을 안내하고 통과로 표시하지 않습니다."},{"id":"error","en":"Show safe problem code and trace ID; keep non-secret input. Retry the same idempotency key/body until the result is known. Missing target offers a list/source link.","ko":"안전한 오류 코드와 추적 ID를 표시하고 비밀값이 아닌 입력을 유지합니다. 결과를 확인할 때까지 같은 멱등성 키·본문으로 재시도합니다. 대상이 없으면 목록·원본 링크를 제공합니다."},{"id":"permission","en":"Clear private content when the session expires. Sign in and restore the validated address; forbidden role explains why and offers back. An absent/foreign target is indistinguishable.","ko":"세션이 만료되면 비공개 내용을 지웁니다. 로그인 후 검증된 주소로 복귀합니다. 허용되지 않은 역할은 사유와 돌아가기를 제공합니다. 없는 대상과 다른 사용자 대상은 구분하지 않습니다."},{"id":"stale","en":"Keep the reviewed version and draft; explain changed revision or conflicting operation. Reload and require a deliberate new action, never auto-submit a human decision.","ko":"검토한 버전과 초안을 유지하고 변경된 리비전 또는 충돌 동작을 설명합니다. 새로고침 후 명시적인 새 동작을 요구하고 사용자 결정을 자동 재전송하지 않습니다."},{"id":"passed","en":"Show who passed which content version and when; offer withdrawal, never a second accidental pass.","ko":"누가 어떤 콘텐츠 버전을 언제 통과시켰는지 표시합니다. 중복 통과 대신 철회를 제공합니다."},{"id":"withdrawn","en":"Keep the pass and withdrawal reason/time, and show dependent completion blockers.","ko":"통과와 철회 사유·시각을 유지하고 이후 완료의 차단 사유를 표시합니다."},{"id":"blocked","en":"List unmet dependencies or missing publication and disable pass with a reason.","ko":"충족하지 않은 의존성 또는 누락된 게시를 표시하고 사유와 함께 통과를 비활성화합니다."}],"actions":[{"api":220,"en":"Request review","ko":"검토 요청","result":"Create a version-bound request with scope and review address.","result_ko":"범위와 검토 주소를 포함한 버전별 요청을 만듭니다."},{"api":222,"en":"Pass checkpoint","ko":"체크포인트 통과","result":"Require the current owner session and expected revision/version; show one durable decision.","result_ko":"현재 소유자 세션과 예상 리비전·버전을 확인하고 저장된 결정 하나를 표시합니다."},{"api":223,"en":"Withdraw checkpoint","ko":"체크포인트 철회","result":"Confirm consequence and preserve the original pass and withdrawal history.","result_ko":"영향을 확인하고 원래 통과와 철회 이력을 유지합니다."}],"responses":[["API-201#200","SCR-136#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-201#400","SCR-136#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#401","SCR-136#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#403","SCR-136#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#429","SCR-136#error","Show Retry-After; keep drafts and last successful data, no rapid automatic retry.","Retry-After를 표시하고 초안과 마지막 성공 데이터를 유지합니다. 빠른 자동 재시도는 하지 않습니다."],["API-201#default","SCR-136#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#204","SCR-136#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-204#400","SCR-136#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#401","SCR-136#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#403","SCR-136#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-204#429","SCR-136#error","Show :"empty","en":"No receipt yet; show setup guidance and a status refresh action.","ko":"수신 기록이 없으면 설정 안내와 상태 새로고침을 제공합니다."},{"id":"error","en":"Show safe problem code and trace ID; keep non-secret input. Retry the same idempotency key/body until the result is known. Missing target offers a list/source link.","ko":"안전한 오류 코드와 추적 ID를 표시하고 비밀값이 아닌 입력을 유지합니다. 결과를 확인할 때까지 같은 멱등성 키·본문으로 재시도합니다. 대상이 없으면 목록·원본 링크를 제공합니다."},{"id":"permission","en":"Clear private content when the session expires. Sign in and restore the validated address; forbidden role explains why and offers back. An absent/foreign target is indistinguishable.","ko":"세션이 만료되면 비공개 내용을 지웁니다. 로그인 후 검증된 주소로 복귀합니다. 허용되지 않은 역할은 사유와 돌아가기를 제공합니다. 없는 대상과 다른 사용자 대상은 구분하지 않습니다."},{"id":"stale","en":"Keep the reviewed version and draft; explain changed revision or conflicting operation. Reload and require a deliberate new action, never auto-submit a human decision.","ko":"검토한 버전과 초안을 유지하고 변경된 리비전 또는 충돌 동작을 설명합니다. 새로고침 후 명시적인 새 동작을 요구하고 사용자 결정을 자동 재전송하지 않습니다."},{"id":"queued","en":"Attempt is waiting; no received commit is claimed.","ko":"시도가 대기 중입니다. 커밋 수신으로 표시하지 않습니다."},{"id":"retryable-failure","en":"Show safe failure and retry guidance; preserve last successful receipt.","ko":"안전한 실패 정보와 재시도 안내를 표시하고 마지막 성공 수신을 유지합니다."},{"id":"skipped","en":"Missing setup means not sent; show missing setting names only.","ko":"설정 누락으로 전송되지 않았습니다. 누락된 설정 이름만 표시합니다."}],"actions":[{"api":226,"en":"Refresh receipt","ko":"수신 기록 새로고침","result":"Show the server-held commit; compare with the expected default-branch commit.","result_ko":"서버가 보유한 커밋을 표시하고 예상 기본 브랜치 커밋과 비교합니다."}],"responses":[["API-201#200","SCR-137#normal","Success with an empty collection → empty; otherwise normal.","빈 컬렉션 성공은 empty, 나머지는 normal입니다."],["API-201#400","SCR-137#error","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유지하고 해당 상태의 복구 규칙을 적용합니다."],["API-201#401","SCR-137#permission","Retain safe context and use the state recovery rule.","안전한 컨텍스트를 유 rmal layout and focus; use inert placeholders only on initial load. Retain prior content during refresh.","ko":"일반 화면의 레이아웃과 포커스를 유지합니다. 최초 로딩에만 비활성 플레이스홀더를 사용하고 새로고침 중에는 이전 내용을 유지합니다."},{"id":"empty","en":"No credential exists; explain role and scope before issuing.","ko":"자격 증명이 없으면 발급 전에 역할과 범위를 설명합니다."},{"id":"error","en":"Show safe problem code and trace ID; keep non-secret input. Retry the same idempotency key/body until the result is known. Missing target offers a list/source link.","ko":"안전한 오류 코드와 추적 ID를 표시하고 비밀값이 아닌 입력을 유지합니다. 결과를 확인할 때까지 같은 멱등성 키·본문으로 재시도합니다. 대상이 없으면 목록·원본 링크를 제공합니다."},{"id":"permission","en":"Clear private content when the session expires. Sign in and restore the validated address; forbidden role explains why and offers back. An absent/foreign target is indistinguishable.","ko":"세션이 만료되면 비공개 내용을 지웁니다. 로그인 후 검증된 주소로 복귀합니다. 허용되지 않은 역할은 사유와 돌아가기를 제공합니다. 없는 대상과 다른 사용자 대상은 구분하지 않습니다."},{"id":"stale","en":"Keep the reviewed version and draft; explain changed revision or conflicting operation. Reload and require a deliberate new action, never auto-submit a human decision.","ko":"검토한 버전과 초안을 유지하고 변경된 리비전 또는 충돌 동작을 설명합니다. 새로고침 후 명시적인 새 동작을 요구하고 사용자 결정을 자동 재전송하지 않습니다."},{"id":"issued","en":"One-time response is visible until closed; copy requires an explicit action.","ko":"닫기 전까지 일회 응답을 표시합니다. 복사는 명시적인 동작이 필요합니다."},{"id":"secret-unavailable","en":"Replay metadata only; revoke and issue a new credential to recover.","ko":"재시도는 메타데이터만 표시합니다. 복구하려면 폐기 후 새로 발급합니다."},{"id":"revoked","en":"Credential can no longer publish or read agent work; show retained metadata only.","ko":"더 이상 게시하거나 에이전트 작업을 조회할 수 없습니다. 유지된 메타데이터만 표시합니다."}],"actions":[{"api":229,"en":"Issue credential","ko":"자격 증명 발급","result":"Show the real value once only in this response; never place it in URL, logs or persistent client storage.","result_ko":"응답에서만 실제 값을 한 번 표시합니다. URL·로그·영구 클라이언트 저장소에는 넣지 않습니다."},{"api":230,"en":"Revoke credential","ko":"자격 증명 폐기","result":"Confirm the selected ·게시 리비전·콘텐츠 버전과 실제 체크포인트 이력을 표시하고 최신 버전을 구분합니다."},{"id":"loading","en":"Keep the normal layout and focus; use inert placeholders only on initial load. Retain prior content during refresh.","ko":"일반 화면의 레이아웃과 포커스를 유지합니다. 최초 로딩에만 비활성 플레이스홀더를 사용하고 새로고침 중에는 이전 내용을 유지합니다."},{"id":"empty","en":"No published version exists; link to publication guidance.","ko":"게시된 버전이 없으면 게시 안내로 연결합니다."},{"id":"error","en":"Show safe problem code and trace ID; keep non-secret input. Retry the same idempotency key/body until the result is known. Missing target offers a list/source link.","ko":"안전한 오류 코드와 추적 ID를 표시하고 비밀값이 아닌 입력을 유지합니다. 결과를 확인할 때까지 같은 멱등성 키·본문으로 재시도합니다. 대상이 없으면 목록·원본 링크를 제공합니다."},{"id":"permission","en":"Clear private content when the session expires. Sign in and restore the validated address; forbidden role explains why and offers back. An absent/foreign target is indistinguishable.","ko":"세션이 만료되면 비공개 내용을 지웁니다. 로그인 후 검증된 주소로 복귀합니다. 허용되지 않은 역할은 사유와 돌아가기를 제공합니다. 없는 대상과 다른 사용자 대상은 구분하지 않습니다."},{"id":"stale","en":"Keep the reviewed version and draft; explain changed revision or conflicting operation. Reload and require a deliberate new action, never auto-submit a human decision.","ko":"검토한 버전과 초안을 유지하고 변경된 리비전 또는 충돌 동작을 설명합니다. 새로고침 후 명시적인 새 동작을 요구하고 사용자 결정을 자동 재전송하지 않습니다."},{"id":"outdated","en":"Label the older version and keep its actual past approval separate from the latest version.","ko":"과거 버전을 표시하고 당시의 실제 통과를 최신 버전과 구분합니다."},{"id":"withdrawn","en":"Show historical pass and withdrawal as two retained events.","ko":"과거 통과와 철회를 유지된 두 이벤트로 표시합니다."}],"actions":[{"api":224,"en":"Select versions","ko":"버전 선택","result":"Show both immutable versions and changed items with original decision bindings.","result_ko":"두 고정 버전과 변경된 항목, 원래 결정의 연결을 표시합니다."},{"api":208,"en":"Open original artifact","ko":"원래 산출물 열기","result":"Read the selected historical artifact instead of silently replacing it with latest.","result_ko":"선택한 과거 산출물을 읽고 최신 버전으로 몰래 바꾸지 않습니다."}],"responses":[["API-201#200"," function connect(){return heading('프로젝트 연결','어떤 저장소의 산출물을 검토할지 연결합니다.')+'<form id="connect-form" class="panel narrow"><div class="panel-body"><h2>저장소와 프로젝트</h2><p class="muted">실제 업로드는 동의를 확인한 뒤 진행합니다.</p><div class="field"><label for="project-name">프로젝트 이름</label><input id="project-name" name="name" required maxlength="80" value="'+esc(connectDraft.name)+'"></div><div class="field"><label for="repository">GitHub 저장소 주소</label><input type="url" id="repository" required value="'+esc(connectDraft.repository)+'" placeholder="https://github.com/owner/repository" aria-describedby="repository-hint"><p id="repository-hint" class="hint">저장소 원본과 기본 브랜치를 확인하는 데 사용합니다.</p></div><div class="notice"><h3>첫 게시 전에 확인해 주세요.</h3><p class="hint">선택한 저장소의 단계 산출물과 원본 정보가 비공개 프로젝트에 게시됩니다. 시크릿과 환경 변수 값은 게시 대상이 아닙니다.</p></div><label class="check-row"><input type="checkbox" id="consent" required '+(connectDraft.consent?'checked':'')+'><span>이 저장소의 첫 게시 범위를 확인하고 동의합니다.</span></label><div class="row" style="margin-top:var(--space-xl)"><button type="submit" class="primary">프로젝트 연결</button><button type="button" data-go="SCR-132">취소</button></div><p id="connect-error" role="alert" class="hint"></p></div></form>'}
function discussion(){
 const example=state!=='empty'&&currentThread().sample;
 const answer=state==='empty'?'':state==='queued'?'<div class="notice"><h3>질문이 저장되었습니다.</h3><p>에이전트가 답변을 준비할 때까지 원래 버전을 유지합니다. 다른 질문도 보낼 수 있습니다.</p></div>':'<div class="message"><header><strong>AI 응답 · 샘플</strong><span>원래 버전 '+version+'</span></header><p>제안 수락은 사용자 의사를 기록합니다. 원본 변경은 별도 PR로 병합되고 NEXUS에 게시되어야 반영 완료로 표시합니다.</p><p class="hint">근거: 기능 명세 SPEC-316 · 샘플 원본</p></div><div class="review-version"><div class="row between"><h3>원본 변경 제안</h3>'+badge('반영 대기','warning')+'</div><p>제안 수락과 반영 완료를 분리해 표시합니다.</p><div class="row" style="margin-top:var(--space-lg)"><button data-action="proposal">제안 수락</button><button data-action="reject">거절</button></div></div>';
 const records='<section aria-labelledby="decisions-title"><div class="row between"><h2 id="decisions-title">기록한 결정</h2><button data-action="record-decision">결정 기록</button></div><div id="decision-records">'+(decisions.length?decisions.map(r=>'<article class="message human"><header><strong>사용자 결정 · 목업 입력</strong><span>버전 '+r.version+'</span></header><p>'+esc(r.body)+'</p><p class="hint">원본 근거: '+esc(r.publication)+(r.evidence?' · '+esc(r.evidence):'')+'</p></article>').join(''):'<p class="muted" style="margin-top:var(--space-lg)">아직 기록한 결정이 없습니다. 게시된 원본을 근거로 남길 수 있습니다.</p>')+'</div></section>';
 return heading('항목 대화','원래 항목·버전을 유지한 채 질문과 결정을 남깁니다.','<button data-go="SCR-134">산출물로 돌아가기</button>')+'<div class="workspace"><section class="panel"><div class="panel-head"><div><span class="mono">'+esc(selected)+' · 샘플 버전 '+version+'</span><h2>'+esc(selectedTitle)+'</h2></div>'+badge(state==='queued'?'작업 대기':'샘플 답변','warning')+'</div><div class="panel-body">'+(example?'<div class="message human"><header><strong>사용자 · 샘플</strong><span>원래 버전 '+version+'</span></header><p>AI가 제안을 수락하면 바로 원본이 바뀌나요?</p></div>':'')+(example||state==='queued'?answer:'')+(state==='empty'?'<p class="notice">아직 질문이 없습니다. 이 항목과 원래 버전에 연결할 첫 질문을 입력해 주세요.</p>':records)+messages.map(m=>'<div class="message human"><header><strong>사용자 · 목업 입력</strong>'+badge('작업 대기')+'</header><p>'+esc(m)+'</p></div>').join('')+'<div class="divider"></div><form id="question-form"><label for="question">이 항목에 질문하기</label><textarea id="question" required maxlength="8000" placeholder="궁금한 점이나 검토할 내용을 입력해 주세요.">'+esc(formDraft)+'</textarea><div class="row between" style="margin-top:var(--space-md)"><span class="hint">항목과 원래 버전에 연결됩니다.</span><button class="primary" type="submit">질문 보내기 '+icon('arrow')+'</button></div></form></div></section>'+inspector()+'</div>'
}
function recordDecision(){
 dialog('결정 기록','<label for="decision-body">결정 내용</label><textarea id="decision-body" aria-describedby="decision-error" maxlength="8000" placeholder="어떤 결정을 했고 왜 그렇게 판단했는지 적어 주세요."></textarea><div class="field"><label for="decision-source">근거가 되는 게시본</label><select id="decision-source"><option value="pub_demo_'+version+'">샘플 게시본 '+version+' · '+(version===3?'현재':'과거')+' 콘텐츠</option></select><p class="hint">게시된 원본에 연결됩니다. 대화의 원래 버전은 유지됩니다.</p></div><div class="field"><label for="decision-pr">관련 PR 링크 <span class="hint">선택</span></label><input id="decision-pr" aria-describedby="decision-error" type="url" maxlength="2048" placeholder="https://github.com/owner/repo/pull/1"></div><p id="decision-error" role="alert"></p>',()=>{
  const field=document.querySelector('#decision-body'),body=field.value.trim(),link=document.querySelector('#decision-pr').value.trim(),error=document.querySelector('#decision-error');
  field.removeAttribute('aria-invalid');document.querySelector('#decision-pr').removeAttribute('aria-invalid');error.textContent='';
  if(!body){field.setAttribute('aria-invalid','true');error.textContent='결정 내용을 입력해 주세요.';field.focus();return false}
  if(link&&!/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/pull\/[0-9]+$/.test(link)){error.textContent='GitHub PR 주소를 확인해 주세요.';document.querySelector('#decision-pr').setAttribute('aria-invalid','true');document.querySelector('#decision-pr').focus();return false}
  decisions.push({body,evidence:link,publication:'샘플 게시본 '+version,version});state='answered';render();notify('이 항목과 원래 버전에 샘플 결정을 기록했습니다. 실제 서버에는 쓰지 않았습니다.')
 })
}
function checkpoint(){const stored=checkpointMemory.get(checkpointKey()),status=state==='passed'?'통과':state==='withdrawn'?'철회':'검토 대기';return heading('체크포인트 검토','검토한 콘텐츠 버전에 대해 직접 결정합니다.','<button data-go="SCR-134">산출물 보기</button>')+'<section class="panel narrow"><div class="panel-body"><div class="row between"><span class="eyebrow">'+String(stage+1).padStart(2,'0')+' '+names[stage]+'</span>'+badge(status,state==='passed'?'success':'warning')+'</div><h2 style="font-size:var(--font-title);margin-top:var(--space-lg)">이 버전의 설계를 검토하셨나요?</h2><div class="review-version"><p class="mono">샘플 콘텐츠 버전 '+version+' · '+(version===3?'현재':'과거')+' 게시본</p><p>원본과 검토 범위, 선행 조건을 확인한 후 통과시킬 수 있습니다.</p><button data-action="source" style="margin-top:var(--space-lg)">원본과 변경 내용 보기</button></div><div class="check-row">'+icon('check')+'<span>'+(version===3?'게시된 콘텐츠와 검토 대상 버전이 같습니다.':'과거의 결정은 원래 콘텐츠 버전에서만 확인합니다.')+'</span></div><div class="check-row">'+icon('check')+'<span>선행 단계와 검토 범위를 표시합니다.</span></div><div class="check-row">'+icon('check')+'<span>AI 응답은 통과 결정의 권한을 갖지 않습니다.</span></div><div class="field"><label for="decision-reason">검토 메모 <span class="hint">선택</span></label><textarea id="decision-reason" maxlength="8000" placeholder="결정의 이유나 다음 단계에 전달할 내용을 적어 주세요.">'+esc(checkpointDrafts.get(checkpointKey())||'')+'</textarea></div><div class="row">'+(state==='passed'?'<button class="danger" data-action="withdraw">체크포인트 철회</button>':state==='withdrawn'?'<span class="muted">통과와 철회 이력을 유지합니다.</span><button data-action="review-again">이 버전 다시 검토하기</button>':'<button class="primary" data-action="pass" '+(state==='blocked'?'disabled aria-describedby="blocked-reason"':'')+'>이 버전 통과시키기 '+icon('check')+'</button><button data-go="SCR-135">먼저 질문하기</button>')+'</div>'+(state==='blocked'?'<p id="blocked-reason" class="hint">선행 단계와 남은 질문을 확인하기 전에는 통과시킬 수 없습니다.</p>':'')+(stored?'<p class="hint">이 버전의 샘플 결정 이력 '+stored.history.length+'개를 메모리에 유지합니다.</p>':'')+'<p class="hint" style="margin-top:var(--space-lg)">목업의 통과 동작은 샘플 상태만 바꿉니다. 실제 NEXUS 체크포인트를 변경하지 않습니다.</p></div></section>'}
function publications(){return heading('게시 상태','실제로 서버에 수신된 커밋과 리비전을 확인합니다.','<button data-action="refresh">수신 상태 새로고침</button>')+'<div class="notice '+(state==='skipped'?'warning':'')+'"><h2>'+(state==='skipped'?'자동 게시가 건너뛰어졌습니다.':'샘플 게시 수신 기록')+'</h2><p>'+(state==='skipped'?'필수 설정이 없어 전송되지 않았습니다. 성공한 CI 표시만으로 수신 처리하지 않습니다.':'실제 서비스에서는 서버가 보유한 커밋과 기본 브랜치를 비교합니다.')+'</p></div><div class="panel"><div class="panel-body"><dl class="keyval"><dt>수신 여부</dt><dd>'+badge(state==='skipped'?'전송되지 않음':'샘플 수신 상태',state==='skipped'?'warning':'success')+'</dd><dt>예상 원본</dt><dd>기본 브랜치 main · 샘플</dd><dt>보유 버전</dt><dd>샘플 버전 3 · 실제 커밋 아님</dd><dt>누락 설정</dt><dd class="mono">'+(state==='skipped'?'CORTHEX_NEXUS_URL / CLIENT_ID / CLIENT_SECRET':'샘플에서 설정하지 않음')+'</dd></dl></div></div><div class="row" style="margin-top:var(--space-xl)"><button data-go="SCR-138">게시 권한 설정</button><button data-go="SCR-139">버전 이력</button></div>'}
function credentials(){const role=credentialMemory.get(project)?.role||credentialRole;return heading('게시·에이전트 권한','프로젝트와 역할이 제한된 자격 증명을 관리합니다.','<button class="quiet" data-action="signout">로그아웃</button><button class="primary" data-action="issue">자격 증명 발급</button>')+'<div class="notice"><h2>비밀값은 발급할 때 한 번만 표시합니다.</h2><p class="muted">기존 값은 다시 조회할 수 없습니다. 잃어버렸다면 폐기하고 새로 발급하세요.</p></div>'+(state==='issued'?'<div class="review-version"><h2>일회성 값 · 샘플</h2><p class="mono">SAMPLE_ONLY_NOT_A_CREDENTIAL</p><p class="hint">이 문자열은 실제 자격 증명이 아닙니다. 페이지를 닫으면 다시 표시하지 않는 흐름을 검토합니다.</p><button data-state="secret-unavailable">표시 닫기</button></div>':'')+'<div class="panel"><div class="panel-body"><div class="row between"><div><h2>'+(role==='agent'?'에이전트 작업':'CI 게시')+' · 샘플</h2><p class="hint">역할: '+role+' / 범위: 이 프로젝트만</p></div>'+badge(state==='revoked'?'폐기':'메타데이터만 표시',state==='revoked'?'':'success')+'</div><div class="divider"></div><p class="muted">프로젝트 게시 권한은 사용자 체크포인트 통과 권한을 포함하지 않습니다.</p><button class="danger" data-action="revoke" style="margin-top:var(--space-xl)" '+(state==='revoked'?'disabled':'')+'>이 자격 증명 폐기</button></div></div>'}

function action(a){if(a==='pass'&&state==='blocked')return notify('선행 조건을 확인하기 전에는 통과시킬 수 없습니다.');if(a==='recover'){if(state==='stale')version=3;state=screen==='SCR-136'?checkpointState():'normal';render();document.querySelector('#page-title')?.focus({preventScroll:true});return}if(a==='review-again'){state='normal';render();return}if(a==='record-decision')return recordDecision();if(a==='signout'){threadMemory.clear();checkpointMemory.clear();checkpointDrafts.clear();credentialMemory.clear();credentialRole='publisher';connectConsent=null;Object.assign(connectDraft,{name:'새 샘플 프로젝트',repository:'',consent:false});decisions=[];messages=[];formDraft='';memory.clear();version=3;go('SCR-131');return notify('샘플 계정의 비공개 초안과 선택을 초기화했습니다.')}if(a==='source')return source();if(a==='pass'&&version!==3){state='stale';render();return notify('과거 버전입니다. 현재 게시본을 다시 검토해 주세요.')}if(a==='pass')return dialog('이 버전의 체크포인트 통과','<p>샘플 버전 '+version+'에 대한 검토를 완료한 것으로 표시할까요?</p><p class="hint">실제 NEXUS의 사용자 결정은 변경되지 않습니다.</p>',()=>{saveCheckpoint('passed');notify('샘플 체크포인트 상태를 통과로 바꿨습니다.')});if(a==='withdraw')return dialog('샘플 통과 철회','<p>이전 통과 이력을 유지하고 이후 단계의 완료 조건에 영향을 표시합니다.</p>',()=>{saveCheckpoint('withdrawn');notify('샘플 통과를 철회했습니다.')});if(a==='issue'){credentialMemory.set(project,{role:credentialRole,revoked:false});state='issued';render();return notify('실제 자격 증명을 발급하지 않았습니다.')}if(a==='revoke')return dialog('이 자격 증명을 폐기할까요?','<p>실제 구현에서는 해당 프로젝트·역할의 접근이 즉시 중단됩니다.</p>',()=>{credentialMemory.set(project,{role:credentialMemory.get(project)?.role||credentialRole,revoked:true});state='revoked';render()});if(a==='proposal'){state='proposal-unreflected';render();return notify('제안을 수락한 샘플입니다. 원본은 바뀌지 않았습니다.')}if(a==='reject')return notify('샘플 제안을 거절했습니다. 원래 대화는 유지됩니다.');if(a==='refresh')return notify('샘플 상태만 표시했습니다. 실제 서버 조회는 하지 않았습니다.');if(a==='copy-sample'){go('SCR-132');return notify('샘플 복사 흐름을 표시했습니다. 실제 프로젝트를 생성하지 않았습니다.')}if(a==='download'){const blob=new Blob(['# Synthetic NEXUS sample\n\nThis file contains no real project data.\n'],{type:'text/markdown'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='nexus-sample.md';link.click();URL.revokeObjectURL(url)}}
render();
