openapi: 3.1.0
info:
  title: NEXUS server
  version: 0.2.0
  summary: The requests that the NEXUS server of corthex-nexus 0.2 answers
  description: >-
    Stage 06 of CORTHEX's own project, for NEXUS: the requests of the NEXUS server, for the hub on
    a device, the picture view in a browser and the hub page. Drafted on 2026-11-02, while the
    memory plugin is being built, as the maintainer chose that day; the maintainer passed its
    checkpoint on 2026-11-03, together with those of stages 03 to 05, 07 and 08, so it is frozen
    for NEXUS 0.2, and a later breaking change needs the maintainer's decision. nexus.md beside
    this file explains it: the common rules of sign-in, write IDs, sessions, errors and headers,
    the hub's commands, the formats of the snapshot, the picture sources, the stage records and
    the outbox, the limits and the error codes with their messages. Every GET also answers HEAD
    with the same status and headers and no body, a method that a path does not take gets 405 with
    an Allow header, and every reply carries the security headers that nexus.md lists. The
    redesign's operations, API-151 to API-159, are active: the server answers them and the checks
    cover them. With the redesign's first page at /, the hub page moved to /hub (SPEC-153); the
    picture view and the stage overview keep their pages until the redesign's stages draw what
    they show, and then answer 302 to the stage's page (SPEC-154). The design revision of
    2026-11-11 adds what stage 04's rows SPEC-187 to SPEC-203 ask of the server, as planned
    forms that the server does not answer yet. Its new operations, API-177 and API-178, are in
    paths with the status planned. The planned form of each operation that it changes is a
    whole path item under components.pathItems, by the operation's code name, which the
    release that builds it puts into paths in place of the built operation. The fields that
    it adds to built answers are optional properties marked planned under x-corthex, which
    the built server does not send and which become required when their rows are built. Until
    then the built operations stay as the server answers them, and version stays 0.2.0 until
    a release first serves a changed contract (The design revision's interfaces in nexus.md).
servers:
  - url: https://nexus.example.com
    description: >-
      The address that the user set for their own server. Cloudflare Access protects all of it,
      and the server answers at no other address, such as workers.dev or a preview.
security:
  - accessUser: []
  - accessClientId: []
    accessClientSecret: []
tags:
  - name: Pages
    description: What a browser opens
  - name: Snapshots
    description: Pushes, removals and the stored snapshots (CTX-009)
  - name: Pictures
    description: The pictures and the stage overview (CTX-012, CTX-013, CTX-007)
  - name: Discussion
    description: Comments, replies, decisions and proposals (CTX-014)
  - name: Editing
    description: Pending reflections (CTX-010)
  - name: Stage progress
    description: The agent to-do, claims and checkpoints passed in NEXUS (CTX-007)
  - name: Workspace
    description: The redesign's first page, stages, items and search, and the design revision's project data and export

paths:
  /:
    get:
      operationId: getHomePage
      tags: [Pages]
      summary: The first page
      description: >-
        The redesign's first page (SCR-110), with the answer of getHome, read when the page is
        served, in its JSON script block (HomePageData). The server also draws the page's reading
        parts from that data, so that the page reads before its code runs (stage 08's rule 15); the
        code comes from /code/ and sends its requests only to this server. What follows # in the
        address, such as 0.2's q=, p= with id= and p= with s=, never reaches the server
        (SPEC-154). A refusal or an error is a page of the code's message when the request accepts
        text/html, as a browser's does, and Problem Details otherwise (Errors in nexus.md).
      x-corthex:
        id: API-155
        spec: [SPEC-113, SPEC-143, SPEC-144, SPEC-145, SPEC-154]
        status: active
        omit:
          "400": the request has no input
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "404": the path names no resource
          "409": a read clashes with no state
      responses:
        "200":
          description: The first page
          content:
            text/html:
              schema: {type: string}
              examples:
                page:
                  summary: The page, shortened
                  value: '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NEXUS</title><style data-nexus-css="page"></style></head><body class="nx" data-nx-page="home"><header class="tb" data-nx-part="top"></header><main class="home" id="main" data-nx-part="home"></main><script id="view-data" type="application/json">{"schema":"corthex-home-page/0.3","generated_at":"2026-11-08T08:30:00.000Z","lang":"en","data":{"generated_at":"2026-11-08T08:30:00.000Z","my_turn":{"total":0,"entries":[]},"agent":[],"projects":[]}}</script><script type="module" src="/code/page.3f9a1c2b.js"></script></body></html>'
        "403": {$ref: "#/components/responses/PageReadRefused"}
        default: {$ref: "#/components/responses/PageUnexpected"}

  /hub:
    get:
      operationId: getHubPage
      tags: [Pages]
      summary: The hub page
      description: >-
        The hub page of phase 1, at /hub since the redesign's first page took / (SPEC-153), and
        otherwise unchanged (SCR-117), with the page data corthex-hub-page/0.2 in its JSON script block
        (HubPageData): every stored snapshot and, for each project that has a space, its pictures,
        its counts of open comments, proposals and discrepancies, its checkpoints passed in NEXUS
        that wait for their records and its checkpoint-withdrawn warnings. A server that holds no
        snapshot shows how a project gets pushed. A refusal or an error is a page of the code's
        message when the request accepts text/html, as a browser's does, and Problem Details
        otherwise (Errors in nexus.md).
      x-corthex:
        id: API-101
        spec: [SPEC-113, SPEC-122, SPEC-123, SPEC-124, SPEC-125, SPEC-153]
        status: active
        omit:
          "400": the request has no input
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "404": the path names no resource
          "409": a read clashes with no state
      responses:
        "200":
          description: The hub page
          content:
            text/html:
              schema: {type: string}
              examples:
                page:
                  summary: The page, shortened
                  value: '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CORTHEX hub</title></head><body><script id="hub-data" type="application/json">{"schema":"corthex-hub-page/0.2","generated_at":"2026-11-03T01:00:00.000Z","lang":"en","origin":"server","projects":[],"spaces":{},"missing":[]}</script></body></html>'
        "403": {$ref: "#/components/responses/PageReadRefused"}
        default: {$ref: "#/components/responses/PageUnexpected"}

  /pictures/{project}/{part}/{stage}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Part"
      - $ref: "#/components/parameters/PictureStage"
    get:
      operationId: getPictureViewPage
      tags: [Pages]
      summary: The picture view of one part's picture
      description: >-
        The picture view, with the answer of getPicture in its JSON script block (ViewPageData).
        The page loads its code from /code/ only, lays the picture out, draws it and sends the
        user's writes to this server. When the space holds no picture of that part and stage, the
        page holds the problem picture_not_found instead, and shows why. A refusal or an error is
        a page of the code's message when the request accepts text/html, as a browser's does, and
        Problem Details otherwise (Errors in nexus.md).
      x-corthex:
        id: API-102
        spec: [SPEC-113, SPEC-119]
        status: active
        omit:
          "400": the request has no input; a path value in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The picture view
          content:
            text/html:
              schema: {type: string}
              examples:
                view:
                  summary: The page, shortened
                  value: '<!doctype html><html lang="en"><head><meta charset="utf-8"><script type="module" src="/code/view.3f9a1c2b.js"></script></head><body><script id="view-data" type="application/json">{"schema":"corthex-view-page/0.2","view":"picture","lang":"en","data":{},"problem":null}</script></body></html>'
        "403": {$ref: "#/components/responses/PageReadRefused"}
        "404": {$ref: "#/components/responses/PagePictureTargetNotFound"}
        default: {$ref: "#/components/responses/PageUnexpected"}

  /overview/{project}/{part}/{stage}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Part"
      - $ref: "#/components/parameters/Stage"
    get:
      operationId: getStageOverviewPage
      tags: [Pages]
      summary: The stage overview of one part's stage
      description: >-
        The stage overview, with the answer of getStageOverview in its JSON script block
        (ViewPageData), from which the user passes or withdraws the stage's checkpoint. A refusal
        or an error is a page of the code's message when the request accepts text/html, as a
        browser's does, and Problem Details otherwise (Errors in nexus.md).
      x-corthex:
        id: API-103
        spec: [SPEC-113, SPEC-138, SPEC-139]
        status: active
        omit:
          "400": the request has no input; a path value in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The stage overview
          content:
            text/html:
              schema: {type: string}
              examples:
                overview:
                  summary: The page, shortened
                  value: '<!doctype html><html lang="en"><head><meta charset="utf-8"><script type="module" src="/code/view.3f9a1c2b.js"></script></head><body><script id="view-data" type="application/json">{"schema":"corthex-view-page/0.2","view":"overview","lang":"en","data":{},"problem":null}</script></body></html>'
        "403": {$ref: "#/components/responses/PageReadRefused"}
        "404": {$ref: "#/components/responses/PageOverviewNotFound"}
        default: {$ref: "#/components/responses/PageUnexpected"}

  /code/{file}:
    parameters:
      - $ref: "#/components/parameters/File"
    get:
      operationId: getViewCode
      tags: [Pages]
      summary: One file of the view's code
      description: >-
        The view's scripts, styles and fonts, with the open-source editors of D11, served by the
        Worker from its own code and not as static assets, so that Access's check stays with the
        Worker. Each name carries a digest of its content. Unlike every other reply, these may be
        kept by the browser, since they hold no project data, as SPEC-113 allows since this
        stage's checkpoint (Changes to earlier stages in nexus.md).
      x-corthex:
        id: API-104
        spec: [SPEC-113, SPEC-119]
        status: active
        omit:
          "400": the request has no input; a name in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The file
          headers:
            Cache-Control:
              schema: {type: string, const: "public, max-age=31536000, immutable"}
          content:
            text/javascript:
              schema: {type: string}
              examples:
                script: {value: "export function draw(picture, frame) { /* … */ }"}
            text/css:
              schema: {type: string}
              examples:
                styles: {value: ".view { margin: 0 }"}
            font/woff2:
              schema: {type: string, contentMediaType: font/woff2}
              examples:
                font: {summary: The font's bytes, value: "wOF2"}
        "403": {$ref: "#/components/responses/ReadRefused"}
        "404":
          description: No such file
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                not-found: {$ref: "#/components/examples/not_found"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/snapshots:
    post:
      operationId: pushSnapshot
      tags: [Snapshots]
      summary: Push a snapshot
      description: >-
        Stores a project's snapshot, corthex-hub/0.1 or 0.2, if it is the next version of the one
        that the server holds. For 0.2 the same request makes the project's space, draws its
        pictures, cross-checks its parts and marks the checkpoints that its stage records name,
        all of it or none (A push in nexus.md). The hub asks getHeldCommit first. A snapshot of
        0.1 gets the answer of phase 1. Either kind of sign-in may push; a browser's push from
        another site is refused.
      x-corthex:
        id: API-105
        spec: [SPEC-111, SPEC-112, SPEC-113, SPEC-114, SPEC-117, SPEC-118, SPEC-120, SPEC-121, SPEC-140]
        status: active
        omit:
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "404": the path names no resource; a project that the server does not hold is stored as a new one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Snapshot01"
                - $ref: "#/components/schemas/Snapshot02"
              discriminator:
                propertyName: schema
                mapping:
                  corthex-hub/0.1: "#/components/schemas/Snapshot01"
                  corthex-hub/0.2: "#/components/schemas/Snapshot02"
            examples:
              snapshot-0-2: {$ref: "#/components/examples/snapshot_02"}
              snapshot-0-1: {$ref: "#/components/examples/snapshot_01"}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PushAnswer02"
                  - $ref: "#/components/schemas/PushAnswer01"
              examples:
                stored-0-2:
                  summary: A snapshot of 0.2, with one picture drawn again
                  value:
                    name: corthex
                    revision: 13
                    default_commit: 3f1c9a7e5b2d4c6a8e0f1b3d5c7a9e1f2b4d6c8a
                    replaced: c0ffee5e7a1b2c3d4e5f60718293a4b5c6d7e8f9
                    pictures:
                      drawn: [{part: nexus, stage: 05-erd}]
                      current_again: []
                      not_current: [{part: memory, stage: 01-domain, why: size}]
                      unchanged: 3
                    discrepancies: {opened: 1, resolved: 2, open: 7, not_opened: 0}
                    checkpoints: {recorded: 1, withdrawn_recorded: []}
                    todo: {comments: 2, discrepancies: 7, reflections: 1, checkpoints: 0}
                stored-0-1:
                  summary: A snapshot of 0.1, as phase 1 answers
                  value: {name: corthex, revision: 3}
        "400":
          description: Not a snapshot that the server takes
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                invalid-snapshot: {$ref: "#/components/examples/invalid_snapshot"}
                clock-ahead: {$ref: "#/components/examples/clock_ahead"}
        "403": {$ref: "#/components/responses/WriteRefused"}
        "409":
          description: Not the next version, or no room
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                older-snapshot: {$ref: "#/components/examples/older_snapshot"}
                commit-not-replaced: {$ref: "#/components/examples/commit_not_replaced"}
                too-many-projects: {$ref: "#/components/examples/too_many_projects"}
                repository-mismatch: {$ref: "#/components/examples/repository_mismatch"}
        "413":
          description: Larger than 1 MiB
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                snapshot-too-large: {$ref: "#/components/examples/snapshot_too_large"}
        "415": {$ref: "#/components/responses/NeedsJson"}
        default: {$ref: "#/components/responses/Unexpected"}
    get:
      operationId: listSnapshots
      tags: [Snapshots]
      summary: The stored snapshots
      x-corthex:
        id: API-106
        spec: [SPEC-113, SPEC-122]
        status: built
        omit:
          "400": the request has no input
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "404": the path names no resource; an empty server answers an empty list
          "409": a read clashes with no state
      responses:
        "200":
          description: Each stored snapshot's name, revision, times and size
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SnapshotList"}
              examples:
                two-projects:
                  value:
                    projects:
                      - {name: corthex, revision: 13, generated_at: "2026-11-03T10:00:00+09:00", received_at: "2026-11-03T01:00:02.417Z", bytes: 412337}
                      - {name: leetmaster-v3, revision: 4, generated_at: "2026-11-02T21:12:40+09:00", received_at: "2026-11-02T12:12:41.003Z", bytes: 90211}
                empty:
                  value: {projects: []}
        "403": {$ref: "#/components/responses/ReadRefused"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/snapshots/{project}:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getSnapshot
      tags: [Snapshots]
      summary: The stored snapshot of a project
      description: >-
        The snapshot as stored. From 0.2 it is the pushed snapshot without its pictures
        (StoredSnapshot02), whose sources the pictures keep (getPicture reads them).
      x-corthex:
        id: API-107
        spec: [SPEC-113, SPEC-122]
        status: built
        omit:
          "400": the request has no input; a name in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The stored snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Snapshot01"
                  - $ref: "#/components/schemas/StoredSnapshot02"
                discriminator:
                  propertyName: schema
                  mapping:
                    corthex-hub/0.1: "#/components/schemas/Snapshot01"
                    corthex-hub/0.2: "#/components/schemas/StoredSnapshot02"
              examples:
                stored-0-2: {$ref: "#/components/examples/snapshot_02_stored"}
                stored-0-1: {$ref: "#/components/examples/snapshot_01"}
        "403": {$ref: "#/components/responses/ReadRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        default: {$ref: "#/components/responses/Unexpected"}
    delete:
      operationId: removeProject
      tags: [Snapshots]
      summary: Remove a project
      description: >-
        Deletes the project's snapshot and, with it, its space and everything in the space. The
        hub sends it only after the user confirmed the dry run of getRemovalDryRun. Either kind of
        sign-in may remove; a browser's removal from another site is refused.
      x-corthex:
        id: API-108
        spec: [SPEC-113, SPEC-115]
        status: active
        omit:
          "400": the request has no body; a name in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": no state holds a removal back, since the user confirmed the dry run
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Removed"}
              examples:
                removed: {value: {name: corthex, removed: true}}
        "403": {$ref: "#/components/responses/WriteRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/snapshots/{project}/held:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getHeldCommit
      tags: [Snapshots]
      summary: The default branch commit that the server holds for a project
      description: >-
        What the hub asks before a push: the stored snapshot's revision and the default branch
        commit that its pictures and stage records came from. A server of phase 1 answers 404
        without a code, from which the hub knows that the server needs the 0.2 release.
      x-corthex:
        id: API-109
        spec: [SPEC-111, SPEC-112, SPEC-113]
        status: active
        omit:
          "400": the request has no input; a name in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The held commit, or null for a snapshot of 0.1 or one without a default branch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Held"}
              examples:
                held:
                  value: {project: corthex, revision: 12, default_commit: c0ffee5e7a1b2c3d4e5f60718293a4b5c6d7e8f9, generated_at: "2026-11-02T23:20:00+09:00", received_at: "2026-11-02T14:20:01.950Z"}
                no-commit:
                  summary: A snapshot of 0.1 is stored
                  value: {project: corthex, revision: 3, default_commit: null, generated_at: "2026-10-24T12:00:00+09:00", received_at: "2026-10-24T03:00:00.512Z"}
        "403": {$ref: "#/components/responses/ReadRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/snapshots/{project}/removal:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getRemovalDryRun
      tags: [Snapshots]
      summary: What a removal would delete
      description: >-
        The dry run that the hub shows before the user confirms a removal: how much the removal
        deletes, and by ID, up to 20 of each with their totals, the open comments, the open
        proposals, the pending reflections and the checkpoints passed in NEXUS that no stage
        record names yet.
      x-corthex:
        id: API-110
        spec: [SPEC-113, SPEC-115]
        status: active
        omit:
          "400": the request has no input; a name in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The dry run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemovalDryRun"}
              examples:
                open-entries:
                  value:
                    project: corthex
                    deletes: {snapshot: true, space: true, pictures: 5, discrepancies: 21, comments: 14, replies: 40, decisions: 6, proposals: 5, edits: 3, checkpoints: 4}
                    open:
                      comments: {total: 3, ids: [nc_3a6d9g2j5m8r, nc_8k1n4q7s0v3y, nc_5s8v1y4b7e0h]}
                      proposals: {total: 1, ids: [np_2b5e8g1j4m7p]}
                      reflections: {total: 1, ids: [ne_9c3f6h2k5n8q]}
                      checkpoints: {total: 0, ids: []}
                snapshot-only:
                  summary: A project pushed only by a hub of 0.1, without a space
                  value:
                    project: leetmaster-v3
                    deletes: {snapshot: true, space: false, pictures: 0, discrepancies: 0, comments: 0, replies: 0, decisions: 0, proposals: 0, edits: 0, checkpoints: 0}
                    open:
                      comments: {total: 0, ids: []}
                      proposals: {total: 0, ids: []}
                      reflections: {total: 0, ids: []}
                      checkpoints: {total: 0, ids: []}
        "403": {$ref: "#/components/responses/ReadRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/spaces/{project}/pictures/{part}/{stage}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Part"
      - $ref: "#/components/parameters/PictureStage"
    get:
      operationId: getPicture
      tags: [Pictures]
      summary: A picture with what is open on it
      description: >-
        What the picture view shows: the picture source with its document version and whether it
        is current, the open comments on it with their last replies, its closed comments by ID,
        its open proposals, its pending reflections and the open discrepancies of its part that
        concern it. The view finds which entries are apart, since only it reads the source's
        items; it reads a whole comment with getComment and a proposal's stage source text with
        getProposal.
      x-corthex:
        id: API-111
        spec: [SPEC-113, SPEC-118, SPEC-119, SPEC-141]
        status: active
        omit:
          "400": the request has no input; a path value in another form gets 404
          "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
          "409": a read clashes with no state
      responses:
        "200":
          description: The picture and what is open on it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PictureData"}
              examples:
                erd-with-a-comment: {$ref: "#/components/examples/picture_data"}
                domain-board: {$ref: "#/components/examples/picture_data_domain"}
                sitemap: {$ref: "#/components/examples/picture_data_sitemap"}
        "403": {$ref: "#/components/responses/ReadRefused"}
        "404":
          description: No such project, space, part or picture, or a stage without pictures
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                picture-not-found: {$ref: "#/components/examples/picture_not_found"}
                left-out-for-size: {$ref: "#/components/examples/picture_left_out"}
