        "403": {$ref: "#/components/responses/ReadRefused"}
        "404": {$ref: "#/components/responses/ProjectNotFound"}
        default: {$ref: "#/components/responses/Unexpected"}

  /api/spaces/{project}/export:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: exportProject
      tags: [Workspace]
      summary: Export what a project's space holds and Git does not
      description: >-
        One JSON file with what the project's space holds and Git does not (SPEC-201): the
        comments with their replies and the decisions recorded on them, the proposals, the
        edits and the checkpoints passed in NEXUS, under a head that names the project, the
        commit that the project shows, the server's time, the agent's last read, the format's
        version and how many of each kind the file holds. Only the user asks for it, under their
        own sign-in; the service token is refused, and so is a request that a page of another
        site starts, the one read that the server checks for that. The server builds the file as
