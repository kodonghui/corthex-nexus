          "404":
            description: No such project, space or comment
            content:
              application/problem+json:
                schema: {$ref: "#/components/schemas/Problem"}
                examples:
                  comment-not-found: {$ref: "#/components/examples/comment_not_found"}
                  project-not-found: {$ref: "#/components/examples/project_not_found"}
                  space-not-found: {$ref: "#/components/examples/space_not_found"}
          "409":
            description: Nothing to take, as for a checkpoint request, at a limit, or the write ID was taken
            content:
              application/problem+json:
                schema: {$ref: "#/components/schemas/Problem"}
                examples:
                  not-recommended: {$ref: "#/components/examples/not_recommended_planned"}
                  reply-limit: {$ref: "#/components/examples/reply_limit"}
                  space-full: {$ref: "#/components/examples/space_full"}
                  write-id-reused: {$ref: "#/components/examples/write_id_reused"}
          default: {$ref: "#/components/responses/Unexpected"}
    removeProject:
      parameters:
        - $ref: "#/components/parameters/Project"
      delete:
        tags: [Snapshots]
        summary: Remove a project, under the user's own sign-in
        description: >-
          The planned form of removeProject (SPEC-202, REQ-293): only the user removes a project,
          from the panel of the project's data (SCR-130), where the page shows what the removal
          deletes, as getProjectData gives it, offers the export and has the user type the
          project's name. The typed name is the page's check, and the request takes no body. The
          server deletes the snapshot and, with it, the space and everything in it, in one
          transaction. A removal that carries the service token is 403 user_only, whose detail
          says where the user removes, so that no session, push job or hub can delete a space;
          the hub's remove only shows the dry run and that address. A project that the server
          does not hold, as when the removal is sent twice, is 404.
        security:
          - accessUser: []
        x-corthex:
          id: API-108
          replaces: removeProject
          spec: [SPEC-113, SPEC-115, SPEC-116, SPEC-202]
          status: planned
          omit:
            "400": the request has no body; a name in another form gets 404
            "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
            "409": no state holds a removal back, since the user typed the project's name
        responses:
          "200":
            description: Removed
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Removed"}
                examples:
                  removed: {value: {name: corthex, removed: true}}
          "403":
            description: Refused by the access checks, or not a person's own sign-in
            content:
              application/problem+json:
                schema: {$ref: "#/components/schemas/Problem"}
                examples:
                  user-only: {$ref: "#/components/examples/user_only_removal"}
                  access-missing: {$ref: "#/components/examples/access_missing"}
                  access-other-app: {$ref: "#/components/examples/access_other_app"}
                  cross-site: {$ref: "#/components/examples/cross_site"}
                  no-kind: {$ref: "#/components/examples/no_kind"}
          "404": {$ref: "#/components/responses/ProjectNotFound"}
          default: {$ref: "#/components/responses/Unexpected"}
    getHome:
      get:
        tags: [Workspace]
        summary: The first page's data, with the last reads and the checkpoint requests whole
        description: >-
          The planned form of getHome: as now, with what the design revision of 2026-11-11 adds.
          Each project's entry of agent names read_at, when the agent last read its agent to-do
          (SPEC-187, SPEC-188); unread, how many of its entries the agent has not read yet
          (SPEC-189); and unread_since, the oldest time since which one of those waits, from
          which the page tells a wait of more than 24 hours. A card already holds pushed_at, when
          the server stored the snapshot, and commit, which the page shows as the last push; a
          card whose project has no entry in agent is of a project without a space, which has no
          agent to-do yet. Open under D17 of stage 02: each card names the snapshot's revision,
          and an entry of my turn that is a checkpoint request in form holds request, the request
          whole, so that the entry may offer the pass as its second action, with passCheckpoint
          (SPEC-196); request is null for any other entry.
        x-corthex:
          id: API-151
          replaces: getHome
          spec: [SPEC-113, SPEC-143, SPEC-144, SPEC-145, SPEC-188, SPEC-189, SPEC-196]
          status: planned
          omit:
            "400": the request has no input
            "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
            "404": the path names no resource
            "409": a read clashes with no state
        responses:
          "200":
            description: The first page's data
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Home"}
                examples:
                  waiting: {$ref: "#/components/examples/home_planned"}
                  empty-server:
                    summary: No snapshot on the server
                    value: {generated_at: "2026-11-11T08:30:00.000Z", my_turn: {total: 0, entries: []}, agent: [], projects: []}
          "403": {$ref: "#/components/responses/ReadRefused"}
          default: {$ref: "#/components/responses/Unexpected"}
    getStage:
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Part"
        - $ref: "#/components/parameters/Stage"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/StageFilter"
        - $ref: "#/components/parameters/StageWords"
        - $ref: "#/components/parameters/Group"
      get:
        tags: [Workspace]
        summary: One part's stage, with the project's last push and the agent's last read
        description: >-
          The planned form of getStage: as now, with what the design revision of 2026-11-11 adds.
          project names space, whether the project has a space; read_at, when the agent last
          read its agent to-do; and unread_since, as getHome gives it, for the head of the
          workspace (SPEC-188); with pushed_at and commit, which it holds already. Open under D17
          of stage 02, it also names the snapshot's revision, which a pass names where the
          snapshot names no commit (SPEC-194). The stage's record shows the stage's open
          checkpoint request whole above the pass (SPEC-139): the page takes it from the talk's
          my turn (getStageTalk), the open comment on the stage as a whole whose asks is
          checkpoint, with its last entry's text and look_first, and names in the pass the
          comment and the place of that entry, the last reply's seq or 0. The record's
          checkpoints passed in NEXUS hold what was seen and the kind of browser and device
          (SPEC-194, SPEC-195).
        x-corthex:
          id: API-158
          replaces: getStage
          spec: [SPEC-113, SPEC-139, SPEC-146, SPEC-147, SPEC-148, SPEC-188, SPEC-194, SPEC-195]
          status: planned
          omit:
            "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
            "409": a read clashes with no state
        responses:
          "200":
            description: The stage
            content:
              application/json:
                schema: {$ref: "#/components/schemas/StageData"}
                examples:
                  spec-with-a-request: {$ref: "#/components/examples/stage_data_planned"}
          "400": {$ref: "#/components/responses/InvalidQuery"}
          "403": {$ref: "#/components/responses/ReadRefused"}
          "404": {$ref: "#/components/responses/OverviewNotFound"}
          default: {$ref: "#/components/responses/Unexpected"}
    getStageTalk:
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Part"
        - $ref: "#/components/parameters/Stage"
        - $ref: "#/components/parameters/TalkItem"
        - $ref: "#/components/parameters/Closed"
        - $ref: "#/components/parameters/After"
      get:
        tags: [Discussion]
        summary: One part's stage talk, by turn, with what the agent has not read
        description: >-
          The planned form of getStageTalk: as now, with what the design revision of 2026-11-11
          adds. Each comment and each pending reflection names unread, whether the agent has not
          read it yet (SPEC-189): true while it waits for the agent, no claim holds it, and the
          time since which it waits is at or after the space's last read, or the space was never
          read. A claimed entry shows as taken, without the mark, and an entry that waits for the
          user or is closed is never unread. Each comment and reply names look_first, so that the
          talk and the stage's record show a checkpoint request whole (SPEC-197, SPEC-139). The
          marks come with the read; the page does not update them by itself. The item's talk of
          getItem and the pages' data hold the same fields.
        x-corthex:
          id: API-152
          replaces: getStageTalk
          spec: [SPEC-113, SPEC-136, SPEC-150, SPEC-189, SPEC-197]
          status: planned
          omit:
            "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
            "409": a read clashes with no state
        responses:
          "200":
            description: The talk
            content:
              application/json:
                schema: {$ref: "#/components/schemas/StageTalk"}
                examples:
                  by-turn: {$ref: "#/components/examples/stage_talk_planned"}
                  nothing-yet:
                    summary: No talk on the stage yet
                    value: {project: corthex, part: nexus, stage: 13-presentation, item: null, mine: {total: 0, entries: []}, agent: {total: 0, entries: []}, apart: {total: 0, entries: []}, closed: {total: 0, entries: []}, reflections: []}
          "400": {$ref: "#/components/responses/InvalidQuery"}
          "403": {$ref: "#/components/responses/ReadRefused"}
          "404": {$ref: "#/components/responses/TalkNotFound"}
          default: {$ref: "#/components/responses/Unexpected"}

  x-corthex:
    errors:
      invalid_request: {status: 400, meaning: "a field, a header or the body is not in its form; field names it", message: "This is not valid: check the marked field", client: "the view shows the message by the field; the hub reports the field and drops the write from its outbox"}
      invalid_snapshot: {status: 400, meaning: "the snapshot is not in the format corthex-hub/0.1 or 0.2; field names the first bad field", message: "The snapshot is not valid", client: "the hub reports the field and keeps nothing to send again"}
      clock_ahead: {status: 400, meaning: "the snapshot is dated more than 10 minutes ahead of the server's clock", message: "The snapshot is dated in the future. Check the device's clock", client: "the hub reports it"}
      unknown_item: {status: 400, meaning: "a proposal names items that its picture does not hold and that adds does not name; items names them", message: "The proposal names items that are not in the picture", client: "the hub reports the items, and the agent checks the stage source"}
      access_missing: {status: 403, meaning: "Cloudflare Access did not check the request", message: "Cloudflare Access did not check this request. Protect the server with Access first", client: "the hub reports a refused token; the view says that the sign-in is missing and offers to load again"}
      access_other_app: {status: 403, meaning: "another Access application than ACCESS_AUD names checked the request", message: "This request was checked for another Access application", client: "as for access_missing"}
      cross_site: {status: 403, meaning: "a browser sent a change from another site", message: "A change from another site is refused", client: "the view offers to open the page at the server's own address"}
      user_only: {status: 403, meaning: "the request needs a person's own sign-in; needs is user", message: "Only you can do this, signed in yourself", client: "the hub reports that the user does this in the view"}
      agent_only: {status: 403, meaning: "the request needs the service token; needs is agent", message: "Only the agent does this, through the hub", client: "the view never sends it; the hub reports a missing or refused service token"}
      no_kind: {status: 403, meaning: "Access let the request in, but its identity is neither a person's sign-in nor the service token", message: "This sign-in cannot write here", client: "the view and the hub report it, and the user checks the Access policy"}
      not_found: {status: 404, meaning: "no such path, or no such file of the view's code", message: "Not found", client: "the view links to the hub page"}
      project_not_found: {status: 404, meaning: "the server holds no snapshot of the project", message: "This project is not on the server", client: "the hub reports nothing to remove or read; a push stores the project as a new one"}
      space_not_found: {status: 404, meaning: "the project has no space, since only hubs of 0.1 pushed it", message: "This project has no pictures on the server yet. Push it with corthex-nexus 0.2", client: "the hub says so and sends nothing"}
      part_not_found: {status: 404, meaning: "the stored snapshot does not hold the part", message: "This part is not in the project's snapshot", client: "the view links to the hub page"}
      picture_not_found: {status: 404, meaning: "the space holds no picture of the part and stage; why says whether none was drawn yet, the snapshot left it out for its size or its source is in another repository", message: "No picture is drawn yet for this stage and part", client: "the view shows the empty state with why"}
      comment_not_found: {status: 404, meaning: "the space holds no such comment", message: "This comment is not on the server", client: "the view loads the picture again; the hub reports it and drops the write"}
      discrepancy_not_found: {status: 404, meaning: "the part holds no such discrepancy", message: "This discrepancy is not on the server", client: "as for comment_not_found"}
      proposal_not_found: {status: 404, meaning: "the space holds no such proposal", message: "This proposal is not on the server", client: "as for comment_not_found"}
      edit_not_found: {status: 404, meaning: "the space holds no such edit", message: "This reflection is not on the server", client: "as for comment_not_found"}
      checkpoint_not_found: {status: 404, meaning: "the space holds no such checkpoint", message: "This checkpoint is not on the server", client: "the overview loads again; the hub reports it, and the agent writes no record of it"}
      entry_not_found: {status: 404, meaning: "the space holds no comment, discrepancy, edit or checkpoint with that ID", message: "This entry is not on the server", client: "the hub reports it and leaves the entry"}
      item_not_found: {status: 404, meaning: "no stage of the project's stored snapshot holds the item", message: "This item is not in this project's stages now", client: "the view says so with the item's ID, shows the talk that still names it apart and offers to search every project"}
      method_not_allowed: {status: 405, meaning: "the path does not take the method; Allow names those that it takes", message: "This request is not allowed here", client: "the hub reports it as a fault of its own"}
      older_snapshot: {status: 409, meaning: "a snapshot of the held commit, or of a project that holds none, made earlier than the stored one; stored_at says when that was made", message: "The server holds a newer snapshot", client: "the hub takes a fresh snapshot and pushes again"}
      commit_not_replaced: {status: 409, meaning: "a snapshot of another commit than the held one that does not name the held one as the one it replaces, one without a commit where the stored snapshot has one, or a push that another push overtook; held_commit names the held commit", message: "The server holds another commit. Fetch the default branch and push again", client: "the agent fetches and pushes again, once"}
      too_many_projects: {status: 409, meaning: "the server holds 30 projects, and the snapshot is of a new one", message: "The server holds 30 projects. Remove one first", client: "the hub reports it"}
      repository_mismatch: {status: 409, meaning: "the snapshot's repository address is not the one that the space is bound to; bound names it", message: "This project's space is bound to another repository", client: "the hub names both addresses and says that a removal unbinds the space"}
      comment_limit: {status: 409, meaning: "the space holds 2,000 comments", message: "This project holds as many comments as it may", client: "the view keeps the text and says so"}
      reply_limit: {status: 409, meaning: "the comment holds 200 replies", message: "This comment holds as many replies as it may. Leave a new comment", client: "the view keeps the text and offers a new comment"}
      proposal_limit: {status: 409, meaning: "the space holds 500 open proposals", message: "This project holds as many open proposals as it may", client: "the hub reports it, and the agent withdraws proposals that the stage sources passed"}
      reflection_limit: {status: 409, meaning: "the space holds 500 pending reflections", message: "This project holds as many pending reflections as it may", client: "the view says so, and the proposal stays open"}
      space_full: {status: 409, meaning: "the write would take the text of the space past 8 MiB", message: "This project's space is full", client: "the view keeps the text; the hub reports it"}
      comment_closed: {status: 409, meaning: "the agent wrote on a closed comment, which only the user's reply opens again", message: "This comment is closed", client: "the hub reports it, and the agent leaves the comment"}
      proposal_not_open: {status: 409, meaning: "the proposal is accepted, dismissed or withdrawn already; state says which", message: "This proposal is no longer open", client: "the view shows its state"}
      edit_state: {status: 409, meaning: "the report or the dismissal does not fit the edit's state; state says which it is", message: "This reflection is in another state", client: "the view loads it again; the hub reports the state"}
      pull_request_reported: {status: 409, meaning: "another reported pull request still holds the reflection or the checkpoint; pull_request names it", message: "A pull request holds this already", client: "the hub reports the pull request, and the agent leaves the entry"}
      pull_request_mismatch: {status: 409, meaning: "the report names another pull request than the one reported for the entry; pull_request names that one", message: "This is not the reported pull request", client: "the hub reports both pull requests"}
      claimed: {status: 409, meaning: "another agent session claims the entry; ends_at says until when", message: "Another session holds this", client: "the hub skips the entry until the claim ends"}
      entry_closed: {status: 409, meaning: "a claim on a closed entry", message: "This entry is closed", client: "the hub skips it"}
      checkpoint_recorded: {status: 409, meaning: "a stored stage record names the checkpoint, so withdrawing it would change a recorded decision", message: "This checkpoint is recorded. Changing it is a new decision", client: "the overview shows the record"}
      checkpoint_withdrawn: {status: 409, meaning: "the checkpoint was withdrawn, so no new record pull request may write it", message: "This checkpoint was withdrawn", client: "the hub reports it, and the agent writes no record"}
      checkpoint_state: {status: 409, meaning: "the checkpoint has no reported open record pull request for merged or closed, or is already recorded for opened", message: "Read the checkpoint's current record state before reporting", client: "the hub reports it, and the agent reads the checkpoint again"}
      not_recommended: {status: 409, meaning: "the comment no longer waits for the user, or its last entry asks for no recommendation or checkpoint to take", message: "This no longer waits for your answer", client: "the view marks the entry as answered or closed meanwhile and reads my turn again"}
      write_id_reused: {status: 409, meaning: "the write ID was taken by another request", message: "This write could not be sent. Try again", client: "the view makes a new ID; the hub reports it as a fault of its own"}
      snapshot_too_large: {status: 413, meaning: "the snapshot is larger than 1 MiB", message: "The snapshot is larger than the server takes", client: "the hub reports it; its own limits keep snapshots smaller"}
      body_too_large: {status: 413, meaning: "a write's body is larger than 256 KiB", message: "This is larger than the server takes", client: "the view and the hub report it"}
      text_too_long: {status: 413, meaning: "a text is longer than its limit; field and limit name them", message: "This text is too long", client: "the view counts down by the field; the hub reports the field"}
      json_required: {status: 415, meaning: "a body that is not sent as application/json", message: "This could not be sent", client: "the hub reports it as a fault of its own"}
      internal: {status: 500, meaning: "an error inside the server; its log holds only the kind of error and the trace ID", message: "Something went wrong. Try again", client: "the view keeps what it holds and offers to send again; the hub keeps the write in its outbox"}
    planned_errors:
      checkpoint_requested: {status: 409, meaning: "the part's stage has an open checkpoint request already; comment names it", message: "This stage has an open checkpoint request", client: "the hub sends the request as a reply on the named comment; the view never sends a request"}
      snapshot_changed: {status: 409, meaning: "the stored snapshot has another commit than the pass named, or another revision where it names no commit; held_commit names the commit, or revision the revision", message: "The project now shows another commit. Look again before you pass", client: "the view keeps the user's words, reads the stage again and shows it as it is now"}
      request_changed: {status: 409, meaning: "the checkpoint request that the pass named is closed, has a newer last entry, no longer asks for the checkpoint or is on another part or stage, or the stage has an open request that the pass did not name; comment and entry name the stage's open request and its last entry, when there is one", message: "The checkpoint request changed. Read it again before you pass", client: "the view keeps the user's words and shows the request as it is now"}
      not_recommended: {status: 409, meaning: "the comment no longer waits for the user, or its last entry asks for no recommendation to take; a checkpoint request is passed and not taken. Replaces the entry of errors when API-159's planned form is built", message: "This no longer waits for your answer", client: "the view marks the entry as answered or closed meanwhile and reads my turn again"}
      cross_site: {status: 403, meaning: "a browser sent a change, or asked for a project's export, from another site. Replaces the entry of errors when API-178 is built, and the code's title becomes A request from another site", message: "A request from another site is refused", client: "the view offers to open the page at the server's own address"}
