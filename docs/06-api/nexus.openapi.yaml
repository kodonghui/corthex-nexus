            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              context: {$ref: "#/components/schemas/ItemRef"}
              terms:
                description: The TERM IDs in the table's comment, empty for terms none, and left out when the comment says neither
                type: array
