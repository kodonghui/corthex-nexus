                  type: object
                  required: [name, type, "null", where]
                  additionalProperties: false
                  properties:
                    name: {$ref: "#/components/schemas/Name"}
                    type: {$ref: "#/components/schemas/Name"}
                    "null": {type: boolean}
                    where: {$ref: "#/components/schemas/Where"}
              primary_key: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
              unique:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [columns, partial]
                  additionalProperties: false
                  properties:
                    columns: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    partial: {type: boolean}
              foreign_keys:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [columns, table, references, on_delete, where]
                  additionalProperties: false
                  properties:
                    columns: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    table: {$ref: "#/components/schemas/Name"}
                    references: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    on_delete: {type: string, enum: [cascade, set null, set default, restrict, no action, ""]}
                    where: {$ref: "#/components/schemas/Where"}
        without_table: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/TraceId"}}
    SitemapSource:
      type: object
      required: [format, screens, without_screen]
      additionalProperties: false
      properties:
        format: {const: 1}
        screens:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, name, path, access, flows, context, removed, where]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              path: {$ref: "#/components/schemas/Words"}
              access: {$ref: "#/components/schemas/Name"}
              flows: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
              parent:
                description: The parent's place in screens, left out for a screen at the top
                type: integer
                minimum: 0
              context: {$ref: "#/components/schemas/ItemRef"}
              terms:
                description: The TERM IDs under the screen's terms, empty for terms none or an empty list, and left out when it says neither
                type: array
                maxItems: 20
                items: {$ref: "#/components/schemas/TraceId"}
              removed: {type: boolean}
              where: {$ref: "#/components/schemas/Where"}
        without_screen: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/TraceId"}}

    PushAnswer01:
