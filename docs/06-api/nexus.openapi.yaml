            pictures: {type: integer, minimum: 0}
            discrepancies: {type: integer, minimum: 0}
            comments: {type: integer, minimum: 0}
            replies: {type: integer, minimum: 0}
            decisions: {type: integer, minimum: 0}
            proposals: {type: integer, minimum: 0}
            edits: {type: integer, minimum: 0}
            checkpoints: {type: integer, minimum: 0}
        open:
          type: object
          required: [comments, proposals, reflections, checkpoints]
          additionalProperties: false
          properties:
            comments: {$ref: "#/components/schemas/IdList"}
            proposals: {$ref: "#/components/schemas/IdList"}
            reflections: {$ref: "#/components/schemas/IdList"}
            checkpoints: {$ref: "#/components/schemas/IdList"}

    Comment:
      type: object
      required: [id, part, stage, item, quote, discrepancy, commit, author, text, state, closed_as, waits, asks, settled, dismissed, made_at, last_at]
      properties:
        id: {$ref: "#/components/schemas/CommentId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        item: {$ref: "#/components/schemas/ItemRef"}
        quote: {type: [string, "null"], maxLength: 300}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        commit: {$ref: "#/components/schemas/Commit"}
        author: {$ref: "#/components/schemas/Author"}
        text: {type: string, maxLength: 4000}
        state: {type: string, enum: [open, closed]}
        closed_as: {enum: [answered, decided, null]}
        waits: {enum: [user, agent, null]}
        asks: {description: "What the agent's last entry asks of the user while the comment waits for the user (SPEC-143)", enum: [answer, recommended, checkpoint, null]}
        settled: {type: boolean}
        dismissed: {type: boolean}
        made_at: {$ref: "#/components/schemas/Time"}
        last_at: {$ref: "#/components/schemas/Time"}
        look_first:
          description: >-
            The thing to look at first of a checkpoint request, a trace ID or an https address
            (SPEC-197, SPEC-198); null for any other comment, and for a request stored before
            the revision, which the pages show without a pass (SPEC-196)
          x-corthex: {status: planned, spec: [SPEC-197, SPEC-198]}
          anyOf: [{$ref: "#/components/schemas/TraceId"}, {$ref: "#/components/schemas/Link"}, {type: "null"}]
    CommentState:
      type: object
      required: [id, state, closed_as, waits, asks, settled, dismissed, last_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/CommentId"}
        state: {type: string, enum: [open, closed]}
        closed_as: {enum: [answered, decided, null]}
        waits: {enum: [user, agent, null]}
        asks: {enum: [answer, recommended, checkpoint, null]}
        settled: {type: boolean}
        dismissed: {type: boolean}
        last_at: {$ref: "#/components/schemas/Time"}
    ClaimMark:
      description: >-
        The claim on an entry, mine when the session that asked holds it, with claimed_at, when
        it began, in the redesign's talk (API-152)
      type: object
      required: [ends_at, mine]
      additionalProperties: false
      properties:
        claimed_at: {$ref: "#/components/schemas/Time"}
        ends_at: {$ref: "#/components/schemas/Time"}
        mine: {type: boolean}
    CommentEntry:
      description: A comment as a list holds it, with its count of replies and its last reply
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [replies, last_reply, proposals]
          properties:
            replies: {type: integer, minimum: 0, maximum: 200}
            last_reply: {anyOf: [{$ref: "#/components/schemas/Reply"}, {type: "null"}]}
            proposals: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/ProposalId"}}
            claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
            unread:
              description: >-
                Whether the agent has not read the comment yet (SPEC-189): true while it waits
                for the agent, no claim holds it, and its last_at is at or after the space's
                last read or the space was never read
              x-corthex: {status: planned, spec: [SPEC-189]}
              type: boolean
    Reply:
      type: object
      required: [seq, author, text, settles, made_at]
      additionalProperties: false
      properties:
        seq: {type: integer, minimum: 1, maximum: 200}
        author: {$ref: "#/components/schemas/Author"}
        text: {type: string, maxLength: 4000}
        settles: {type: boolean}
        made_at: {$ref: "#/components/schemas/Time"}
        look_first:
          description: >-
            The thing to look at first of the agent's reply that asks for the checkpoint, a
            trace ID or an https address (SPEC-197); null for any other reply
          x-corthex: {status: planned, spec: [SPEC-197]}
          anyOf: [{$ref: "#/components/schemas/TraceId"}, {$ref: "#/components/schemas/Link"}, {type: "null"}]
    Decision:
      type: object
      required: [seq, link, text, made_at]
      additionalProperties: false
      properties:
        seq: {type: integer, minimum: 1}
        link: {$ref: "#/components/schemas/Link"}
        text: {type: [string, "null"], maxLength: 4000}
        made_at: {$ref: "#/components/schemas/Time"}
    CommentThread:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [replies, decisions, proposals]
          properties:
            replies: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/Reply"}}
            decisions: {type: array, items: {$ref: "#/components/schemas/Decision"}}
            proposals: {type: array, items: {$ref: "#/components/schemas/ProposalEntry"}}
    Proposal:
      type: object
      required: [id, part, stage, commit, items, reason, change, source_text, comment, discrepancy, state, made_at, closed_at, edit]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        reason: {type: string, maxLength: 2000}
        change: {type: string, maxLength: 4000}
        source_text: {type: [string, "null"], maxLength: 20000}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentId"}, {type: "null"}]}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        made_at: {$ref: "#/components/schemas/Time"}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        edit: {anyOf: [{$ref: "#/components/schemas/EditId"}, {type: "null"}]}
    ProposalEntry:
      description: A proposal as a list holds it, with the length of its stage source text in place of the text
      type: object
      required: [id, part, stage, commit, items, reason, change, source_text_chars, comment, discrepancy, state, made_at, closed_at, edit]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        reason: {type: string, maxLength: 2000}
        change: {type: string, maxLength: 4000}
        source_text_chars: {type: integer, minimum: 0, maximum: 20000}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentId"}, {type: "null"}]}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        made_at: {$ref: "#/components/schemas/Time"}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        edit: {anyOf: [{$ref: "#/components/schemas/EditId"}, {type: "null"}]}
    Edit:
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/ProposalId"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
    EditEntry:
      description: An edit as a list holds it, with its proposal
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/ProposalEntry"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
        claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
        unread:
          description: >-
            Whether the agent has not read the edit yet (SPEC-189): true while it is pending,
            no claim holds it, and its made_at is at or after the space's last read or the
            space was never read
          x-corthex: {status: planned, spec: [SPEC-189]}
          type: boolean
    EditWithProposal:
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/Proposal"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
    Discrepancy:
      type: object
      required: [id, part, compares, term, item, reasons, level, state, waiting, opened_commit, opened_at, resolved_commit, resolved_at, earlier]
      properties:
        id: {$ref: "#/components/schemas/DiscrepancyId"}
        part: {$ref: "#/components/schemas/PartName"}
        compares: {type: string, enum: [aggregate-table, read-model-screen]}
        term: {$ref: "#/components/schemas/ItemRef"}
        item:
          description: The table or screen by its trace ID, or by its name when it has none; empty for a term without one
          type: string
          maxLength: 120
        reasons:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [kind]
            additionalProperties: false
            properties:
              kind: {type: string, enum: [no-term, not-on-board, no-table, no-screen, other-context, removed]}
              contexts:
                description: For other-context, the context of the term's side and of the item's side
                type: array
                minItems: 2
                maxItems: 2
                items: {$ref: "#/components/schemas/ItemRef"}
              side:
                description: For removed, the side marked removed
                type: string
                enum: [term, item]
        level: {type: string, enum: [warn, info]}
        state: {type: string, enum: [open, resolved]}
        waiting: {type: boolean}
        opened_commit: {$ref: "#/components/schemas/Commit"}
        opened_at: {$ref: "#/components/schemas/Time"}
        resolved_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        resolved_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        earlier: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    Checkpoint:
      type: object
      required: [id, part, stage, commit, words, state, passed_at, withdrawn_at, pull_request, pr_state, recorded_commit]
      properties:
        id: {$ref: "#/components/schemas/CheckpointId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        words: {type: [string, "null"], maxLength: 2000}
        state: {type: string, enum: [passed, withdrawn]}
        passed_at: {$ref: "#/components/schemas/Time"}
        withdrawn_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        pr_state: {enum: [open, merged, closed, null]}
        recorded_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        comment:
          description: >-
            The comment whose recommendation the user took to pass the checkpoint (API-159),
            which holds what was approved; from the redesign. From the design revision of
            2026-11-11, open under D17 of stage 02: the checkpoint request that the pass named
            (API-128), and null for a pass without a request
          anyOf: [{$ref: "#/components/schemas/CommentId"}, {type: "null"}]
        revision:
          description: >-
            The stored snapshot's revision that the pass named in place of a commit, for a
            project whose snapshot names none (SPEC-194); null when the pass named a commit,
            and for a checkpoint passed before the revision
          x-corthex: {status: planned, decision: D17, spec: [SPEC-194]}
          type: [integer, "null"]
          minimum: 1
        entry:
          description: >-
            The request's last entry that the user saw and the pass named, 0 for the comment's
            own text and otherwise its reply's seq, so that comment and entry hold what was
            approved (SPEC-194); null for a pass without a request, and for a checkpoint
            passed before the revision
          x-corthex: {status: planned, decision: D17, spec: [SPEC-194]}
          type: [integer, "null"]
          minimum: 0
          maximum: 200
        browser:
          description: >-
            The family of the browser that sent the pass, as the server read it from the
            request and never the request's own text (SPEC-195); null only for a checkpoint
            passed before the revision, which is not the same as unknown
          x-corthex: {status: planned, spec: [SPEC-195]}
          enum: [chrome, safari, firefox, edge, other, unknown, null]
        device:
          description: The class of the device, read in the same way (SPEC-195); null as for browser
          x-corthex: {status: planned, spec: [SPEC-195]}
          enum: [phone, tablet, desktop, unknown, null]
        driven:
          description: >-
            Whether the page reported that software drives the browser, as navigator.webdriver
            says (SPEC-195); null when the page reported nothing, as an older page does, and
            for a checkpoint passed before the revision. A record to look at afterwards, never
            a check
          x-corthex: {status: planned, spec: [SPEC-195]}
          type: [boolean, "null"]
    CheckpointEntry:
      description: A checkpoint as the agent to-do holds it, with why it is listed
      allOf:
        - $ref: "#/components/schemas/Checkpoint"
        - type: object
          required: [why]
          properties:
            why: {type: string, enum: [not-recorded, withdrawn-in-review, withdrawn-recorded]}
            claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    Claim:
      type: object
      required: [entry, session, claimed_at, ends_at]
      additionalProperties: false
      properties:
        entry: {$ref: "#/components/schemas/EntryId"}
        session: {$ref: "#/components/schemas/SessionLabel"}
        claimed_at: {$ref: "#/components/schemas/Time"}
        ends_at: {$ref: "#/components/schemas/Time"}
    Released:
      type: object
      required: [entry, released]
      additionalProperties: false
      properties:
        entry: {$ref: "#/components/schemas/EntryId"}
        released: {type: boolean}

    Todo:
      type: object
      required: [project, default_commit, session, comments, discrepancies, reflections, checkpoints, waiting_for_user, taken]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        default_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        session: {anyOf: [{$ref: "#/components/schemas/SessionLabel"}, {type: "null"}]}
        read_at:
          description: >-
            The time that this read recorded for the project's space, by the server's clock
            (SPEC-187); null for a read under a person's own sign-in, which records nothing.
            The hub knows a server of the revision by this member
          x-corthex: {status: planned, spec: [SPEC-187]}
          anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]
        comments:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CommentEntry"}}
        discrepancies:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Discrepancy"}}
        reflections:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/EditEntry"}}
        checkpoints:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CheckpointEntry"}}
        waiting_for_user: {type: integer, minimum: 0}
        taken: {type: integer, minimum: 0}
    PictureData:
      type: object
      required: [project, part, stage, picture, comments, closed_comments, proposals, reflections, discrepancies]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        picture:
          type: object
          required: [commit, committed_at, drawn_at, not_current, source]
          additionalProperties: false
          properties:
            commit: {$ref: "#/components/schemas/Commit"}
            committed_at: {$ref: "#/components/schemas/ZonedTime"}
            drawn_at: {$ref: "#/components/schemas/Time"}
            not_current: {enum: [size, source-gone, other-repository, null]}
            source: {$ref: "#/components/schemas/PictureSource"}
        comments:
          description: The open comments on the picture, up to 500, the most recently active first, with their total
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/CommentEntry"}}
        closed_comments:
          description: The closed comments on the picture, up to 500, the most recently active first, which the view opens with getComment
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries:
              type: array
              maxItems: 500
              items:
                type: object
                required: [id, item, closed_as, last_at]
                additionalProperties: false
                properties:
                  id: {$ref: "#/components/schemas/CommentId"}
                  item: {$ref: "#/components/schemas/ItemRef"}
                  closed_as: {type: string, enum: [answered, decided]}
                  last_at: {$ref: "#/components/schemas/Time"}
        proposals: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/ProposalEntry"}}
        reflections: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/EditEntry"}}
        discrepancies: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/Discrepancy"}}
    Overview:
      type: object
      required: [project, part, stage, record, source_state, read, checks, pictures, discrepancies, comments, reflections, checkpoints, warnings, not_opened]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        record:
          description: The stage's record for the part, from the stored snapshot, and where the records came from
          type: object
          required: [state, checkpoints, next, from]
          properties:
            state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
            checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
            next: {type: string}
            updated: {$ref: "#/components/schemas/ZonedTime"}
            from: {type: string, enum: [repository, status-file]}
        source_state: {type: string, enum: [found, missing, none, no-checkout, skipped, invalid]}
        read: {type: boolean}
        checks: {type: array, maxItems: 2000, items: {$ref: "#/components/schemas/Check"}}
        pictures:
          description: The pictures that the stage's discrepancies concern, for a pictured stage
          type: array
          maxItems: 3
          items:
            type: object
            required: [stage, commit, not_current]
            additionalProperties: false
            properties:
              stage: {$ref: "#/components/schemas/PictureStage"}
              commit: {$ref: "#/components/schemas/Commit"}
              not_current: {enum: [size, source-gone, other-repository, null]}
        discrepancies:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Discrepancy"}}
        comments:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CommentEntry"}}
        reflections:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/EditEntry"}}
        checkpoints:
          description: The checkpoints passed in NEXUS for the part and stage that no stored record names, and the withdrawn ones that a stored record names
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/Checkpoint"}
        warnings:
          type: array
          maxItems: 50
          items:
            type: object
            required: [rule, checkpoint]
            additionalProperties: false
            properties:
              rule: {const: checkpoint-withdrawn}
              checkpoint: {$ref: "#/components/schemas/CheckpointId"}
        not_opened:
          description: How many discrepancies the part's last cross-check could not open, since the space held 1,000 open ones
          type: integer
          minimum: 0
    HubPageData:
      description: The data in the hub page's script block hub-data
      type: object
      required: [schema, generated_at, lang, origin, projects, spaces, missing]
      properties:
        schema: {const: corthex-hub-page/0.2}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        origin: {type: string, enum: [local, server]}
        projects: {type: array, maxItems: 30, items: {type: object}}
        spaces:
          description: For each project that has a space; empty on a device
          type: object
          additionalProperties: {$ref: "#/components/schemas/SpaceSummary"}
        missing: {type: array, items: {type: object}}
    SpaceSummary:
      type: object
      required: [pictures, open, checkpoints, warnings, not_opened]
      additionalProperties: false
      properties:
        pictures:
          type: array
          maxItems: 150
          items:
            type: object
            required: [part, stage, commit, committed_at, not_current]
            additionalProperties: false
            properties:
              part: {$ref: "#/components/schemas/PartName"}
              stage: {$ref: "#/components/schemas/PictureStage"}
              commit: {$ref: "#/components/schemas/Commit"}
              committed_at: {$ref: "#/components/schemas/ZonedTime"}
              not_current: {enum: [size, source-gone, other-repository, null]}
        open:
          type: object
          required: [comments, proposals, discrepancies]
          additionalProperties: false
          properties:
            comments: {type: integer, minimum: 0}
            proposals: {type: integer, minimum: 0}
            discrepancies: {type: integer, minimum: 0}
        checkpoints:
          description: The checkpoints passed in NEXUS that wait for their records, up to 100 with their total
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries:
              type: array
              maxItems: 100
              items:
                type: object
                required: [id, part, stage, passed_at]
                additionalProperties: false
                properties:
                  id: {$ref: "#/components/schemas/CheckpointId"}
                  part: {$ref: "#/components/schemas/PartName"}
                  stage: {$ref: "#/components/schemas/StageKey"}
                  passed_at: {$ref: "#/components/schemas/Time"}
        warnings:
          type: array
          maxItems: 100
          items:
            type: object
            required: [part, stage, rule, checkpoint]
            additionalProperties: false
            properties:
              part: {$ref: "#/components/schemas/PartName"}
              stage: {$ref: "#/components/schemas/StageKey"}
              rule: {const: checkpoint-withdrawn}
              checkpoint: {$ref: "#/components/schemas/CheckpointId"}
        not_opened:
          type: object
          additionalProperties: {type: integer, minimum: 1}
    ViewPageData:
      description: The data in the script block view-data of the picture view and the stage overview
      type: object
      required: [schema, generated_at, lang, view, data, problem]
      additionalProperties: false
      properties:
        schema: {const: corthex-view-page/0.2}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        view: {type: string, enum: [picture, overview]}
        data:
          anyOf:
            - $ref: "#/components/schemas/PictureData"
            - $ref: "#/components/schemas/Overview"
            - type: "null"
        problem: {anyOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]}

    StageState:
      description: A stage's recorded state, unknown when no record names it
      type: string
      enum: [done, in_progress, not_started, skipped, unknown]
    Place:
      description: >-
        Where an entry opens in the workspace: a comment, an edit or a checkpoint at its own part
        and stage, a discrepancy at its table's or screen's stage, 05-erd for aggregate-table and
        07-sitemap for read-model-screen
      type: object
      required: [part, stage, entry]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        entry: {$ref: "#/components/schemas/EntryId"}
    Home:
      description: The first page's data (API-151)
      type: object
      required: [generated_at, my_turn, agent, projects]
      additionalProperties: false
      properties:
        generated_at: {$ref: "#/components/schemas/Time"}
        my_turn:
          description: >-
            What waits for the user in every space, in SPEC-143's order: the open comments whose
            last entry asks for a checkpoint, then the open proposals, then the other open
            comments that wait for the user, each group oldest first; up to 50, with their total
          type: object
          required: [total, entries]
          additionalProperties: false
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/MyTurnEntry"}}
        agent:
          description: The agent to-do's counts for each project with a space, by the projects' names (SPEC-144)
          type: array
          maxItems: 30
          items: {$ref: "#/components/schemas/AgentCounts"}
        projects:
          description: A card for each stored snapshot, by the projects' names (SPEC-145); the page keeps its own order
          type: array
          maxItems: 30
          items: {$ref: "#/components/schemas/ProjectCard"}
    MyTurnEntry:
      description: >-
        An entry of my turn. For a comment, text is the first 300 characters of its last entry,
        the agent's comment or reply or the change of an open proposal that answers it, and at is
        when it began to wait; for a proposal, its change and when it was made, with its first item.
      type: object
      required: [kind, id, project, part, stage, item, title, quote, text, at, asks]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [comment, proposal]}
        id: {type: string, pattern: '^n[cp]_[0-9a-hjkmnp-tv-z]{12}$'}
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        item: {$ref: "#/components/schemas/ItemRef"}
        title: {description: "The item's title in the stored snapshot; null for the stage as a whole or an item that no stage holds now", type: [string, "null"], maxLength: 120}
        quote: {type: [string, "null"], maxLength: 300}
        text: {type: string, maxLength: 300}
        at: {$ref: "#/components/schemas/Time"}
        asks: {description: "What the comment asks of the user; null for a proposal", enum: [answer, recommended, checkpoint, null]}
        request:
          description: >-
            For a checkpoint request in form, the request whole, so that the entry may offer
            the pass as its second action (SPEC-196); null for any other entry, for a request
            stored without its thing to look at first and, in phase ②, for a workshop's
            request, which offer only to open
          x-corthex: {status: planned, decision: D17, spec: [SPEC-196]}
          anyOf: [{$ref: "#/components/schemas/RequestShown"}, {type: "null"}]
    AgentCount:
      type: object
      required: [total, oldest]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        oldest: {description: "Where the list's oldest entry opens; null when the list is empty", anyOf: [{$ref: "#/components/schemas/Place"}, {type: "null"}]}
    AgentCounts:
      description: One project's agent to-do in counts, by the lists of getAgentTodo read without a session
      type: object
      required: [project, comments, discrepancies, reflections, checkpoints, taken]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        comments: {$ref: "#/components/schemas/AgentCount"}
        discrepancies: {$ref: "#/components/schemas/AgentCount"}
        reflections: {$ref: "#/components/schemas/AgentCount"}
        checkpoints: {$ref: "#/components/schemas/AgentCount"}
        taken: {description: How many of the entries a session's claim holds now, type: integer, minimum: 0}
        read_at:
          description: >-
            When the agent last read the project's agent to-do with the service token
            (SPEC-187, SPEC-188); null before the first read, which the page shows as not read
            yet
          x-corthex: {status: planned, spec: [SPEC-188]}
          anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]
        unread:
          description: >-
            How many entries of the four lists the agent has not read yet (SPEC-189): those
            that no claim holds and that wait since read_at or later, or every one that no
            claim holds while read_at is null
          x-corthex: {status: planned, spec: [SPEC-189]}
          type: integer
          minimum: 0
        unread_since:
          description: >-
            The oldest time since which one of those entries waits, from which the page tells
            a wait of more than 24 hours (SPEC-188); null when unread is 0
          x-corthex: {status: planned, spec: [SPEC-188, SPEC-189]}
          anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]
    ProjectCard:
      description: >-
        A project's card, from its stored snapshot and its space. title is the settings' title,
        cut at 120 characters as titles are; repository the web address that the settings give
        for the project's own repository; commit the snapshot's held commit; pushed_at when the
        server stored it.
      type: object
      required: [name, title, repository, commit, generated_at, pushed_at, items, warnings, parts, stages, pictures]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ProjectName"}
        title: {type: [string, "null"], maxLength: 120}
        repository: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        pushed_at: {$ref: "#/components/schemas/Time"}
        items: {type: integer, minimum: 0}
        warnings: {description: The snapshot's checks of level warn, type: integer, minimum: 0}
        parts:
          description: The settings' parts in their order, or one part "" for the project as a whole
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: "#/components/schemas/CardPart"}
        stages:
          description: The 13 stages in order, with how many items the snapshot holds of each
          type: array
          minItems: 13
          maxItems: 13
          items:
            type: object
            required: [key, items]
            additionalProperties: false
            properties:
              key: {$ref: "#/components/schemas/StageKey"}
              items: {type: integer, minimum: 0}
        pictures:
          description: The space's pictures, in the order of the parts and the stages; empty for a project without a space
          type: array
          maxItems: 150
          items: {$ref: "#/components/schemas/CardPicture"}
        revision:
          description: >-
            The stored snapshot's revision, which a pass from the first page names where the
            snapshot names no commit (SPEC-194, SPEC-196)
          x-corthex: {status: planned, decision: D17, spec: [SPEC-194, SPEC-196]}
          type: integer
          minimum: 1
    CardPart:
      description: >-
        A part on a card. current is the part's first stage in progress, or else its first not
        started, as the hub page names it; null when no stage is recorded or none is current.
        next is the current stage's next action.
      type: object
      required: [name, recorded, current, next, states]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/PartName"}
        recorded: {description: Whether a record names a state for any of its stages, type: boolean}
        current: {anyOf: [{$ref: "#/components/schemas/StageKey"}, {type: "null"}]}
        next: {type: [string, "null"], maxLength: 300}
        states:
          description: The 13 stages' recorded states, in order
          type: array
          minItems: 13
          maxItems: 13
          items: {$ref: "#/components/schemas/StageState"}
    CardPicture:
      description: A picture of the space on a card, with how many open comments it holds and its small drawing
      type: object
      required: [part, stage, commit, committed_at, not_current, comments, drawing]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        committed_at: {$ref: "#/components/schemas/ZonedTime"}
        not_current: {enum: [size, source-gone, other-repository, null]}
        comments: {type: integer, minimum: 0}
        drawing: {description: "null when the picture has nothing to draw or is too complex to lay out", anyOf: [{$ref: "#/components/schemas/Drawing"}, {type: "null"}]}
    Drawing:
      description: >-
        A picture as the server first lays it out, without labels (the first picture decision of
        2026-11-04): its bounds as x, y, width and height, its boxes as a kind with x, y, width and
        height, and its lines from x and y to x and y, in whole units of the layout
      type: object
      required: [bounds, boxes, lines]
      additionalProperties: false
      properties:
        bounds:
          type: array
          prefixItems: [{type: integer}, {type: integer}, {type: integer, minimum: 0}, {type: integer, minimum: 0}]
          minItems: 4
          maxItems: 4
        boxes:
          type: array
          maxItems: 2000
          items:
            type: array
            prefixItems: [{$ref: "#/components/schemas/DrawingKind"}, {type: integer}, {type: integer}, {type: integer, minimum: 0}, {type: integer, minimum: 0}]
            minItems: 5
            maxItems: 5
        lines:
          type: array
          maxItems: 2000
          items:
            type: array
            prefixItems: [{type: integer}, {type: integer}, {type: integer}, {type: integer}]
            minItems: 4
            maxItems: 4
    DrawingKind:
      type: string
      enum: [context, lane, event, command, actor, aggregate, read-model, policy, external, hotspot, screen, table]

    StageData:
      description: A part's stage as the workspace shows it (API-158)
      type: object
      required: [project, part, stage, head, record, stages, items]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/StageProject"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        head: {$ref: "#/components/schemas/StageHead"}
        record: {$ref: "#/components/schemas/Overview"}
        stages:
          description: The part's 13 stages in order, for the workspace's list of stages
          type: array
          minItems: 13
          maxItems: 13
          items: {$ref: "#/components/schemas/StageRow"}
        items: {$ref: "#/components/schemas/StageItems"}
    StageProject:
      description: The project of a stage, as its card names it, with its parts in the settings' order, or "" for the project as a whole
      type: object
      required: [name, title, repository, commit, generated_at, pushed_at, parts]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ProjectName"}
        title: {type: [string, "null"], maxLength: 120}
        repository: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        pushed_at: {$ref: "#/components/schemas/Time"}
        parts: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/PartName"}}
        revision:
          description: >-
            The stored snapshot's revision, which a pass from the stage's record names where
            the snapshot names no commit (SPEC-194)
          x-corthex: {status: planned, decision: D17, spec: [SPEC-194]}
          type: integer
          minimum: 1
        space:
          description: Whether the project has a space; without one the head says that the project has no agent to-do yet (SPEC-188)
          x-corthex: {status: planned, spec: [SPEC-188]}
          type: boolean
        read_at:
          description: When the agent last read the project's agent to-do with the service token (SPEC-187, SPEC-188); null before the first read and for a project without a space
          x-corthex: {status: planned, spec: [SPEC-188]}
          anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]
        unread_since:
          description: The oldest time since which an entry that the agent has not read waits, as getHome gives it (SPEC-188, SPEC-189); null when there is none
          x-corthex: {status: planned, spec: [SPEC-188, SPEC-189]}
          anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]
    StageHead:
      description: >-
        The stage's head (SPEC-147). checkpoint is the part's last recorded checkpoint of the
        stage; commit is the picture's document version on a stage with a picture of the part,
        and the snapshot's held commit otherwise, with time, its time; reads is false when the
        project does not read the stage, and source_state says why.
      type: object
      required: [key, state, checkpoint, commit, time, reads, source_state, counts, picture]
      additionalProperties: false
      properties:
        key: {$ref: "#/components/schemas/StageKey"}
        state: {$ref: "#/components/schemas/StageState"}
        checkpoint: {anyOf: [{$ref: "#/components/schemas/RecordCheckpoint"}, {type: "null"}]}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        time: {anyOf: [{$ref: "#/components/schemas/ZonedTime"}, {type: "null"}]}
        reads: {type: boolean}
        source_state: {type: string, enum: [found, missing, none, no-checkout, skipped, invalid]}
        counts: {$ref: "#/components/schemas/StageCounts"}
        picture: {description: Whether the space holds a picture of the part at the stage, type: boolean}
    StageCounts:
      description: >-
        The stage's counts for its head (REQ-226), from the stored snapshot: its items, by kind in
        the order of the stage contract's kinds, by priority in the order of their first item, and
        for stage 01 the open hotspots of the part's DDD board, null on the other stages
      type: object
      required: [items, kinds, priorities, hotspots]
      additionalProperties: false
      properties:
        items: {type: integer, minimum: 0}
        kinds:
          type: array
          maxItems: 13
          items:
            type: object
            required: [kind, count]
            additionalProperties: false
            properties:
              kind: {type: string, maxLength: 40}
              count: {type: integer, minimum: 1}
        priorities:
          type: array
          maxItems: 20
          items:
            type: object
            required: [priority, count]
            additionalProperties: false
            properties:
              priority: {type: string, maxLength: 40}
              count: {type: integer, minimum: 1}
        hotspots: {type: [integer, "null"], minimum: 0}
    StageRow:
      description: >-
        One of the part's 13 stages in the workspace's list, with its items, whether it has a
        picture of the part, why that picture is not current, as the picture view names it, or
        null for a current picture and a stage without one, and its entries in my turn
      type: object
      required: [key, state, items, picture, not_current, mine]
      additionalProperties: false
      properties:
        key: {$ref: "#/components/schemas/StageKey"}
        state: {$ref: "#/components/schemas/StageState"}
        items: {type: integer, minimum: 0}
        picture: {type: boolean}
        not_current: {enum: [size, source-gone, other-repository, null]}
        mine: {type: integer, minimum: 0}
    StageItems:
      description: >-
        The stage's items from the stored snapshot, as filter and q narrow them, 200 after after.
        An item's context is the context that its links name, a context's own ID for a context,
        or else that of the first item that it comes from that has one, a stage back at a time, as
        the hub page's trace follows the links; an item without one is in the last group, whose
        context is null. With group context the entries follow their groups, in the order of the
        contexts in the snapshot, and the source's order within each; with group source, the
        source's order, and groups is empty. counts says how many items each filter holds with
        the words q.
      type: object
      required: [group, filter, q, total, after, counts, groups, entries]
      additionalProperties: false
      properties:
        group: {type: string, enum: [context, source]}
        filter: {type: string, enum: [all, talk, mine, left]}
        q: {type: [string, "null"], maxLength: 200}
        total: {type: integer, minimum: 0}
        after: {type: integer, minimum: 0}
        counts:
          type: object
          required: [all, talk, mine, left]
          additionalProperties: false
          properties:
            all: {type: integer, minimum: 0}
            talk: {type: integer, minimum: 0}
            mine: {type: integer, minimum: 0}
            left: {type: integer, minimum: 0}
        groups:
          type: array
          maxItems: 3000
          items:
            type: object
            required: [context, title, count]
            additionalProperties: false
            properties:
              context: {anyOf: [{$ref: "#/components/schemas/TraceId"}, {type: "null"}]}
              title: {type: [string, "null"], maxLength: 120}
              count: {type: integer, minimum: 1}
        entries: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/ListItem"}}
    ListItem:
      description: >-
        An item of the list, as the snapshot holds it, with its context and its marks for the
        part: the comments on it, open or closed; whether an entry in my turn names it; and its
        open discrepancies and pending reflections
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [context, comments, mine, discrepancies, reflections]
          properties:
            context: {anyOf: [{$ref: "#/components/schemas/TraceId"}, {type: "null"}]}
            comments: {type: integer, minimum: 0}
            mine: {type: boolean}
            discrepancies: {type: integer, minimum: 0}
            reflections: {type: integer, minimum: 0}

    StageTalk:
      description: >-
        A part's stage talk by turn (API-152), narrowed to item when it names one. mine holds the
        open proposals and the open comments that wait for the user, in SPEC-143's order; agent
        the open comments that wait for the agent, oldest first, each with its claim while a
        session holds one; apart the open comments whose item the stored snapshot's stage no
        longer holds, oldest first, in neither of those (REQ-162); closed the closed comments and
        the proposals no longer open, newest first, with their total and, with closed 1, 50 after
        after; and reflections the part's pending reflections of the stage.
      type: object
      required: [project, part, stage, item, mine, agent, apart, closed, reflections]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        item: {anyOf: [{$ref: "#/components/schemas/TraceId"}, {type: "null"}]}
        mine:
          type: object
          required: [total, entries]
          additionalProperties: false
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/TalkEntry"}}
        agent:
          type: object
          required: [total, entries]
          additionalProperties: false
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/CommentEntry"}}
        apart:
          type: object
          required: [total, entries]
          additionalProperties: false
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/CommentEntry"}}
        closed:
          type: object
          required: [total, entries]
          additionalProperties: false
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/TalkEntry"}}
        reflections: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/EditEntry"}}
    TalkEntry:
      description: A comment, with its count of replies and its last reply, or a proposal of the talk
      type: object
      required: [kind, comment, proposal]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [comment, proposal]}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentEntry"}, {type: "null"}]}
        proposal: {anyOf: [{$ref: "#/components/schemas/ProposalEntry"}, {type: "null"}]}

    ItemData:
      description: >-
        An item of the stored snapshot (API-157): its fields as the snapshot holds them, with the
        language of the project's sources from the settings; its context, as the list finds it;
        where its stage source holds it, with a link to the file at the commit when the settings
        give the web address of the repository that holds it; the items that it comes from and
        leads to, by stage in the stages' order, as the hub page's trace (SPEC-122); and its talk
        in the part, as getStageTalk gives it narrowed to the item.
      type: object
      required: [project, part, language, item, context, source, trace, comments]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        language: {type: [string, "null"], maxLength: 20}
        item: {$ref: "#/components/schemas/Item"}
        context:
          anyOf:
            - type: object
              required: [id, title]
              additionalProperties: false
              properties:
                id: {$ref: "#/components/schemas/TraceId"}
                title: {type: [string, "null"], maxLength: 120}
            - type: "null"
        source:
          description: null when the snapshot names no place for the item
          anyOf:
            - type: object
              required: [path, line, link, commit]
              additionalProperties: false
              properties:
                path: {type: string, maxLength: 300}
                line: {type: [integer, "null"], minimum: 1}
                link: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
                commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
            - type: "null"
        trace:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: {type: array, maxItems: 13, items: {$ref: "#/components/schemas/TraceGroup"}}
            to: {type: array, maxItems: 13, items: {$ref: "#/components/schemas/TraceGroup"}}
        comments: {$ref: "#/components/schemas/StageTalk"}
    TraceGroup:
      description: The linked items of one stage, up to 100 with their total
      type: object
      required: [stage, total, items]
      additionalProperties: false
      properties:
        stage: {$ref: "#/components/schemas/StageKey"}
        total: {type: integer, minimum: 1}
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, kind, title]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/TraceId"}
              kind: {type: string, maxLength: 40}
              title: {type: [string, "null"], maxLength: 120}

    SearchAnswer:
      description: The matches of searchItems (API-156)
      type: object
      required: [q, total, matches]
      additionalProperties: false
      properties:
        q: {type: string, minLength: 2, maxLength: 200}
        total: {type: integer, minimum: 0}
        matches: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/SearchMatch"}}
    SearchMatch:
      description: A matching item, with the part where it opens, the project's first part or "" for the project as a whole
      type: object
      required: [project, part, stage, id, title]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        id: {$ref: "#/components/schemas/TraceId"}
        title: {type: [string, "null"], maxLength: 120}

    RecommendationAnswer:
      description: >-
        The comment after the user took the recommendation, the reply that settles it and, with
        asks checkpoint, the checkpoint passed; changed is false when the recommendation was taken
        already, and the answer then holds that reply and that checkpoint
      type: object
      required: [comment, reply, checkpoint, changed]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        reply: {$ref: "#/components/schemas/Reply"}
        checkpoint: {anyOf: [{$ref: "#/components/schemas/Checkpoint"}, {type: "null"}]}
        changed: {type: boolean}
    HomePageData:
      description: >-
        The data in the script block view-data of the first page (API-155): data, the answer of
        getHome when the page was served
      type: object
      required: [schema, generated_at, lang, data]
      additionalProperties: false
      properties:
        schema: {const: corthex-home-page/0.3}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        data: {$ref: "#/components/schemas/Home"}
    StagePageData:
      description: >-
        The data in the script block view-data of a stage's page (API-154): data, the answer of
        getStage for the first 200 items in the default order; talk, the answer of getStageTalk
        for the whole stage, null for a project without a space; picture, the answer of
        getPicture on a stage with a picture, null otherwise; and problem, the Problem Details of
        what the page could not hold, space_not_found for a project without a space or
        picture_not_found for a picture that the space does not hold
      type: object
      required: [schema, generated_at, lang, data, talk, picture, problem]
      additionalProperties: false
      properties:
        schema: {const: corthex-stage-page/0.3}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        data: {$ref: "#/components/schemas/StageData"}
        talk: {anyOf: [{$ref: "#/components/schemas/StageTalk"}, {type: "null"}]}
        picture: {anyOf: [{$ref: "#/components/schemas/PictureData"}, {type: "null"}]}
        problem: {anyOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]}

    NewComment:
      type: object
      required: [part, stage, item, text]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        item: {$ref: "#/components/schemas/ItemRef"}
        quote: {type: string, minLength: 1, maxLength: 300}
        discrepancy: {$ref: "#/components/schemas/DiscrepancyId"}
        commit: {$ref: "#/components/schemas/Commit"}
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        asks: {description: "What the agent's comment asks of the user; only the agent sends it", type: string, enum: [answer, recommended, checkpoint]}
    NewReply:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        settles: {type: boolean, default: false}
        asks: {description: "What the agent's reply asks of the user; only the agent sends it", type: string, enum: [answer, recommended, checkpoint]}
    ReplyAnswer:
      type: object
      required: [comment, reply]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        reply: {$ref: "#/components/schemas/Reply"}
    AnsweredAnswer:
      type: object
      required: [comment, changed]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        changed: {type: boolean}
    NewDecision:
      type: object
      required: [link]
      additionalProperties: false
      properties:
        link: {$ref: "#/components/schemas/Link"}
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    DecisionAnswer:
      type: object
      required: [comment, decision]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        decision: {$ref: "#/components/schemas/Decision"}
    NewProposal:
      type: object
      required: [part, stage, items, reason, change]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        items: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {$ref: "#/components/schemas/TraceId"}}
        adds:
          description: The items of items that the change adds, which the picture need not hold
          type: array
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/TraceId"}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        change: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        source_text: {type: string, minLength: 1, maxLength: 20000}
        comment: {$ref: "#/components/schemas/CommentId"}
        discrepancy: {$ref: "#/components/schemas/DiscrepancyId"}
        commit: {$ref: "#/components/schemas/Commit"}
    ProposalStateAnswer:
      type: object
      required: [proposal, changed]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        changed: {type: boolean}
    ProposalState:
      type: object
      required: [id, state, closed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
    AcceptAnswer:
      type: object
      required: [proposal, edit]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        edit: {$ref: "#/components/schemas/Edit"}
    DismissAnswer:
      type: object
      required: [proposal, comment]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentState"}, {type: "null"}]}
    EditReport:
      description: What became of a reflection (Reports in nexus.md); pull_request goes with opened, merged and closed, and commit with reflected
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event: {type: string, enum: [opened, merged, closed, reflected, needs-user]}
        pull_request: {$ref: "#/components/schemas/Link"}
        commit: {$ref: "#/components/schemas/Commit"}
    EditAnswer:
      type: object
      required: [edit, changed]
      additionalProperties: false
      properties:
        edit: {$ref: "#/components/schemas/Edit"}
        changed: {type: boolean}
    NewCheckpoint:
      type: object
      required: [part, stage]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        words: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
    CheckpointReport:
      type: object
      required: [event, pull_request]
      additionalProperties: false
      properties:
        event: {type: string, enum: [opened, merged, closed]}
        pull_request: {$ref: "#/components/schemas/Link"}
    CheckpointAnswer:
      type: object
      required: [checkpoint, changed]
      additionalProperties: false
      properties:
        checkpoint: {$ref: "#/components/schemas/Checkpoint"}
        changed: {type: boolean}

    StageRecords:
      description: >-
        The stage records file of TBL-115, .corthex/stages/<part>.json or .corthex/stages.json,
        which the agent writes in a pull request and the hub reads from the default branch's
        commit. Not a request: it is here so that one schema checks it.
      type: object
      required: [format, project, stages]
      additionalProperties: false
      properties:
        format: {const: 1}
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100}
        stages:
          type: object
          propertyNames: {$ref: "#/components/schemas/StageKey"}
          additionalProperties:
            type: object
            required: [state, checkpoints, next, updated]
            additionalProperties: false
            properties:
              state: {type: string, enum: [done, in_progress, not_started, skipped]}
              checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
              next: {type: string, maxLength: 300}
              checks:
                type: array
                items:
                  type: object
                  required: [level, message, at]
                  additionalProperties: false
                  properties:
                    level: {type: string, enum: [error, warn, info]}
                    message: {type: string, minLength: 1, maxLength: 300}
                    refs: {type: array, items: {$ref: "#/components/schemas/TraceId"}}
                    at: {$ref: "#/components/schemas/Date"}
              updated: {$ref: "#/components/schemas/ZonedTime"}
    OutboxFile:
      description: >-
        One write in the hub's outbox (TBL-117), outbox/<project>/<time>.<write>.json on a device.
        Not a request: it is here so that one schema checks it.
      type: object
      required: [format, write, project, request, path, session, made, body, tries]
      additionalProperties: false
      properties:
        format: {const: 1}
        write: {$ref: "#/components/schemas/WriteId"}
        project: {$ref: "#/components/schemas/ProjectName"}
        request: {type: string, enum: [comment, reply, answered, decision, proposal, withdraw-proposal, report-edit, report-checkpoint]}
        path:
          description: The request's path under the server's address
          type: string
          pattern: '^/api/spaces/[a-z0-9-]+/'
          maxLength: 300
        session: {$ref: "#/components/schemas/SessionLabel"}
        made: {$ref: "#/components/schemas/Time"}
        body: {type: object}
        tries: {type: integer, minimum: 0}
        failure: {type: string, maxLength: 120}
    SessionReads:
      description: >-
        The session reads file of TBL-125, reads/<project>.json under ~/.corthex/hub/ on a
        device: for each session, the time of its last read of the project's agent to-do, as the
        server's answer named it in read_at (SPEC-187, SPEC-191), the newest first. Sessions
        without a label share the entry that has no session. Not a request: it is here so that
        one schema checks it. Planned by the design revision of 2026-11-11.
      type: object
      required: [format, project, reads]
      additionalProperties: false
      properties:
        format: {const: 1}
        project: {$ref: "#/components/schemas/ProjectName"}
        reads:
          type: array
          items:
            type: object
            required: [at]
            additionalProperties: false
            properties:
              session: {$ref: "#/components/schemas/SessionLabel"}
              at: {$ref: "#/components/schemas/Time"}

    ProjectData:
      description: >-
        What the server holds of a project (API-177). title, repository, commit, revision,
        generated_at and pushed_at are the stored snapshot's, as the project's card gives them;
        read_at and read_session are the space's last read of the agent to-do with the service
        token (TBL-102), both null before the first read and for a project without a space, and
        read_session also null when that read named no session; unread_since is the oldest time
        since which an entry that the agent has not read waits, null when there is none
        (SPEC-188, SPEC-189); and removal is the answer of getRemovalDryRun at the same moment.
      type: object
      required: [project, title, repository, commit, revision, generated_at, pushed_at, space, read_at, read_session, unread_since, removal]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        title: {type: [string, "null"], maxLength: 120}
        repository: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        revision: {type: integer, minimum: 1}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        pushed_at: {$ref: "#/components/schemas/Time"}
        space: {type: boolean}
        read_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        read_session: {anyOf: [{$ref: "#/components/schemas/SessionLabel"}, {type: "null"}]}
        unread_since: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        removal: {$ref: "#/components/schemas/RemovalDryRun"}
    ProjectExport:
      description: >-
        The export of a project's space (API-178, SPEC-201), with its head first: format, which
        stays 1 while members are only added, and a reader skips a member that it does not know;
        the project; commit, the default branch commit that the project shows, null when the
        stored snapshot names none; exported_at, the server's time; read_at, the agent's last
        read of the agent to-do, null before the first; space, false for a project with a
        snapshot and no space; and counts, how many of each kind the file holds, by which a
        reader checks that the file is whole. Then the lists, each in a fixed order: the comments
        by made_at and ID, each with its replies and its decisions by seq; the proposals and the
        edits by made_at and ID; and the checkpoints by passed_at and ID. The server writes the
        members in this order. Phase ② adds its lists: the edit drafts, the positions and the
        work boards.
      type: object
      required: [format, project, commit, exported_at, read_at, space, counts, comments, proposals, edits, checkpoints]
      additionalProperties: false
      properties:
        format: {const: 1}
        project: {$ref: "#/components/schemas/ProjectName"}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        exported_at: {$ref: "#/components/schemas/Time"}
        read_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        space: {type: boolean}
        counts:
          type: object
          required: [comments, replies, decisions, proposals, edits, checkpoints]
          additionalProperties: false
          properties:
            comments: {type: integer, minimum: 0}
            replies: {type: integer, minimum: 0}
            decisions: {type: integer, minimum: 0}
            proposals: {type: integer, minimum: 0}
            edits: {type: integer, minimum: 0}
            checkpoints: {type: integer, minimum: 0}
        comments: {type: array, maxItems: 2000, items: {$ref: "#/components/schemas/ExportComment"}}
        proposals: {type: array, items: {$ref: "#/components/schemas/Proposal"}}
        edits: {type: array, items: {$ref: "#/components/schemas/Edit"}}
        checkpoints: {type: array, items: {$ref: "#/components/schemas/Checkpoint"}}
    ExportComment:
      description: A comment as the export holds it, whole, with its replies and the decisions recorded on it (SPEC-201)
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [replies, decisions]
          properties:
            replies: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/Reply"}}
            decisions: {type: array, items: {$ref: "#/components/schemas/Decision"}}
    RequestShown:
      description: >-
        A checkpoint request as an entry of my turn shows it whole (SPEC-196, open under D17 of
        stage 02): entry, the place of the request's last entry, 0 for the comment's own text and
        otherwise its reply's seq, which a pass names; text, that entry's whole text; look_first,
        the thing to look at first as that entry gave it, an item with the stage that holds it
        and its title in the stored snapshot, or an address; and left, what is left in the
        request's stage of the part: its open discrepancies, its other open comments and its
        pending reflections (REQ-176). The commit that the entry shows is that of the project's
        card.
      type: object
      required: [entry, text, look_first, left]
      additionalProperties: false
      properties:
        entry: {type: integer, minimum: 0, maximum: 200}
        text: {type: string, minLength: 1, maxLength: 1200}
        look_first:
          type: object
          required: [item, url, stage, held, title]
          additionalProperties: false
          properties:
            item: {anyOf: [{$ref: "#/components/schemas/TraceId"}, {type: "null"}]}
            url: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
            stage:
              description: The stage of the stored snapshot that holds the item, at whose page the item opens; null for an address and for an item that no stage holds now
              anyOf: [{$ref: "#/components/schemas/StageKey"}, {type: "null"}]
            held:
              description: Whether a stage of the stored snapshot holds the item now; when false the entry shows the item's ID as text, and for an address it is false
              type: boolean
            title: {description: "The item's title in the stored snapshot; null for an address and for an item that is not held", type: [string, "null"], maxLength: 120}
        left:
          type: object
          required: [discrepancies, comments, reflections]
          additionalProperties: false
          properties:
            discrepancies: {type: integer, minimum: 0}
            comments: {type: integer, minimum: 0}
            reflections: {type: integer, minimum: 0}

    PlannedNewComment:
      description: >-
        The planned body of leaveComment (SPEC-197, SPEC-198): NewComment with look_first. A
        comment whose asks is checkpoint is its stage's checkpoint request: item is "", text
        holds at most 1,200 characters and 10 lines, and look_first is required, a trace ID that
        a stage of the stored snapshot holds or an https address. Any other comment sends no
        look_first. The server checks these rules in code and answers 400 by the field, as it
        does for the other rules that a schema of this contract cannot state. When built, it
        replaces NewComment.
      type: object
      required: [part, stage, item, text]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        item: {$ref: "#/components/schemas/ItemRef"}
        quote: {type: string, minLength: 1, maxLength: 300}
        discrepancy: {$ref: "#/components/schemas/DiscrepancyId"}
        commit: {$ref: "#/components/schemas/Commit"}
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        asks: {description: "What the agent's comment asks of the user; only the agent sends it", type: string, enum: [answer, recommended, checkpoint]}
        look_first:
          description: The thing to look at first of a checkpoint request; sent only with asks checkpoint, and then required
          anyOf:
            - $ref: "#/components/schemas/TraceId"
            - $ref: "#/components/schemas/Link"
    PlannedNewReply:
      description: >-
        The planned body of replyToComment (SPEC-197): NewReply with look_first. A reply whose
        asks is checkpoint asks for the checkpoint on a comment on the stage as a whole: text
        holds at most 1,200 characters and 10 lines, and look_first is required, as for
        PlannedNewComment. Any other reply sends no look_first. The server checks these rules in
        code and answers 400 by the field. When built, it replaces NewReply.
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        settles: {type: boolean, default: false}
        asks: {description: "What the agent's reply asks of the user; only the agent sends it", type: string, enum: [answer, recommended, checkpoint]}
        look_first:
          description: The thing to look at first of a reply that asks for the checkpoint; sent only with asks checkpoint, and then required
          anyOf:
            - $ref: "#/components/schemas/TraceId"
            - $ref: "#/components/schemas/Link"
    PlannedNewCheckpoint:
      description: >-
        The planned body of passCheckpoint (SPEC-194 to SPEC-196): NewCheckpoint with what the
        page showed, open under D17 of stage 02, and with driven, planned whatever D17 decides.
        A pass names commit, the default branch commit of the project's snapshot as the page's
        data gave it, or revision, the snapshot's revision, where that snapshot names no commit:
        one of the two, never both and never neither. A pass that answers a checkpoint request
        names its comment and entry together: the place of the request's last entry as the page
        showed it, 0 for the comment's own text and otherwise its reply's seq. driven is what
        the page read from navigator.webdriver, left out when the page cannot tell. The server
        checks these rules in code and answers 400 by the field. When built, it replaces
        NewCheckpoint.
      type: object
      required: [part, stage]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        words: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        commit: {$ref: "#/components/schemas/Commit"}
        revision: {type: integer, minimum: 1}
        comment: {$ref: "#/components/schemas/CommentId"}
        entry: {type: integer, minimum: 0, maximum: 200}
        driven: {type: boolean}
    PlannedErrorCode:
      description: >-
        ErrorCode with the three codes that the design revision of 2026-11-11 plans
        (planned_errors under x-corthex). When the first of them is built, the codes join
        ErrorCode and their entries join errors, and this schema goes.
      anyOf:
        - $ref: "#/components/schemas/ErrorCode"
        - type: string
          enum: [checkpoint_requested, snapshot_changed, request_changed]
    PlannedProblem:
      description: >-
        Problem with the planned codes and the three members that they add: comment and entry,
        the stage's open checkpoint request and the place of its last entry, and revision, the
        stored snapshot's revision where it names no commit. The planned forms use it for the
        answers that can hold them. When built, the members join Problem and this schema goes.
      type: object
      required: [title, status, detail, code, traceId, error]
      additionalProperties: false
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, maxLength: 120}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 300}
        instance: {type: string, format: uri-reference}
        code: {$ref: "#/components/schemas/PlannedErrorCode"}
        traceId:
          description: As in Problem
          type: string
          pattern: '^[0-9a-f]{16}(?:-[A-Z]{3})?$'
        error: {type: string, maxLength: 300}
        field: {type: string, maxLength: 120}
        limit: {type: integer, minimum: 1}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        held_commit: {$ref: "#/components/schemas/Commit"}
        stored_at: {$ref: "#/components/schemas/ZonedTime"}
        bound: {$ref: "#/components/schemas/Link"}
        state: {type: string, enum: [accepted, dismissed, withdrawn, pending, in-review, needs-user, closed]}
        pull_request: {$ref: "#/components/schemas/Link"}
        ends_at: {$ref: "#/components/schemas/Time"}
        why: {type: string, enum: [not-drawn, size, other-repository]}
        needs: {$ref: "#/components/schemas/Author"}
        comment: {$ref: "#/components/schemas/CommentId"}
        entry: {type: integer, minimum: 0, maximum: 200}
        revision: {type: integer, minimum: 1}

  pathItems:
    getAgentTodo:
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/SessionOptional"
      get:
        tags: [Stage progress]
        summary: The agent to-do, with the read recorded
        description: >-
          The planned form of getAgentTodo (SPEC-187). A read that carries the service token
          records the time of the read for the project's space, by the server's clock, with the
          session label that Nexus-Session names or with none, before the lists are gathered, and
          the answer names that time in read_at; the record replaces the one before it, and
          nothing else of the request is stored. A read under a person's own sign-in is answered
          as now, records nothing and names null, so that no page can move the last read; a HEAD
          records nothing either. A project without a space is 404 and a label in another form is
          400, and neither records anything. When the record cannot be written, the answer is 500
          and holds no list, so that an answered read is always a recorded one. The lists, their
          order and their limits stay as they are; their comments, reflections and checkpoints
          hold the fields that the revision adds. The hub knows a server of the revision by
          read_at in the answer.
        x-corthex:
          id: API-113
          replaces: getAgentTodo
          spec: [SPEC-113, SPEC-135, SPEC-136, SPEC-187, SPEC-189, SPEC-191]
          status: planned
          omit:
            "401": answered by Cloudflare Access before the server sees the request (Sign-in in nexus.md)
            "409": a read clashes with no state
        responses:
          "200":
            description: The agent to-do
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Todo"}
                examples:
                  read-by-the-agent: {$ref: "#/components/examples/todo_planned"}
                  read-by-the-user:
                    summary: Nothing waits, read under a person's own sign-in, which records no read
                    value:
                      project: corthex
                      default_commit: 3f1c9a7e5b2d4c6a8e0f1b3d5c7a9e1f2b4d6c8a
                      session: null
                      read_at: null
                      comments: {total: 0, entries: []}
                      discrepancies: {total: 0, entries: []}
                      reflections: {total: 0, entries: []}
                      checkpoints: {total: 0, entries: []}
                      waiting_for_user: 0
                      taken: 0
          "400":
            description: The session label is not in its form
            content:
              application/problem+json:
                schema: {$ref: "#/components/schemas/Problem"}
                examples:
                  bad-session: {$ref: "#/components/examples/invalid_session"}
          "403": {$ref: "#/components/responses/ReadRefused"}
          "404": {$ref: "#/components/responses/SpaceNotFound"}
          default: {$ref: "#/components/responses/Unexpected"}
    leaveComment:
      parameters:
