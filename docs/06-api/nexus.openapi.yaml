  schemas:
    ProjectName:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 100
    PartName:
      description: A part's name, or "" for the project as a whole
      type: string
      pattern: '^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$'
      maxLength: 100
    StageKey:
      type: string
      enum: [01-domain, 02-prd, 03-user-flow, 04-functional-spec, 05-erd, 06-api, 07-sitemap, 08-screen-states, 09-mockup, 10-wbs, 11-development, 12-qa, 13-presentation]
    PictureStage:
      description: The stages that have pictures, the DDD board, the ERD and the sitemap
      type: string
      enum: [01-domain, 05-erd, 07-sitemap]
    Commit:
      description: A full commit ID, as Git gives it
      type: string
      pattern: '^[0-9a-f]{40}(?:[0-9a-f]{24})?$'
    Time:
      description: A time in UTC with milliseconds, from the server's clock
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
    ZonedTime:
      description: A time with its zone, from a device or from Git
      type: string
      format: date-time
      maxLength: 40
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    TraceId:
      type: string
      pattern: '^[A-Z][A-Z0-9]*-[0-9]{1,6}$'
      maxLength: 30
    ItemRef:
      description: A trace ID, or "" for the picture itself
      type: string
      pattern: '^(?:[A-Z][A-Z0-9]*-[0-9]{1,6})?$'
      maxLength: 30
    CommentId: {type: string, pattern: '^nc_[0-9a-hjkmnp-tv-z]{12}$'}
    DiscrepancyId: {type: string, pattern: '^nd_[0-9a-hjkmnp-tv-z]{12}$'}
    ProposalId: {type: string, pattern: '^np_[0-9a-hjkmnp-tv-z]{12}$'}
    EditId: {type: string, pattern: '^ne_[0-9a-hjkmnp-tv-z]{12}$'}
    CheckpointId: {type: string, pattern: '^nk_[0-9a-hjkmnp-tv-z]{12}$'}
    EntryId: {type: string, pattern: '^n[cdek]_[0-9a-hjkmnp-tv-z]{12}$'}
    WriteId: {type: string, pattern: '^nw_[0-9a-hjkmnp-tv-z]{12}$'}
    SessionLabel: {type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$'}
    Author: {type: string, enum: [user, agent]}
    Link:
      description: An https address
      type: string
      format: uri
      pattern: '^https://'
      maxLength: 2000
    Where:
      description: A file and a line at the commit, relative to the repository
      type: string
      pattern: '^[^\n]+:[0-9]+$'
      maxLength: 300
    Name:
      description: A name in a picture, cut at 120 characters as titles are
      type: string
      maxLength: 120
    Words:
      description: A longer text in a picture, cut at 300 characters
      type: string
      maxLength: 300

    ErrorCode:
      type: string
      enum: [invalid_request, invalid_snapshot, clock_ahead, unknown_item, access_missing, access_other_app, cross_site, user_only, agent_only, no_kind, not_found, project_not_found, space_not_found, part_not_found, picture_not_found, comment_not_found, discrepancy_not_found, proposal_not_found, edit_not_found, checkpoint_not_found, entry_not_found, item_not_found, method_not_allowed, older_snapshot, commit_not_replaced, too_many_projects, repository_mismatch, comment_limit, reply_limit, proposal_limit, reflection_limit, space_full, comment_closed, proposal_not_open, edit_state, pull_request_reported, pull_request_mismatch, claimed, entry_closed, checkpoint_recorded, checkpoint_withdrawn, checkpoint_state, not_recommended, write_id_reused, snapshot_too_large, body_too_large, text_too_long, json_required, internal]
    Problem:
      description: >-
        Problem Details (RFC 9457), sent as application/problem+json. NEXUS sends no type, which
        RFC 9457 reads as about:blank, and no instance. error repeats detail for hubs of 0.1,
        which show a refusal's error member. The other members are those that the code's entry
        in Error codes in nexus.md names.
      type: object
      required: [title, status, detail, code, traceId, error]
      additionalProperties: false
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, maxLength: 120}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 300}
        instance: {type: string, format: uri-reference}
        code: {$ref: "#/components/schemas/ErrorCode"}
        traceId:
          description: The request's Ray ID, which Cloudflare's logs and the Worker's log line hold; 16 random hexadecimal characters where there is none
          type: string
          pattern: '^[0-9a-f]{16}(?:-[A-Z]{3})?$'
        error: {type: string, maxLength: 300}
        field: {type: string, maxLength: 120}
        limit: {type: integer, minimum: 1}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        held_commit: {$ref: "#/components/schemas/Commit"}
        stored_at: {$ref: "#/components/schemas/ZonedTime"}
        bound: {$ref: "#/components/schemas/Link"}
        state: {type: string, enum: [accepted, dismissed, withdrawn, pending, in-review, needs-user, closed]}
        pull_request: {$ref: "#/components/schemas/Link"}
        ends_at: {$ref: "#/components/schemas/Time"}
        why: {type: string, enum: [not-drawn, size, other-repository]}
        needs: {$ref: "#/components/schemas/Author"}

    Item:
      type: object
      required: [id, kind, stage]
      properties:
        id: {type: string}
        kind: {type: string}
        stage: {type: string}
        where: {type: string}
        title: {type: string, maxLength: 120}
        status: {type: string}
        type: {type: string}
        priority: {type: string}
        link: {type: string}
        parent: {type: string}
        screen_doc: {type: string}
        states: {type: array, items: {type: string}}
        links: {type: array, maxItems: 60, items: {type: string}}
    Check:
      type: object
      required: [rule, level, message]
      properties:
        rule: {type: string}
        level: {type: string, enum: [error, warn, info]}
        message: {type: string}
        by: {type: string, enum: [scan, review, server]}
        stage: {type: string}
        part: {$ref: "#/components/schemas/PartName"}
        at: {type: string}
        refs: {type: array, items: {type: string}}
        args: {type: object}
    Repo:
      type: object
      properties:
        commit: {type: string}
        branch: {type: string}
        url: {type: string}
        web: {type: string}
        dirty: {type: boolean}
        checkout: {type: boolean}
        default:
          description: From 0.2, for the project's own repository only
          type: object
          required: [branch, commit, time]
          properties:
            branch: {type: string, maxLength: 255}
            commit: {$ref: "#/components/schemas/Commit"}
            time: {$ref: "#/components/schemas/ZonedTime"}
    RecordCheckpoint:
      description: A checkpoint as a stage record holds it (TBL-115); where is omitted when absent or unsafe (SPEC-109)
      type: object
      required: [approved, by, date]
      additionalProperties: false
      properties:
        approved: {type: string, minLength: 1, maxLength: 2000}
        by: {type: string, minLength: 1, maxLength: 120}
        where: {$ref: "#/components/schemas/Link"}
        date: {$ref: "#/components/schemas/Date"}
        nexus: {$ref: "#/components/schemas/CheckpointId"}
    StagePart:
      description: One part's record of a stage, in a snapshot of 0.2
      type: object
      required: [state, checkpoints, next, updated]
      properties:
        state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
        checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
        next: {type: string, maxLength: 300}
        updated: {$ref: "#/components/schemas/ZonedTime"}
    SnapshotStage:
      type: object
      properties:
        name: {type: string}
        human: {type: string}
        link: {type: string}
        truth: {type: string}
        note: {type: string}
        source: {type: string}
        repo: {type: string}
        source_state: {type: string, enum: [found, missing, none, no-checkout, skipped, invalid]}
        state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
        checkpoint: {type: string}
        checkpoint_date: {type: string}
        next: {type: string}
        updated: {type: string}
        read: {type: boolean}
        skip: {type: boolean}
        default_source: {type: boolean}
        files: {type: number}
        items: {type: number}
        copied: {type: object, properties: {oldest: {type: string}, newest: {type: string}}}
        skipped: {type: object, additionalProperties: {type: number}}
        checkpoints:
          description: From 0.2, for a project without parts
          type: array
          items: {$ref: "#/components/schemas/RecordCheckpoint"}
        parts:
          description: From 0.2, for a project with parts, each part's record of the stage
          type: object
          additionalProperties: {$ref: "#/components/schemas/StagePart"}
    SnapshotFields:
      description: The fields of both formats, as nexus/src/snapshot.js checks them; other fields are kept as sent
      type: object
      required: [schema, generated_at, project, stages, items, checks, summary]
      properties:
        generator: {type: string}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        project:
          type: object
          required: [name]
          properties:
            name: {$ref: "#/components/schemas/ProjectName"}
            title: {type: string}
            team: {type: boolean}
            language: {type: string}
            records: {type: object, properties: {kind: {type: string}, link: {type: string}}}
            parts:
              description: From 0.2, the parts that the project settings name, in their order
              type: array
              minItems: 1
              maxItems: 50
              uniqueItems: true
              items: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100}
        ids: {type: object, additionalProperties: {type: string}}
        repos: {type: object, additionalProperties: {$ref: "#/components/schemas/Repo"}}
        stages: {type: object, maxProperties: 100, additionalProperties: {$ref: "#/components/schemas/SnapshotStage"}}
        items: {type: array, maxItems: 3000, items: {$ref: "#/components/schemas/Item"}}
        checks: {type: array, maxItems: 10000, items: {$ref: "#/components/schemas/Check"}}
        summary:
          type: object
          properties:
            items: {type: number}
            kinds: {type: object, additionalProperties: {type: number}}
            checks: {type: object, additionalProperties: {type: number}}
            states: {type: object, additionalProperties: {type: number}}
        truncated: {type: boolean}
    Snapshot01:
      description: The snapshot of phase 1, in the hub's snapshot.md
      allOf:
        - $ref: "#/components/schemas/SnapshotFields"
        - type: object
          properties:
            schema: {const: corthex-hub/0.1}
    Snapshot02:
      description: The snapshot of NEXUS 0.2 as the hub pushes it (TBL-114, Snapshot 0.2 in nexus.md)
      allOf:
        - $ref: "#/components/schemas/Snapshot02Fields"
        - type: object
          required: [pictures]
          properties:
            pictures:
              type: array
              items: {$ref: "#/components/schemas/PictureEntry"}
    StoredSnapshot02:
      description: >-
        A snapshot of 0.2 as the server stores it and getSnapshot returns it (TBL-101's body): the
        pushed snapshot without its pictures, whose sources the pictures keep (TBL-103)
      allOf:
        - $ref: "#/components/schemas/Snapshot02Fields"
        - not: {required: [pictures]}
    Snapshot02Fields:
      description: The fields of 0.2 that a pushed and a stored snapshot share
      allOf:
        - $ref: "#/components/schemas/SnapshotFields"
        - type: object
          required: [records, ask_before]
          properties:
            schema: {const: corthex-hub/0.2}
            replaces: {$ref: "#/components/schemas/Commit"}
            records:
              type: object
              required: [from]
              additionalProperties: false
              properties:
                from: {type: string, enum: [repository, status-file]}
                commit: {$ref: "#/components/schemas/Commit"}
                time: {$ref: "#/components/schemas/ZonedTime"}
            left_out:
              type: array
              items:
                type: object
                required: [part, stage, why]
                additionalProperties: false
                properties:
                  part: {$ref: "#/components/schemas/PartName"}
                  stage: {$ref: "#/components/schemas/PictureStage"}
                  why: {type: string, enum: [size, other-repository]}
            ask_before:
              type: object
              required: [entries, source, left_out]
              additionalProperties: false
              properties:
                entries: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 120}}
                source: {type: string, enum: [project, profile, default]}
                left_out: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 120}}
    PictureEntry:
      type: object
      required: [part, stage, commit, time, source]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        time: {$ref: "#/components/schemas/ZonedTime"}
        source: {$ref: "#/components/schemas/PictureSource"}
    PictureSource:
      description: What one picture shows, without a layout (Picture sources in nexus.md)
      oneOf:
        - $ref: "#/components/schemas/DomainSource"
        - $ref: "#/components/schemas/ErdSource"
        - $ref: "#/components/schemas/SitemapSource"
    DomainSource:
      type: object
      required: [format, contexts, aggregates, read_models, dependencies, hotspots]
      additionalProperties: false
      properties:
        format: {const: 1}
        contexts:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, name, type, purpose, removed, external, rows, where]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              type: {$ref: "#/components/schemas/Name"}
              purpose: {$ref: "#/components/schemas/Words"}
              removed: {type: boolean}
              external: {$ref: "#/components/schemas/Words"}
              where: {$ref: "#/components/schemas/Where"}
              rows:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [given_by, policy, read_model, command, aggregate, events, where]
                  additionalProperties: false
                  properties:
                    given_by: {$ref: "#/components/schemas/Words"}
                    policy: {type: boolean}
                    read_model: {$ref: "#/components/schemas/Name"}
                    command: {$ref: "#/components/schemas/Name"}
                    aggregate: {$ref: "#/components/schemas/Name"}
                    events: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/Name"}}
                    where: {$ref: "#/components/schemas/Where"}
        aggregates: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/BoardTerm"}}
        read_models: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/BoardTerm"}}
        dependencies:
          type: array
          maxItems: 500
          items:
            type: object
            required: [from, to, kind, why, data, where]
            additionalProperties: false
