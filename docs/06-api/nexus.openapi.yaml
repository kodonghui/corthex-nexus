    picture_data_sitemap:
      summary: The sitemap of a project without parts, from the stage 07 template's example with terms added and without its IDs and flows, drawn before its source was removed
      value:
        project: shop
        part: ""
        stage: 07-sitemap
        picture:
          commit: 0b9d7f5e3c1a2b4d6f8091a2b3c4d5e6f708192a
          committed_at: "2026-11-01T16:05:00+09:00"
          drawn_at: "2026-11-01T07:06:12.531Z"
          not_current: source-gone
          source:
            format: 1
            screens:
              - {id: "", name: Home, path: /, access: everyone, flows: [], context: "", terms: [], removed: false, where: "docs/07-sitemap/sitemap.yaml:1"}
              - {id: "", name: Order detail, path: "/orders/:id", access: signed-in customer, flows: [], parent: 0, context: "", terms: [TERM-085], removed: false, where: "docs/07-sitemap/sitemap.yaml:6"}
            without_screen: []
        comments: {total: 0, entries: []}
        closed_comments: {total: 0, entries: []}
        proposals: []
        reflections: []
        discrepancies: []

  schemas:
    ProjectName:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 100
    PartName:
      description: A part's name, or "" for the project as a whole
      type: string
      pattern: '^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$'
      maxLength: 100
    StageKey:
      type: string
      enum: [01-domain, 02-prd, 03-user-flow, 04-functional-spec, 05-erd, 06-api, 07-sitemap, 08-screen-states, 09-mockup, 10-wbs, 11-development, 12-qa, 13-presentation]
    PictureStage:
      description: The stages that have pictures, the DDD board, the ERD and the sitemap
      type: string
      enum: [01-domain, 05-erd, 07-sitemap]
    Commit:
      description: A full commit ID, as Git gives it
      type: string
      pattern: '^[0-9a-f]{40}(?:[0-9a-f]{24})?$'
    Time:
      description: A time in UTC with milliseconds, from the server's clock
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
    ZonedTime:
      description: A time with its zone, from a device or from Git
      type: string
      format: date-time
      maxLength: 40
    Date:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    TraceId:
      type: string
      pattern: '^[A-Z][A-Z0-9]*-[0-9]{1,6}$'
      maxLength: 30
    ItemRef:
      description: A trace ID, or "" for the picture itself
      type: string
      pattern: '^(?:[A-Z][A-Z0-9]*-[0-9]{1,6})?$'
      maxLength: 30
    CommentId: {type: string, pattern: '^nc_[0-9a-hjkmnp-tv-z]{12}$'}
    DiscrepancyId: {type: string, pattern: '^nd_[0-9a-hjkmnp-tv-z]{12}$'}
    ProposalId: {type: string, pattern: '^np_[0-9a-hjkmnp-tv-z]{12}$'}
    EditId: {type: string, pattern: '^ne_[0-9a-hjkmnp-tv-z]{12}$'}
    CheckpointId: {type: string, pattern: '^nk_[0-9a-hjkmnp-tv-z]{12}$'}
    EntryId: {type: string, pattern: '^n[cdek]_[0-9a-hjkmnp-tv-z]{12}$'}
    WriteId: {type: string, pattern: '^nw_[0-9a-hjkmnp-tv-z]{12}$'}
    SessionLabel: {type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$'}
    Author: {type: string, enum: [user, agent]}
    Link:
      description: An https address
      type: string
      format: uri
      pattern: '^https://'
      maxLength: 2000
    Where:
      description: A file and a line at the commit, relative to the repository
      type: string
      pattern: '^[^\n]+:[0-9]+$'
      maxLength: 300
    Name:
      description: A name in a picture, cut at 120 characters as titles are
      type: string
      maxLength: 120
    Words:
      description: A longer text in a picture, cut at 300 characters
      type: string
      maxLength: 300

    ErrorCode:
      type: string
      enum: [invalid_request, invalid_snapshot, clock_ahead, unknown_item, access_missing, access_other_app, cross_site, user_only, agent_only, no_kind, not_found, project_not_found, space_not_found, part_not_found, picture_not_found, comment_not_found, discrepancy_not_found, proposal_not_found, edit_not_found, checkpoint_not_found, entry_not_found, method_not_allowed, older_snapshot, commit_not_replaced, too_many_projects, repository_mismatch, comment_limit, reply_limit, proposal_limit, reflection_limit, space_full, comment_closed, proposal_not_open, edit_state, pull_request_reported, pull_request_mismatch, claimed, entry_closed, checkpoint_recorded, checkpoint_withdrawn, checkpoint_state, write_id_reused, snapshot_too_large, body_too_large, text_too_long, json_required, internal]
    Problem:
      description: >-
        Problem Details (RFC 9457), sent as application/problem+json. NEXUS sends no type, which
        RFC 9457 reads as about:blank, and no instance. error repeats detail for hubs of 0.1,
        which show a refusal's error member. The other members are those that the code's entry
        in Error codes in nexus.md names.
      type: object
      required: [title, status, detail, code, traceId, error]
      additionalProperties: false
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string, maxLength: 120}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 300}
        instance: {type: string, format: uri-reference}
        code: {$ref: "#/components/schemas/ErrorCode"}
        traceId:
          description: The request's Ray ID, which Cloudflare's logs and the Worker's log line hold; 16 random hexadecimal characters where there is none
          type: string
          pattern: '^[0-9a-f]{16}(?:-[A-Z]{3})?$'
        error: {type: string, maxLength: 300}
        field: {type: string, maxLength: 120}
        limit: {type: integer, minimum: 1}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        held_commit: {$ref: "#/components/schemas/Commit"}
        stored_at: {$ref: "#/components/schemas/ZonedTime"}
        bound: {$ref: "#/components/schemas/Link"}
        state: {type: string, enum: [accepted, dismissed, withdrawn, pending, in-review, needs-user, closed]}
        pull_request: {$ref: "#/components/schemas/Link"}
        ends_at: {$ref: "#/components/schemas/Time"}
        why: {type: string, enum: [not-drawn, size, other-repository]}
        needs: {$ref: "#/components/schemas/Author"}

    Item:
      type: object
      required: [id, kind, stage]
      properties:
        id: {type: string}
        kind: {type: string}
        stage: {type: string}
        where: {type: string}
        title: {type: string, maxLength: 120}
        status: {type: string}
        type: {type: string}
        priority: {type: string}
        link: {type: string}
        parent: {type: string}
        screen_doc: {type: string}
        states: {type: array, items: {type: string}}
        links: {type: array, maxItems: 60, items: {type: string}}
    Check:
      type: object
      required: [rule, level, message]
      properties:
        rule: {type: string}
        level: {type: string, enum: [error, warn, info]}
        message: {type: string}
        by: {type: string, enum: [scan, review, server]}
        stage: {type: string}
        part: {$ref: "#/components/schemas/PartName"}
        at: {type: string}
        refs: {type: array, items: {type: string}}
        args: {type: object}
    Repo:
      type: object
      properties:
        commit: {type: string}
        branch: {type: string}
        url: {type: string}
        web: {type: string}
        dirty: {type: boolean}
        checkout: {type: boolean}
        default:
          description: From 0.2, for the project's own repository only
          type: object
          required: [branch, commit, time]
          properties:
            branch: {type: string, maxLength: 255}
            commit: {$ref: "#/components/schemas/Commit"}
            time: {$ref: "#/components/schemas/ZonedTime"}
    RecordCheckpoint:
      description: A checkpoint as a stage record holds it (TBL-115)
      type: object
      required: [approved, by, where, date]
      additionalProperties: false
      properties:
        approved: {type: string, minLength: 1, maxLength: 2000}
        by: {type: string, minLength: 1, maxLength: 120}
        where: {$ref: "#/components/schemas/Link"}
        date: {$ref: "#/components/schemas/Date"}
        nexus: {$ref: "#/components/schemas/CheckpointId"}
    StagePart:
      description: One part's record of a stage, in a snapshot of 0.2
      type: object
      required: [state, checkpoints, next, updated]
      properties:
        state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
        checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
        next: {type: string, maxLength: 300}
        updated: {$ref: "#/components/schemas/ZonedTime"}
    SnapshotStage:
      type: object
      properties:
        name: {type: string}
        human: {type: string}
        link: {type: string}
        truth: {type: string}
        note: {type: string}
        source: {type: string}
        repo: {type: string}
        source_state: {type: string, enum: [found, missing, none, no-checkout, skipped, invalid]}
        state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
        checkpoint: {type: string}
        checkpoint_date: {type: string}
        next: {type: string}
        updated: {type: string}
        read: {type: boolean}
        skip: {type: boolean}
        default_source: {type: boolean}
        files: {type: number}
        items: {type: number}
        copied: {type: object, properties: {oldest: {type: string}, newest: {type: string}}}
        skipped: {type: object, additionalProperties: {type: number}}
        checkpoints:
          description: From 0.2, for a project without parts
          type: array
          items: {$ref: "#/components/schemas/RecordCheckpoint"}
        parts:
          description: From 0.2, for a project with parts, each part's record of the stage
          type: object
          additionalProperties: {$ref: "#/components/schemas/StagePart"}
    SnapshotFields:
      description: The fields of both formats, as nexus/src/snapshot.js checks them; other fields are kept as sent
      type: object
      required: [schema, generated_at, project, stages, items, checks, summary]
      properties:
        generator: {type: string}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        project:
          type: object
          required: [name]
          properties:
            name: {$ref: "#/components/schemas/ProjectName"}
            title: {type: string}
            team: {type: boolean}
            language: {type: string}
            records: {type: object, properties: {kind: {type: string}, link: {type: string}}}
            parts:
              description: From 0.2, the parts that the project settings name, in their order
              type: array
              minItems: 1
              maxItems: 50
              uniqueItems: true
              items: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100}
        ids: {type: object, additionalProperties: {type: string}}
        repos: {type: object, additionalProperties: {$ref: "#/components/schemas/Repo"}}
        stages: {type: object, maxProperties: 100, additionalProperties: {$ref: "#/components/schemas/SnapshotStage"}}
        items: {type: array, maxItems: 3000, items: {$ref: "#/components/schemas/Item"}}
        checks: {type: array, maxItems: 10000, items: {$ref: "#/components/schemas/Check"}}
        summary:
          type: object
          properties:
            items: {type: number}
            kinds: {type: object, additionalProperties: {type: number}}
            checks: {type: object, additionalProperties: {type: number}}
            states: {type: object, additionalProperties: {type: number}}
        truncated: {type: boolean}
    Snapshot01:
      description: The snapshot of phase 1, in the hub's snapshot.md
      allOf:
        - $ref: "#/components/schemas/SnapshotFields"
        - type: object
          properties:
            schema: {const: corthex-hub/0.1}
    Snapshot02:
      description: The snapshot of NEXUS 0.2 as the hub pushes it (TBL-114, Snapshot 0.2 in nexus.md)
      allOf:
        - $ref: "#/components/schemas/Snapshot02Fields"
        - type: object
          required: [pictures]
          properties:
            pictures:
              type: array
              items: {$ref: "#/components/schemas/PictureEntry"}
    StoredSnapshot02:
      description: >-
        A snapshot of 0.2 as the server stores it and getSnapshot returns it (TBL-101's body): the
        pushed snapshot without its pictures, whose sources the pictures keep (TBL-103)
      allOf:
        - $ref: "#/components/schemas/Snapshot02Fields"
        - not: {required: [pictures]}
    Snapshot02Fields:
      description: The fields of 0.2 that a pushed and a stored snapshot share
      allOf:
        - $ref: "#/components/schemas/SnapshotFields"
        - type: object
          required: [records, ask_before]
          properties:
            schema: {const: corthex-hub/0.2}
            replaces: {$ref: "#/components/schemas/Commit"}
            records:
              type: object
              required: [from]
              additionalProperties: false
              properties:
                from: {type: string, enum: [repository, status-file]}
                commit: {$ref: "#/components/schemas/Commit"}
                time: {$ref: "#/components/schemas/ZonedTime"}
            left_out:
              type: array
              items:
                type: object
                required: [part, stage, why]
                additionalProperties: false
                properties:
                  part: {$ref: "#/components/schemas/PartName"}
                  stage: {$ref: "#/components/schemas/PictureStage"}
                  why: {type: string, enum: [size, other-repository]}
            ask_before:
              type: object
              required: [entries, source, left_out]
              additionalProperties: false
              properties:
                entries: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 120}}
                source: {type: string, enum: [project, profile, default]}
                left_out: {type: array, maxItems: 30, items: {type: string, minLength: 1, maxLength: 120}}
    PictureEntry:
      type: object
      required: [part, stage, commit, time, source]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        time: {$ref: "#/components/schemas/ZonedTime"}
        source: {$ref: "#/components/schemas/PictureSource"}
    PictureSource:
      description: What one picture shows, without a layout (Picture sources in nexus.md)
      oneOf:
        - $ref: "#/components/schemas/DomainSource"
        - $ref: "#/components/schemas/ErdSource"
        - $ref: "#/components/schemas/SitemapSource"
    DomainSource:
      type: object
      required: [format, contexts, aggregates, read_models, dependencies, hotspots]
      additionalProperties: false
      properties:
        format: {const: 1}
        contexts:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, name, type, purpose, removed, external, rows, where]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              type: {$ref: "#/components/schemas/Name"}
              purpose: {$ref: "#/components/schemas/Words"}
              removed: {type: boolean}
              external: {$ref: "#/components/schemas/Words"}
              where: {$ref: "#/components/schemas/Where"}
              rows:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [given_by, policy, read_model, command, aggregate, events, where]
                  additionalProperties: false
                  properties:
                    given_by: {$ref: "#/components/schemas/Words"}
                    policy: {type: boolean}
                    read_model: {$ref: "#/components/schemas/Name"}
                    command: {$ref: "#/components/schemas/Name"}
                    aggregate: {$ref: "#/components/schemas/Name"}
                    events: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/Name"}}
                    where: {$ref: "#/components/schemas/Where"}
        aggregates: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/BoardTerm"}}
        read_models: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/BoardTerm"}}
        dependencies:
          type: array
          maxItems: 500
          items:
            type: object
            required: [from, to, kind, why, data, where]
            additionalProperties: false
            properties:
              from: {$ref: "#/components/schemas/Name"}
              to: {$ref: "#/components/schemas/Name"}
              kind: {type: string, enum: [call, event, ""]}
              why: {$ref: "#/components/schemas/Words"}
              data: {$ref: "#/components/schemas/Words"}
              where: {$ref: "#/components/schemas/Where"}
        hotspots:
          type: array
          maxItems: 500
          items:
            type: object
            required: [text, contexts, state, answer, where]
            additionalProperties: false
            properties:
              number: {type: integer, minimum: 1}
              text: {$ref: "#/components/schemas/Words"}
              contexts: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/TraceId"}}
              state: {$ref: "#/components/schemas/Name"}
              answer: {$ref: "#/components/schemas/Words"}
              where: {$ref: "#/components/schemas/Where"}
        timeline:
          description: The board's timeline, its lanes in order, each with its places from left to right and the events stacked in each; left out when the document has none (Picture sources in nexus.md)
          type: array
          maxItems: 50
          items:
            type: object
            required: [lane, places, where]
            additionalProperties: false
            properties:
              lane: {$ref: "#/components/schemas/Name"}
              places:
                type: array
                maxItems: 200
                items: {type: array, minItems: 1, maxItems: 10, items: {$ref: "#/components/schemas/Name"}}
              where: {$ref: "#/components/schemas/Where"}
    BoardTerm:
      description: An aggregate or a read model, by its name in its context, with the glossary's term of the same name
      type: object
      required: [name, context, removed, where]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        context: {$ref: "#/components/schemas/ItemRef"}
        term: {$ref: "#/components/schemas/TraceId"}
        removed: {type: boolean}
        where: {$ref: "#/components/schemas/Where"}
    ErdSource:
      type: object
      required: [format, tables, without_table]
      additionalProperties: false
      properties:
        format: {const: 1}
        tables:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, name, context, removed, columns, primary_key, unique, foreign_keys, where]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              context: {$ref: "#/components/schemas/ItemRef"}
              terms:
                description: The TERM IDs in the table's comment, empty for terms none, and left out when the comment says neither
                type: array
                maxItems: 20
                items: {$ref: "#/components/schemas/TraceId"}
              removed: {type: boolean}
              where: {$ref: "#/components/schemas/Where"}
              columns:
                type: array
                maxItems: 300
                items:
                  type: object
                  required: [name, type, "null", where]
                  additionalProperties: false
                  properties:
                    name: {$ref: "#/components/schemas/Name"}
                    type: {$ref: "#/components/schemas/Name"}
                    "null": {type: boolean}
                    where: {$ref: "#/components/schemas/Where"}
              primary_key: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
              unique:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [columns, partial]
                  additionalProperties: false
                  properties:
                    columns: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    partial: {type: boolean}
              foreign_keys:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [columns, table, references, on_delete, where]
                  additionalProperties: false
                  properties:
                    columns: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    table: {$ref: "#/components/schemas/Name"}
                    references: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Name"}}
                    on_delete: {type: string, enum: [cascade, set null, set default, restrict, no action, ""]}
                    where: {$ref: "#/components/schemas/Where"}
        without_table: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/TraceId"}}
    SitemapSource:
      type: object
      required: [format, screens, without_screen]
      additionalProperties: false
      properties:
        format: {const: 1}
        screens:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, name, path, access, flows, context, removed, where]
            additionalProperties: false
            properties:
              id: {$ref: "#/components/schemas/ItemRef"}
              name: {$ref: "#/components/schemas/Name"}
              path: {$ref: "#/components/schemas/Words"}
              access: {$ref: "#/components/schemas/Name"}
              flows: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
              parent:
                description: The parent's place in screens, left out for a screen at the top
                type: integer
                minimum: 0
              context: {$ref: "#/components/schemas/ItemRef"}
              terms:
                description: The TERM IDs under the screen's terms, empty for terms none or an empty list, and left out when it says neither
                type: array
                maxItems: 20
                items: {$ref: "#/components/schemas/TraceId"}
              removed: {type: boolean}
              where: {$ref: "#/components/schemas/Where"}
        without_screen: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/TraceId"}}

    PushAnswer01:
      type: object
      required: [name, revision]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ProjectName"}
        revision: {type: integer, minimum: 1}
    PushAnswer02:
      type: object
      required: [name, revision, default_commit, replaced, pictures, discrepancies, checkpoints, todo]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ProjectName"}
        revision: {type: integer, minimum: 1}
        default_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        replaced: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        pictures:
          type: object
          required: [drawn, current_again, not_current, unchanged]
          additionalProperties: false
          properties:
            drawn: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/PicturePlace"}}
            current_again: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/PicturePlace"}}
            not_current:
              type: array
              maxItems: 20
              items:
                allOf:
                  - $ref: "#/components/schemas/PicturePlace"
                  - type: object
                    required: [why]
                    properties:
                      why: {type: string, enum: [size, source-gone, other-repository]}
            unchanged: {type: integer, minimum: 0}
        discrepancies:
          type: object
          required: [opened, resolved, open, not_opened]
          additionalProperties: false
          properties:
            opened: {type: integer, minimum: 0}
            resolved: {type: integer, minimum: 0}
            open: {type: integer, minimum: 0}
            not_opened: {type: integer, minimum: 0}
        checkpoints:
          type: object
          required: [recorded, withdrawn_recorded]
          additionalProperties: false
          properties:
            recorded: {type: integer, minimum: 0}
            withdrawn_recorded: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/CheckpointId"}}
        todo: {$ref: "#/components/schemas/TodoCounts"}
    PicturePlace:
      type: object
      required: [part, stage]
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
    TodoCounts:
      type: object
      required: [comments, discrepancies, reflections, checkpoints]
      additionalProperties: false
      properties:
        comments: {type: integer, minimum: 0}
        discrepancies: {type: integer, minimum: 0}
        reflections: {type: integer, minimum: 0}
        checkpoints: {type: integer, minimum: 0}
    SnapshotList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name, revision, generated_at, received_at, bytes]
            properties:
              name: {$ref: "#/components/schemas/ProjectName"}
              revision: {type: integer, minimum: 1}
              generated_at: {$ref: "#/components/schemas/ZonedTime"}
              received_at: {$ref: "#/components/schemas/Time"}
              bytes: {type: integer, minimum: 1, maximum: 1048576}
    Removed:
      type: object
      required: [name, removed]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ProjectName"}
        removed: {const: true}
    Held:
      type: object
      required: [project, revision, default_commit, generated_at, received_at]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        revision: {type: integer, minimum: 1}
        default_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        generated_at: {$ref: "#/components/schemas/ZonedTime"}
        received_at: {$ref: "#/components/schemas/Time"}
    IdList:
      type: object
      required: [total, ids]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        ids: {type: array, maxItems: 20, items: {type: string, pattern: '^n[cpek]_[0-9a-hjkmnp-tv-z]{12}$'}}
    RemovalDryRun:
      type: object
      required: [project, deletes, open]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        deletes:
          type: object
          required: [snapshot, space, pictures, discrepancies, comments, replies, decisions, proposals, edits, checkpoints]
          additionalProperties: false
          properties:
            snapshot: {const: true}
            space: {type: boolean}
            pictures: {type: integer, minimum: 0}
            discrepancies: {type: integer, minimum: 0}
            comments: {type: integer, minimum: 0}
            replies: {type: integer, minimum: 0}
            decisions: {type: integer, minimum: 0}
            proposals: {type: integer, minimum: 0}
            edits: {type: integer, minimum: 0}
            checkpoints: {type: integer, minimum: 0}
        open:
          type: object
          required: [comments, proposals, reflections, checkpoints]
          additionalProperties: false
          properties:
            comments: {$ref: "#/components/schemas/IdList"}
            proposals: {$ref: "#/components/schemas/IdList"}
            reflections: {$ref: "#/components/schemas/IdList"}
            checkpoints: {$ref: "#/components/schemas/IdList"}

    Comment:
      type: object
      required: [id, part, stage, item, quote, discrepancy, commit, author, text, state, closed_as, waits, settled, dismissed, made_at, last_at]
      properties:
        id: {$ref: "#/components/schemas/CommentId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        item: {$ref: "#/components/schemas/ItemRef"}
        quote: {type: [string, "null"], maxLength: 300}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        commit: {$ref: "#/components/schemas/Commit"}
        author: {$ref: "#/components/schemas/Author"}
        text: {type: string, maxLength: 4000}
        state: {type: string, enum: [open, closed]}
        closed_as: {enum: [answered, decided, null]}
        waits: {enum: [user, agent, null]}
        settled: {type: boolean}
        dismissed: {type: boolean}
        made_at: {$ref: "#/components/schemas/Time"}
        last_at: {$ref: "#/components/schemas/Time"}
    CommentState:
      type: object
      required: [id, state, closed_as, waits, settled, dismissed, last_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/CommentId"}
        state: {type: string, enum: [open, closed]}
        closed_as: {enum: [answered, decided, null]}
        waits: {enum: [user, agent, null]}
        settled: {type: boolean}
        dismissed: {type: boolean}
        last_at: {$ref: "#/components/schemas/Time"}
    ClaimMark:
      description: The claim on an entry, mine when the session that asked holds it
      type: object
      required: [ends_at, mine]
      additionalProperties: false
      properties:
        ends_at: {$ref: "#/components/schemas/Time"}
        mine: {type: boolean}
    CommentEntry:
      description: A comment as a list holds it, with its count of replies and its last reply
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [replies, last_reply, proposals]
          properties:
            replies: {type: integer, minimum: 0, maximum: 200}
            last_reply: {anyOf: [{$ref: "#/components/schemas/Reply"}, {type: "null"}]}
            proposals: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/ProposalId"}}
            claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    Reply:
      type: object
      required: [seq, author, text, settles, made_at]
      additionalProperties: false
      properties:
        seq: {type: integer, minimum: 1, maximum: 200}
        author: {$ref: "#/components/schemas/Author"}
        text: {type: string, maxLength: 4000}
        settles: {type: boolean}
        made_at: {$ref: "#/components/schemas/Time"}
    Decision:
      type: object
      required: [seq, link, text, made_at]
      additionalProperties: false
      properties:
        seq: {type: integer, minimum: 1}
        link: {$ref: "#/components/schemas/Link"}
        text: {type: [string, "null"], maxLength: 4000}
        made_at: {$ref: "#/components/schemas/Time"}
    CommentThread:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [replies, decisions, proposals]
          properties:
            replies: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/Reply"}}
            decisions: {type: array, items: {$ref: "#/components/schemas/Decision"}}
            proposals: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/ProposalEntry"}}
    Proposal:
      type: object
      required: [id, part, stage, commit, items, reason, change, source_text, comment, discrepancy, state, made_at, closed_at, edit]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        reason: {type: string, maxLength: 2000}
        change: {type: string, maxLength: 4000}
        source_text: {type: [string, "null"], maxLength: 20000}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentId"}, {type: "null"}]}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        made_at: {$ref: "#/components/schemas/Time"}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        edit: {anyOf: [{$ref: "#/components/schemas/EditId"}, {type: "null"}]}
    ProposalEntry:
      description: A proposal as a list holds it, with the length of its stage source text in place of the text
      type: object
      required: [id, part, stage, commit, items, reason, change, source_text_chars, comment, discrepancy, state, made_at, closed_at, edit]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/TraceId"}}
        reason: {type: string, maxLength: 2000}
        change: {type: string, maxLength: 4000}
        source_text_chars: {type: integer, minimum: 0, maximum: 20000}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentId"}, {type: "null"}]}
        discrepancy: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        made_at: {$ref: "#/components/schemas/Time"}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        edit: {anyOf: [{$ref: "#/components/schemas/EditId"}, {type: "null"}]}
    Edit:
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/ProposalId"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
    EditEntry:
      description: An edit as a list holds it, with its proposal
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/ProposalEntry"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
        claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    EditWithProposal:
      type: object
      required: [id, part, stage, commit, proposal, state, pull_request, closed_commit, made_at, changed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/EditId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        commit: {$ref: "#/components/schemas/Commit"}
        proposal: {anyOf: [{$ref: "#/components/schemas/Proposal"}, {type: "null"}]}
        state: {type: string, enum: [pending, in-review, needs-user, closed, dismissed]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        closed_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        made_at: {$ref: "#/components/schemas/Time"}
        changed_at: {$ref: "#/components/schemas/Time"}
    Discrepancy:
      type: object
      required: [id, part, compares, term, item, reasons, level, state, waiting, opened_commit, opened_at, resolved_commit, resolved_at, earlier]
      properties:
        id: {$ref: "#/components/schemas/DiscrepancyId"}
        part: {$ref: "#/components/schemas/PartName"}
        compares: {type: string, enum: [aggregate-table, read-model-screen]}
        term: {$ref: "#/components/schemas/ItemRef"}
        item:
          description: The table or screen by its trace ID, or by its name when it has none; empty for a term without one
          type: string
          maxLength: 120
        reasons:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [kind]
            additionalProperties: false
            properties:
              kind: {type: string, enum: [no-term, not-on-board, no-table, no-screen, other-context, removed]}
              contexts:
                description: For other-context, the context of the term's side and of the item's side
                type: array
                minItems: 2
                maxItems: 2
                items: {$ref: "#/components/schemas/ItemRef"}
              side:
                description: For removed, the side marked removed
                type: string
                enum: [term, item]
        level: {type: string, enum: [warn, info]}
        state: {type: string, enum: [open, resolved]}
        waiting: {type: boolean}
        opened_commit: {$ref: "#/components/schemas/Commit"}
        opened_at: {$ref: "#/components/schemas/Time"}
        resolved_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        resolved_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        earlier: {anyOf: [{$ref: "#/components/schemas/DiscrepancyId"}, {type: "null"}]}
        claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    Checkpoint:
      type: object
      required: [id, part, stage, commit, words, state, passed_at, withdrawn_at, pull_request, pr_state, recorded_commit]
      properties:
        id: {$ref: "#/components/schemas/CheckpointId"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        words: {type: [string, "null"], maxLength: 2000}
        state: {type: string, enum: [passed, withdrawn]}
        passed_at: {$ref: "#/components/schemas/Time"}
        withdrawn_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        pull_request: {anyOf: [{$ref: "#/components/schemas/Link"}, {type: "null"}]}
        pr_state: {enum: [open, merged, closed, null]}
        recorded_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
    CheckpointEntry:
      description: A checkpoint as the agent to-do holds it, with why it is listed
      allOf:
        - $ref: "#/components/schemas/Checkpoint"
        - type: object
          required: [why]
          properties:
            why: {type: string, enum: [not-recorded, withdrawn-in-review, withdrawn-recorded]}
            claim: {anyOf: [{$ref: "#/components/schemas/ClaimMark"}, {type: "null"}]}
    Claim:
      type: object
      required: [entry, session, claimed_at, ends_at]
      additionalProperties: false
      properties:
        entry: {$ref: "#/components/schemas/EntryId"}
        session: {$ref: "#/components/schemas/SessionLabel"}
        claimed_at: {$ref: "#/components/schemas/Time"}
        ends_at: {$ref: "#/components/schemas/Time"}
    Released:
      type: object
      required: [entry, released]
      additionalProperties: false
      properties:
        entry: {$ref: "#/components/schemas/EntryId"}
        released: {type: boolean}

    Todo:
      type: object
      required: [project, default_commit, session, comments, discrepancies, reflections, checkpoints, waiting_for_user, taken]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        default_commit: {anyOf: [{$ref: "#/components/schemas/Commit"}, {type: "null"}]}
        session: {anyOf: [{$ref: "#/components/schemas/SessionLabel"}, {type: "null"}]}
        comments:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CommentEntry"}}
        discrepancies:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Discrepancy"}}
        reflections:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/EditEntry"}}
        checkpoints:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CheckpointEntry"}}
        waiting_for_user: {type: integer, minimum: 0}
        taken: {type: integer, minimum: 0}
    PictureData:
      type: object
      required: [project, part, stage, picture, comments, closed_comments, proposals, reflections, discrepancies]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        picture:
          type: object
          required: [commit, committed_at, drawn_at, not_current, source]
          additionalProperties: false
          properties:
            commit: {$ref: "#/components/schemas/Commit"}
            committed_at: {$ref: "#/components/schemas/ZonedTime"}
            drawn_at: {$ref: "#/components/schemas/Time"}
            not_current: {enum: [size, source-gone, other-repository, null]}
            source: {$ref: "#/components/schemas/PictureSource"}
        comments:
          description: The open comments on the picture, up to 500, the most recently active first, with their total
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/CommentEntry"}}
        closed_comments:
          description: The closed comments on the picture, up to 500, the most recently active first, which the view opens with getComment
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries:
              type: array
              maxItems: 500
              items:
                type: object
                required: [id, item, closed_as, last_at]
                additionalProperties: false
                properties:
                  id: {$ref: "#/components/schemas/CommentId"}
                  item: {$ref: "#/components/schemas/ItemRef"}
                  closed_as: {type: string, enum: [answered, decided]}
                  last_at: {$ref: "#/components/schemas/Time"}
        proposals: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/ProposalEntry"}}
        reflections: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/EditEntry"}}
        discrepancies: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/Discrepancy"}}
    Overview:
      type: object
      required: [project, part, stage, record, source_state, read, checks, pictures, discrepancies, comments, reflections, checkpoints, warnings, not_opened]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        record:
          description: The stage's record for the part, from the stored snapshot, and where the records came from
          type: object
          required: [state, checkpoints, next, from]
          properties:
            state: {type: string, enum: [done, in_progress, not_started, skipped, unknown]}
            checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
            next: {type: string}
            updated: {$ref: "#/components/schemas/ZonedTime"}
            from: {type: string, enum: [repository, status-file]}
        source_state: {type: string, enum: [found, missing, none, no-checkout, skipped, invalid]}
        read: {type: boolean}
        checks: {type: array, maxItems: 2000, items: {$ref: "#/components/schemas/Check"}}
        pictures:
          description: The pictures that the stage's discrepancies concern, for a pictured stage
          type: array
          maxItems: 3
          items:
            type: object
            required: [stage, commit, not_current]
            additionalProperties: false
            properties:
              stage: {$ref: "#/components/schemas/PictureStage"}
              commit: {$ref: "#/components/schemas/Commit"}
              not_current: {enum: [size, source-gone, other-repository, null]}
        discrepancies:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Discrepancy"}}
        comments:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/CommentEntry"}}
        reflections:
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/EditEntry"}}
        checkpoints:
          description: The checkpoints passed in NEXUS for the part and stage that no stored record names, and the withdrawn ones that a stored record names
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/Checkpoint"}
        warnings:
          type: array
          maxItems: 50
          items:
            type: object
            required: [rule, checkpoint]
            additionalProperties: false
            properties:
              rule: {const: checkpoint-withdrawn}
              checkpoint: {$ref: "#/components/schemas/CheckpointId"}
        not_opened:
          description: How many discrepancies the part's last cross-check could not open, since the space held 1,000 open ones
          type: integer
          minimum: 0
    HubPageData:
      description: The data in the hub page's script block hub-data
      type: object
      required: [schema, generated_at, lang, origin, projects, spaces, missing]
      properties:
        schema: {const: corthex-hub-page/0.2}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        origin: {type: string, enum: [local, server]}
        projects: {type: array, maxItems: 30, items: {type: object}}
        spaces:
          description: For each project that has a space; empty on a device
          type: object
          additionalProperties: {$ref: "#/components/schemas/SpaceSummary"}
        missing: {type: array, items: {type: object}}
    SpaceSummary:
      type: object
      required: [pictures, open, checkpoints, warnings, not_opened]
      additionalProperties: false
      properties:
        pictures:
          type: array
          maxItems: 150
          items:
            type: object
            required: [part, stage, commit, committed_at, not_current]
            additionalProperties: false
            properties:
              part: {$ref: "#/components/schemas/PartName"}
              stage: {$ref: "#/components/schemas/PictureStage"}
              commit: {$ref: "#/components/schemas/Commit"}
              committed_at: {$ref: "#/components/schemas/ZonedTime"}
              not_current: {enum: [size, source-gone, other-repository, null]}
        open:
          type: object
          required: [comments, proposals, discrepancies]
          additionalProperties: false
          properties:
            comments: {type: integer, minimum: 0}
            proposals: {type: integer, minimum: 0}
            discrepancies: {type: integer, minimum: 0}
        checkpoints:
          description: The checkpoints passed in NEXUS that wait for their records, up to 100 with their total
          type: object
          required: [total, entries]
          properties:
            total: {type: integer, minimum: 0}
            entries:
              type: array
              maxItems: 100
              items:
                type: object
                required: [id, part, stage, passed_at]
                additionalProperties: false
                properties:
                  id: {$ref: "#/components/schemas/CheckpointId"}
                  part: {$ref: "#/components/schemas/PartName"}
                  stage: {$ref: "#/components/schemas/StageKey"}
                  passed_at: {$ref: "#/components/schemas/Time"}
        warnings:
          type: array
          maxItems: 100
          items:
            type: object
            required: [part, stage, rule, checkpoint]
            additionalProperties: false
            properties:
              part: {$ref: "#/components/schemas/PartName"}
              stage: {$ref: "#/components/schemas/StageKey"}
              rule: {const: checkpoint-withdrawn}
              checkpoint: {$ref: "#/components/schemas/CheckpointId"}
        not_opened:
          type: object
          additionalProperties: {type: integer, minimum: 1}
    ViewPageData:
      description: The data in the script block view-data of the picture view and the stage overview
      type: object
      required: [schema, generated_at, lang, view, data, problem]
      additionalProperties: false
      properties:
        schema: {const: corthex-view-page/0.2}
        generated_at: {$ref: "#/components/schemas/Time"}
        lang: {type: string, enum: [en, ko]}
        view: {type: string, enum: [picture, overview]}
        data:
          anyOf:
            - $ref: "#/components/schemas/PictureData"
            - $ref: "#/components/schemas/Overview"
            - type: "null"
        problem: {anyOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]}

    NewComment:
      type: object
      required: [part, stage, item, text]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        item: {$ref: "#/components/schemas/ItemRef"}
        quote: {type: string, minLength: 1, maxLength: 300}
        discrepancy: {$ref: "#/components/schemas/DiscrepancyId"}
        commit: {$ref: "#/components/schemas/Commit"}
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    NewReply:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        settles: {type: boolean, default: false}
    ReplyAnswer:
      type: object
      required: [comment, reply]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        reply: {$ref: "#/components/schemas/Reply"}
    AnsweredAnswer:
      type: object
      required: [comment, changed]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        changed: {type: boolean}
    NewDecision:
      type: object
      required: [link]
      additionalProperties: false
      properties:
        link: {$ref: "#/components/schemas/Link"}
        text: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
    DecisionAnswer:
      type: object
      required: [comment, decision]
      additionalProperties: false
      properties:
        comment: {$ref: "#/components/schemas/CommentState"}
        decision: {$ref: "#/components/schemas/Decision"}
    NewProposal:
      type: object
      required: [part, stage, items, reason, change]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/PictureStage"}
        items: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {$ref: "#/components/schemas/TraceId"}}
        adds:
          description: The items of items that the change adds, which the picture need not hold
          type: array
          maxItems: 50
          uniqueItems: true
          items: {$ref: "#/components/schemas/TraceId"}
        reason: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
        change: {type: string, minLength: 1, maxLength: 4000, pattern: '\S'}
        source_text: {type: string, minLength: 1, maxLength: 20000}
        comment: {$ref: "#/components/schemas/CommentId"}
        discrepancy: {$ref: "#/components/schemas/DiscrepancyId"}
        commit: {$ref: "#/components/schemas/Commit"}
    ProposalStateAnswer:
      type: object
      required: [proposal, changed]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        changed: {type: boolean}
    ProposalState:
      type: object
      required: [id, state, closed_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/ProposalId"}
        state: {type: string, enum: [open, accepted, dismissed, withdrawn]}
        closed_at: {anyOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
    AcceptAnswer:
      type: object
      required: [proposal, edit]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        edit: {$ref: "#/components/schemas/Edit"}
    DismissAnswer:
      type: object
      required: [proposal, comment]
      additionalProperties: false
      properties:
        proposal: {$ref: "#/components/schemas/ProposalState"}
        comment: {anyOf: [{$ref: "#/components/schemas/CommentState"}, {type: "null"}]}
    EditReport:
      description: What became of a reflection (Reports in nexus.md); pull_request goes with opened, merged and closed, and commit with reflected
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event: {type: string, enum: [opened, merged, closed, reflected, needs-user]}
        pull_request: {$ref: "#/components/schemas/Link"}
        commit: {$ref: "#/components/schemas/Commit"}
    EditAnswer:
      type: object
      required: [edit, changed]
      additionalProperties: false
      properties:
        edit: {$ref: "#/components/schemas/Edit"}
        changed: {type: boolean}
    NewCheckpoint:
      type: object
      required: [part, stage]
      additionalProperties: false
      properties:
        part: {$ref: "#/components/schemas/PartName"}
        stage: {$ref: "#/components/schemas/StageKey"}
        words: {type: string, minLength: 1, maxLength: 2000, pattern: '\S'}
    CheckpointReport:
      type: object
      required: [event, pull_request]
      additionalProperties: false
      properties:
        event: {type: string, enum: [opened, merged, closed]}
        pull_request: {$ref: "#/components/schemas/Link"}
    CheckpointAnswer:
      type: object
      required: [checkpoint, changed]
      additionalProperties: false
      properties:
        checkpoint: {$ref: "#/components/schemas/Checkpoint"}
        changed: {type: boolean}

    StageRecords:
      description: >-
        The stage records file of TBL-115, .corthex/stages/<part>.json or .corthex/stages.json,
        which the agent writes in a pull request and the hub reads from the default branch's
        commit. Not a request: it is here so that one schema checks it.
      type: object
      required: [format, project, stages]
      additionalProperties: false
      properties:
        format: {const: 1}
        project: {$ref: "#/components/schemas/ProjectName"}
        part: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100}
        stages:
          type: object
          propertyNames: {$ref: "#/components/schemas/StageKey"}
          additionalProperties:
            type: object
            required: [state, checkpoints, next, updated]
            additionalProperties: false
            properties:
              state: {type: string, enum: [done, in_progress, not_started, skipped]}
              checkpoints: {type: array, items: {$ref: "#/components/schemas/RecordCheckpoint"}}
              next: {type: string, maxLength: 300}
              checks:
                type: array
                items:
                  type: object
                  required: [level, message, at]
                  additionalProperties: false
                  properties:
                    level: {type: string, enum: [error, warn, info]}
                    message: {type: string, minLength: 1, maxLength: 300}
                    refs: {type: array, items: {$ref: "#/components/schemas/TraceId"}}
                    at: {$ref: "#/components/schemas/Date"}
              updated: {$ref: "#/components/schemas/ZonedTime"}
    OutboxFile:
      description: >-
        One write in the hub's outbox (TBL-117), outbox/<project>/<time>.<write>.json on a device.
        Not a request: it is here so that one schema checks it.
      type: object
      required: [format, write, project, request, path, session, made, body, tries]
      additionalProperties: false
      properties:
        format: {const: 1}
        write: {$ref: "#/components/schemas/WriteId"}
        project: {$ref: "#/components/schemas/ProjectName"}
        request: {type: string, enum: [comment, reply, answered, decision, proposal, withdraw-proposal, report-edit, report-checkpoint]}
        path:
          description: The request's path under the server's address
          type: string
          pattern: '^/api/spaces/[a-z0-9-]+/'
          maxLength: 300
        session: {$ref: "#/components/schemas/SessionLabel"}
        made: {$ref: "#/components/schemas/Time"}
        body: {type: object}
        tries: {type: integer, minimum: 0}
        failure: {type: string, maxLength: 120}

  x-corthex:
    errors:
      invalid_request: {status: 400, meaning: "a field, a header or the body is not in its form; field names it", message: "This is not valid: check the marked field", client: "the view shows the message by the field; the hub reports the field and drops the write from its outbox"}
      invalid_snapshot: {status: 400, meaning: "the snapshot is not in the format corthex-hub/0.1 or 0.2; field names the first bad field", message: "The snapshot is not valid", client: "the hub reports the field and keeps nothing to send again"}
      clock_ahead: {status: 400, meaning: "the snapshot is dated more than 10 minutes ahead of the server's clock", message: "The snapshot is dated in the future. Check the device's clock", client: "the hub reports it"}
      unknown_item: {status: 400, meaning: "a proposal names items that its picture does not hold and that adds does not name; items names them", message: "The proposal names items that are not in the picture", client: "the hub reports the items, and the agent checks the stage source"}
      access_missing: {status: 403, meaning: "Cloudflare Access did not check the request", message: "Cloudflare Access did not check this request. Protect the server with Access first", client: "the hub reports a refused token; the view says that the sign-in is missing and offers to load again"}
      access_other_app: {status: 403, meaning: "another Access application than ACCESS_AUD names checked the request", message: "This request was checked for another Access application", client: "as for access_missing"}
      cross_site: {status: 403, meaning: "a browser sent a change from another site", message: "A change from another site is refused", client: "the view offers to open the page at the server's own address"}
      user_only: {status: 403, meaning: "the request needs a person's own sign-in; needs is user", message: "Only you can do this, signed in yourself", client: "the hub reports that the user does this in the view"}
      agent_only: {status: 403, meaning: "the request needs the service token; needs is agent", message: "Only the agent does this, through the hub", client: "the view never sends it; the hub reports a missing or refused service token"}
      no_kind: {status: 403, meaning: "Access let the request in, but its identity is neither a person's sign-in nor the service token", message: "This sign-in cannot write here", client: "the view and the hub report it, and the user checks the Access policy"}
      not_found: {status: 404, meaning: "no such path, or no such file of the view's code", message: "Not found", client: "the view links to the hub page"}
      project_not_found: {status: 404, meaning: "the server holds no snapshot of the project", message: "This project is not on the server", client: "the hub reports nothing to remove or read; a push stores the project as a new one"}
      space_not_found: {status: 404, meaning: "the project has no space, since only hubs of 0.1 pushed it", message: "This project has no pictures on the server yet. Push it with corthex-nexus 0.2", client: "the hub says so and sends nothing"}
      part_not_found: {status: 404, meaning: "the stored snapshot does not hold the part", message: "This part is not in the project's snapshot", client: "the view links to the hub page"}
      picture_not_found: {status: 404, meaning: "the space holds no picture of the part and stage; why says whether none was drawn yet, the snapshot left it out for its size or its source is in another repository", message: "No picture is drawn yet for this stage and part", client: "the view shows the empty state with why"}
      comment_not_found: {status: 404, meaning: "the space holds no such comment", message: "This comment is not on the server", client: "the view loads the picture again; the hub reports it and drops the write"}
      discrepancy_not_found: {status: 404, meaning: "the part holds no such discrepancy", message: "This discrepancy is not on the server", client: "as for comment_not_found"}
      proposal_not_found: {status: 404, meaning: "the space holds no such proposal", message: "This proposal is not on the server", client: "as for comment_not_found"}
      edit_not_found: {status: 404, meaning: "the space holds no such edit", message: "This reflection is not on the server", client: "as for comment_not_found"}
      checkpoint_not_found: {status: 404, meaning: "the space holds no such checkpoint", message: "This checkpoint is not on the server", client: "the overview loads again; the hub reports it, and the agent writes no record of it"}
      entry_not_found: {status: 404, meaning: "the space holds no comment, discrepancy, edit or checkpoint with that ID", message: "This entry is not on the server", client: "the hub reports it and leaves the entry"}
      method_not_allowed: {status: 405, meaning: "the path does not take the method; Allow names those that it takes", message: "This request is not allowed here", client: "the hub reports it as a fault of its own"}
      older_snapshot: {status: 409, meaning: "a snapshot of the held commit, or of a project that holds none, made earlier than the stored one; stored_at says when that was made", message: "The server holds a newer snapshot", client: "the hub takes a fresh snapshot and pushes again"}
      commit_not_replaced: {status: 409, meaning: "a snapshot of another commit than the held one that does not name the held one as the one it replaces, one without a commit where the stored snapshot has one, or a push that another push overtook; held_commit names the held commit", message: "The server holds another commit. Fetch the default branch and push again", client: "the agent fetches and pushes again, once"}
      too_many_projects: {status: 409, meaning: "the server holds 30 projects, and the snapshot is of a new one", message: "The server holds 30 projects. Remove one first", client: "the hub reports it"}
      repository_mismatch: {status: 409, meaning: "the snapshot's repository address is not the one that the space is bound to; bound names it", message: "This project's space is bound to another repository", client: "the hub names both addresses and says that a removal unbinds the space"}
      comment_limit: {status: 409, meaning: "the space holds 2,000 comments", message: "This project holds as many comments as it may", client: "the view keeps the text and says so"}
      reply_limit: {status: 409, meaning: "the comment holds 200 replies", message: "This comment holds as many replies as it may. Leave a new comment", client: "the view keeps the text and offers a new comment"}
      proposal_limit: {status: 409, meaning: "the space holds 500 open proposals", message: "This project holds as many open proposals as it may", client: "the hub reports it, and the agent withdraws proposals that the stage sources passed"}
      reflection_limit: {status: 409, meaning: "the space holds 500 pending reflections", message: "This project holds as many pending reflections as it may", client: "the view says so, and the proposal stays open"}
      space_full: {status: 409, meaning: "the write would take the text of the space past 8 MiB", message: "This project's space is full", client: "the view keeps the text; the hub reports it"}
      comment_closed: {status: 409, meaning: "the agent wrote on a closed comment, which only the user's reply opens again", message: "This comment is closed", client: "the hub reports it, and the agent leaves the comment"}
      proposal_not_open: {status: 409, meaning: "the proposal is accepted, dismissed or withdrawn already; state says which", message: "This proposal is no longer open", client: "the view shows its state"}
      edit_state: {status: 409, meaning: "the report or the dismissal does not fit the edit's state; state says which it is", message: "This reflection is in another state", client: "the view loads it again; the hub reports the state"}
      pull_request_reported: {status: 409, meaning: "another reported pull request still holds the reflection or the checkpoint; pull_request names it", message: "A pull request holds this already", client: "the hub reports the pull request, and the agent leaves the entry"}
      pull_request_mismatch: {status: 409, meaning: "the report names another pull request than the one reported for the entry; pull_request names that one", message: "This is not the reported pull request", client: "the hub reports both pull requests"}
      claimed: {status: 409, meaning: "another agent session claims the entry; ends_at says until when", message: "Another session holds this", client: "the hub skips the entry until the claim ends"}
      entry_closed: {status: 409, meaning: "a claim on a closed entry", message: "This entry is closed", client: "the hub skips it"}
      checkpoint_recorded: {status: 409, meaning: "a stored stage record names the checkpoint, so withdrawing it would change a recorded decision", message: "This checkpoint is recorded. Changing it is a new decision", client: "the overview shows the record"}
      checkpoint_withdrawn: {status: 409, meaning: "the checkpoint was withdrawn, so no new record pull request may write it", message: "This checkpoint was withdrawn", client: "the hub reports it, and the agent writes no record"}
      checkpoint_state: {status: 409, meaning: "the checkpoint has no reported open record pull request for merged or closed, or is already recorded for opened", message: "Read the checkpoint's current record state before reporting", client: "the hub reports it, and the agent reads the checkpoint again"}
      write_id_reused: {status: 409, meaning: "the write ID was taken by another request", message: "This write could not be sent. Try again", client: "the view makes a new ID; the hub reports it as a fault of its own"}
      snapshot_too_large: {status: 413, meaning: "the snapshot is larger than 1 MiB", message: "The snapshot is larger than the server takes", client: "the hub reports it; its own limits keep snapshots smaller"}
      body_too_large: {status: 413, meaning: "a write's body is larger than 256 KiB", message: "This is larger than the server takes", client: "the view and the hub report it"}
      text_too_long: {status: 413, meaning: "a text is longer than its limit; field and limit name them", message: "This text is too long", client: "the view counts down by the field; the hub reports the field"}
      json_required: {status: 415, meaning: "a body that is not sent as application/json", message: "This could not be sent", client: "the hub reports it as a fault of its own"}
      internal: {status: 500, meaning: "an error inside the server; its log holds only the kind of error and the trace ID", message: "Something went wrong. Try again", client: "the view keeps what it holds and offers to send again; the hub keeps the write in its outbox"}
