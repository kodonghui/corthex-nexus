          of a checkpoint request (SPEC-197, SPEC-198). The agent's comment whose asks is
          checkpoint is the checkpoint request of its part's stage, and the server takes it only
          in form: on the stage as a whole, with an empty item; a text of at most 1,200
          characters and 10 lines, so at most 9 line feeds; and look_first, a trace ID that a
          stage of the stored snapshot holds or an https address. Anything else is 400 by the
          field: item, text or look_first. A comment that asks for no checkpoint sends no
          look_first, and one that does is 400 by look_first. A part's stage has one open request
          at a time: while one is open, another is 409 checkpoint_requested, which names the open
          request in comment, and the hub then sends the request as a reply on it
          (replyToComment). The answer holds look_first, null for any other comment. In phase ②,
          a workshop's request is the one request that is on an item, its frame.
