components:
  securitySchemes:
    accessUser:
      type: apiKey
      in: cookie
      name: CF_Authorization
      description: >-
        A person's own Cloudflare Access sign-in, which the browser holds after Access's login
        page. The development Access trial on 2026-11-03 selected the verified header JWT:
        the origin verifies the RS256 signature; the Worker additionally requires ctx.access and its own audience. It verifies
        with the configured team's keys, issuer, audience and expiry, then reads a non-empty
        sub as the user. The standalone loopback origin behind Tunnel needs no ctx.access; it checks the same signed assertion. getIdentity() did not give both kinds (Sign-in in nexus.md).
    accessClientId:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: >-
        The service token's client ID, which the hub reads from CORTHEX_NEXUS_CLIENT_ID. With the
        secret, Access authenticates the agent. The development Access trial on 2026-11-03
        confirmed common_name with an empty sub in Cf-Access-Jwt-Assertion; the Worker reads it
        only after verifying RS256, the configured team's issuer and keys, audience and expiry.
        Neither the client ID nor other identity fields are kept or logged (Sign-in in nexus.md).
    accessClientSecret:
      type: apiKey
      in: header
      name: CF-Access-Client-Secret
      description: The service token's secret, which the hub reads from CORTHEX_NEXUS_CLIENT_SECRET and never writes to a file, a log or a message.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: The project's registered name. A name in another form gets 404, as one that the server does not hold.
      schema: {$ref: "#/components/schemas/ProjectName"}
      example: corthex
    Part:
      name: part
      in: path
      required: true
      description: A part's name, or _ for the project as a whole, which a JSON body names as "". A name in another form gets 404 part_not_found, as one that the snapshot does not hold.
      schema: {type: string, pattern: '^(?:_|[a-z0-9]+(?:-[a-z0-9]+)*)$', maxLength: 100}
      example: nexus
    PictureStage:
      name: stage
      in: path
      required: true
      description: A pictured stage. Any other stage gets 404 not_found, since no path takes it.
      schema: {$ref: "#/components/schemas/PictureStage"}
      example: 05-erd
    Stage:
      name: stage
      in: path
      required: true
      description: One of the 13 stages. Any other value gets 404 not_found.
      schema: {$ref: "#/components/schemas/StageKey"}
      example: 05-erd
    Comment:
      name: comment
      in: path
      required: true
      description: An ID in another form gets 404 comment_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/CommentId"}
      example: nc_3a6d9g2j5m8r
    Proposal:
      name: proposal
      in: path
      required: true
      description: An ID in another form gets 404 proposal_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/ProposalId"}
      example: np_2b5e8g1j4m7p
    Edit:
      name: edit
      in: path
      required: true
      description: An ID in another form gets 404 edit_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/EditId"}
      example: ne_9c3f6h2k5n8q
    Checkpoint:
      name: checkpoint
      in: path
      required: true
      description: An ID in another form gets 404 checkpoint_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/CheckpointId"}
      example: nk_7f3k2m9q4x1v
    Entry:
      name: entry
      in: path
      required: true
      description: A comment, a discrepancy, an edit or a checkpoint, by its ID. An ID in another form, or of another kind, gets 404 entry_not_found.
      schema: {$ref: "#/components/schemas/EntryId"}
      example: nc_3a6d9g2j5m8r
    File:
      name: file
      in: path
      required: true
      description: A name in another form gets 404 not_found.
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}\.[0-9a-f]{8}\.(?:js|css|woff2)$'}
      example: view.3f9a1c2b.js
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        The write's ID, which the page or the hub makes for one write and sends with each try of
        it, as a string in double quotes, the form of the Idempotency-Key draft (Writes in
        nexus.md). The server answers a write whose ID it holds with the first answer and changes
        nothing; the same ID with another request is refused.
      schema: {type: string, pattern: '^"nw_[0-9a-hjkmnp-tv-z]{12}"$'}
      example: '"nw_6t9w2z5c8f1j"'
    SessionRequired:
      name: Nexus-Session
      in: header
      required: true
      description: The agent session's label, which the agent keeps for the session and which holds nothing personal
      schema: {$ref: "#/components/schemas/SessionLabel"}
      example: claude-code-4f2a91
    SessionOptional:
      name: Nexus-Session
      in: header
      required: false
      description: >-
        The agent session's label. The agent sends it with every write and every read of its
        to-do; a write of the agent's without it is refused with 400. The user's writes need
        none, since claims never hold them back.
      schema: {$ref: "#/components/schemas/SessionLabel"}
      example: claude-code-4f2a91
    ItemId:
      name: id
      in: path
      required: true
      description: An item's trace ID. An ID in another form gets 404 item_not_found, as one that no stage of the project holds.
      schema: {$ref: "#/components/schemas/TraceId"}
      example: TBL-111
    ItemPart:
      name: part
      in: query
      required: false
      description: >-
        The part whose talk the answer holds, as the workspace's address names it, or _ for the
        project as a whole; the project's first part when it is left out. A part that the stored
        snapshot does not hold gets 404 part_not_found, and a value in another form 400
        invalid_request by the field part.
      schema: {type: string, pattern: '^(?:_|[a-z0-9]+(?:-[a-z0-9]+)*)$', maxLength: 100}
      example: nexus
    TalkItem:
      name: item
      in: query
      required: false
      description: Narrows every list of the talk to the entries on this item (REQ-230). A value in another form gets 400 invalid_request by the field item.
      schema: {$ref: "#/components/schemas/TraceId"}
      example: TBL-111
    Closed:
      name: closed
      in: query
      required: false
      description: 1 adds the closed comments and the proposals no longer open, newest first, 50 at a time after after; 0 gives only their total. A value in another form gets 400 invalid_request by the field closed.
      schema: {type: integer, enum: [0, 1], default: 0}
      example: 1
    After:
      name: after
      in: query
      required: false
      description: How many entries of this order the view holds already, so that the answer starts after them. A value in another form gets 400 invalid_request by the field after.
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      example: 0
    StageFilter:
      name: filter
      in: query
      required: false
      description: >-
        Which of the stage's items (REQ-227): all; talk, those that the part's comments name;
        mine, those that an entry in my turn names; left, those with an open discrepancy, open
        comment or pending reflection of the part, what the 0.2 stage overview left (REQ-176). A
        value in another form gets 400 invalid_request by the field filter.
      schema: {type: string, enum: [all, talk, mine, left], default: all}
      example: talk
    StageWords:
      name: q
      in: query
      required: false
      description: >-
        Narrows the items to those whose ID or title holds every word, case-insensitive, as the
        hub page's search matches (REQ-094). Words longer than 200 characters get 400
        invalid_request by the field q.
      schema: {type: string, maxLength: 200}
      example: push
    Group:
      name: group
      in: query
      required: false
      description: >-
        context groups the items by their contexts, the items without one last; source keeps the
        source's order (REQ-227). A value in another form gets 400 invalid_request by the field
        group.
      schema: {type: string, enum: [context, source], default: context}
      example: context
    SearchWords:
      name: q
      in: query
      required: true
      description: >-
        An ID or words, from 2 characters to 200, counted after leading and trailing spaces are
        cut. Fewer or more, or none, get 400 invalid_request by the field q.
      schema: {type: string, minLength: 2, maxLength: 200}
      example: REQ-107

