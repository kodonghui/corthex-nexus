  /api/spaces/{project}/claims/{entry}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Entry"
      - $ref: "#/components/parameters/SessionRequired"
    post:
      operationId: claimEntry
      tags: [Stage progress]
      summary: Claim an entry of the agent to-do
      description: >-
        Holds a comment, a discrepancy, an edit or a checkpoint for the session that Nexus-Session
        names, for 60 minutes after the session's last write on it. Claiming again moves the end
        on. It takes no body and no write ID, since claiming twice leaves one claim, and a claim
        never waits in the outbox.
      security:
        - accessClientId: []
          accessClientSecret: []
      x-corthex:
        id: API-131
        spec: [SPEC-113, SPEC-116, SPEC-136]
        status: active
        omit:
          "401": answered by Cloudflare Access before the Worker sees the request (Sign-in in nexus.md)
      responses:
        "200":
          description: Claimed for the session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Claim"}
              examples:
                claimed:
                  value: {entry: nc_3a6d9g2j5m8r, session: claude-code-4f2a91, claimed_at: "2026-11-03T01:05:00.000Z", ends_at: "2026-11-03T02:05:00.000Z"}
        "400":
          description: No session label, or one in another form
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                no-session: {$ref: "#/components/examples/missing_session"}
        "403": {$ref: "#/components/responses/AgentWriteRefused"}
        "404": {$ref: "#/components/responses/EntryNotFound"}
        "409":
          description: Claimed by another session, closed, or held by a pull request
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                claimed: {$ref: "#/components/examples/claimed"}
                entry-closed: {$ref: "#/components/examples/entry_closed"}
                pull-request-reported: {$ref: "#/components/examples/pull_request_reported"}
        default: {$ref: "#/components/responses/Unexpected"}
    delete:
      operationId: releaseEntry
      tags: [Stage progress]
      summary: Release the session's claim
      description: >-
        Ends the claim of the session that Nexus-Session names. released is false when no claim of
        the session held the entry, as after the claim ended.
      security:
        - accessClientId: []
          accessClientSecret: []
      x-corthex:
        id: API-132
        spec: [SPEC-113, SPEC-116, SPEC-136]
        status: active
        omit:
          "401": answered by Cloudflare Access before the Worker sees the request (Sign-in in nexus.md)
      responses:
        "200":
          description: Released, or nothing to release
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Released"}
              examples:
                released: {value: {entry: nc_3a6d9g2j5m8r, released: true}}
                nothing: {value: {entry: nc_3a6d9g2j5m8r, released: false}}
        "400":
          description: No session label, or one in another form
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                no-session: {$ref: "#/components/examples/missing_session"}
        "403": {$ref: "#/components/responses/AgentWriteRefused"}
        "404": {$ref: "#/components/responses/EntryNotFound"}
        "409":
          description: Another session holds the claim
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
              examples:
                claimed: {$ref: "#/components/examples/claimed"}
        default: {$ref: "#/components/responses/Unexpected"}

components:
  securitySchemes:
    accessUser:
      type: apiKey
      in: cookie
      name: CF_Authorization
      description: >-
        A person's own Cloudflare Access sign-in, which the browser holds after Access's login
        page. The development Access trial on 2026-11-03 selected the verified header JWT:
        after requiring ctx.access and its own audience, the Worker verifies the RS256 signature
        with the configured team's keys, issuer, audience and expiry, then reads a non-empty
        sub as the user. getIdentity() did not give the fields for both kinds (Sign-in in nexus.md).
    accessClientId:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: >-
        The service token's client ID, which the hub reads from CORTHEX_NEXUS_CLIENT_ID. With the
        secret, Access authenticates the agent. The development Access trial on 2026-11-03
        confirmed common_name with an empty sub in Cf-Access-Jwt-Assertion; the Worker reads it
        only after verifying RS256, the configured team's issuer and keys, audience and expiry.
        Neither the client ID nor other identity fields are kept or logged (Sign-in in nexus.md).
    accessClientSecret:
      type: apiKey
      in: header
      name: CF-Access-Client-Secret
      description: The service token's secret, which the hub reads from CORTHEX_NEXUS_CLIENT_SECRET and never writes to a file, a log or a message.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: The project's registered name. A name in another form gets 404, as one that the server does not hold.
      schema: {$ref: "#/components/schemas/ProjectName"}
      example: corthex
    Part:
      name: part
      in: path
      required: true
      description: A part's name, or _ for the project as a whole, which a JSON body names as "". A name in another form gets 404 part_not_found, as one that the snapshot does not hold.
      schema: {type: string, pattern: '^(?:_|[a-z0-9]+(?:-[a-z0-9]+)*)$', maxLength: 100}
      example: nexus
    PictureStage:
      name: stage
      in: path
      required: true
      description: A pictured stage. Any other stage gets 404 not_found, since no path takes it.
      schema: {$ref: "#/components/schemas/PictureStage"}
      example: 05-erd
    Stage:
      name: stage
      in: path
      required: true
      description: One of the 13 stages. Any other value gets 404 not_found.
      schema: {$ref: "#/components/schemas/StageKey"}
      example: 05-erd
    Comment:
      name: comment
      in: path
      required: true
      description: An ID in another form gets 404 comment_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/CommentId"}
      example: nc_3a6d9g2j5m8r
    Proposal:
      name: proposal
      in: path
      required: true
      description: An ID in another form gets 404 proposal_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/ProposalId"}
      example: np_2b5e8g1j4m7p
    Edit:
      name: edit
      in: path
      required: true
      description: An ID in another form gets 404 edit_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/EditId"}
      example: ne_9c3f6h2k5n8q
    Checkpoint:
      name: checkpoint
      in: path
      required: true
      description: An ID in another form gets 404 checkpoint_not_found, as one that the space does not hold.
      schema: {$ref: "#/components/schemas/CheckpointId"}
      example: nk_7f3k2m9q4x1v
    Entry:
      name: entry
      in: path
      required: true
      description: A comment, a discrepancy, an edit or a checkpoint, by its ID. An ID in another form, or of another kind, gets 404 entry_not_found.
      schema: {$ref: "#/components/schemas/EntryId"}
      example: nc_3a6d9g2j5m8r
    File:
      name: file
      in: path
      required: true
      description: A name in another form gets 404 not_found.
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}\.[0-9a-f]{8}\.(?:js|css|woff2)$'}
      example: view.3f9a1c2b.js
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        The write's ID, which the page or the hub makes for one write and sends with each try of
        it, as a string in double quotes, the form of the Idempotency-Key draft (Writes in
        nexus.md). The server answers a write whose ID it holds with the first answer and changes
        nothing; the same ID with another request is refused.
      schema: {type: string, pattern: '^"nw_[0-9a-hjkmnp-tv-z]{12}"$'}
      example: '"nw_6t9w2z5c8f1j"'
    SessionRequired:
      name: Nexus-Session
      in: header
      required: true
      description: The agent session's label, which the agent keeps for the session and which holds nothing personal
      schema: {$ref: "#/components/schemas/SessionLabel"}
      example: claude-code-4f2a91
    SessionOptional:
      name: Nexus-Session
      in: header
      required: false
      description: >-
        The agent session's label. The agent sends it with every write and every read of its
        to-do; a write of the agent's without it is refused with 400. The user's writes need
        none, since claims never hold them back.
      schema: {$ref: "#/components/schemas/SessionLabel"}
      example: claude-code-4f2a91

  responses:
    ReadRefused:
      description: Refused by the access checks
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            access-missing: {$ref: "#/components/examples/access_missing"}
            access-other-app: {$ref: "#/components/examples/access_other_app"}
    WriteRefused:
      description: Refused by the access checks
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            access-missing: {$ref: "#/components/examples/access_missing"}
            access-other-app: {$ref: "#/components/examples/access_other_app"}
            cross-site: {$ref: "#/components/examples/cross_site"}
    EitherWriteRefused:
      description: Refused by the access checks, or an identity of neither kind
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            access-missing: {$ref: "#/components/examples/access_missing"}
            access-other-app: {$ref: "#/components/examples/access_other_app"}
            cross-site: {$ref: "#/components/examples/cross_site"}
            no-kind: {$ref: "#/components/examples/no_kind"}
    UserWriteRefused:
      description: Refused by the access checks, or not a person's own sign-in
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            user-only: {$ref: "#/components/examples/user_only"}
            access-missing: {$ref: "#/components/examples/access_missing"}
            access-other-app: {$ref: "#/components/examples/access_other_app"}
            cross-site: {$ref: "#/components/examples/cross_site"}
    AgentWriteRefused:
      description: Refused by the access checks, or not the service token
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            agent-only: {$ref: "#/components/examples/agent_only"}
            access-missing: {$ref: "#/components/examples/access_missing"}
            access-other-app: {$ref: "#/components/examples/access_other_app"}
            cross-site: {$ref: "#/components/examples/cross_site"}
    InvalidWrite:
      description: A field, a header or the body is not in its form
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            invalid-field: {$ref: "#/components/examples/invalid_request"}
            missing-write-id: {$ref: "#/components/examples/missing_write_id"}
            missing-session: {$ref: "#/components/examples/missing_session"}
    TooLarge:
