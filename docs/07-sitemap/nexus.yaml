# The sitemap of NEXUS, stage 07 of CORTHEX's own project: the screens of the NEXUS server
# and of the hub page, in the form of the stage 07 template, with the terms that NEXUS's
# cross-check reads and a status for each. nexus.md explains them and draws the board, the
# list and the table of flows from this file. Paths are written as the contract
# ../06-api/nexus.openapi.yaml writes them, and the part after "#" is the page's own address
# of a view or a panel.
# One tree, from SCR-110, since the design revision of 2026-11-11. The redesign of
# 2026-11-06 made SCR-110 to SCR-117: SCR-117 is active since TASK-271, when the hub page
# moved to /hub, SCR-110 since TASK-273, which built the first page, and SCR-111 and SCR-113
# since TASK-274, which built the workspace and the document stage; a screen that is
# approved and not built is `planned`. SCR-117 stands for the hub page on the server and on
# a device, with its three views, SCR-102 to SCR-104. SCR-105 to SCR-109 are NEXUS 0.2's two
# pages and their panels, served until TASK-278 answers their paths with redirects and turns
# them `removed`. A removed screen keeps its ID and the flows that last named it, says
# `terms: none` and stands after the tree: it is no route, and no flow's step names it.
- id: SCR-110
  name: Home
  path: /
  access: anyone Cloudflare Access lets in, on the server
  flows: [FL-114, FL-117, FL-118]
  terms: [CTX-014, TERM-121]
  status: active
  children:
    - id: SCR-116
      name: Search
      path: "{any page}#q={words}"
      access: anyone Cloudflare Access lets in, on the server
      flows: [FL-118]
      terms: none
      status: active
    - id: SCR-117
      name: Full checks
      path: /hub
      access: anyone Cloudflare Access lets in, or the device's user
      flows: [FL-105, FL-113, FL-118]
      terms: none
      status: active
      children:
        - id: SCR-102
          name: Search results
          path: "/hub#q={words}"
          access: anyone Cloudflare Access lets in, or the device's user
          flows: [FL-105]
          terms: none
          status: built
        - id: SCR-103
          name: Trace view
          path: "/hub#p={project}&id={id}"
          access: anyone Cloudflare Access lets in, or the device's user
          flows: [FL-105]
          terms: none
          status: built
        - id: SCR-104
          name: Stage detail
          path: "/hub#p={project}&s={stage}"
          access: anyone Cloudflare Access lets in, or the device's user
          flows: [FL-105, FL-113]
          terms: none
          status: active
          children:
            - id: SCR-105
              name: Picture view
              path: "/pictures/{project}/{part}/{stage}"
              access: anyone Cloudflare Access lets in, on the server
              flows: [FL-106, FL-110]
              terms: [CTX-014, TERM-111]
              status: active
              children:
                - id: SCR-106
                  name: Item
                  path: "/pictures/{project}/{part}/{stage}#item={id}"
                  access: anyone Cloudflare Access lets in, on the server
                  flows: [FL-106, FL-107]
                  terms: [CTX-014, TERM-111]
                  status: active
                - id: SCR-107
                  name: Comment
                  path: "/pictures/{project}/{part}/{stage}#comment={comment}"
                  access: anyone Cloudflare Access lets in, on the server
                  flows: [FL-107, FL-109]
                  terms: [CTX-014, TERM-111]
                  status: active
                - id: SCR-108
                  name: Proposal
                  path: "/pictures/{project}/{part}/{stage}#proposal={proposal}"
                  access: anyone Cloudflare Access lets in, on the server
                  flows: [FL-110]
                  terms: [CTX-014, TERM-111]
                  status: active
            - id: SCR-109
              name: Stage overview
              path: "/overview/{project}/{part}/{stage}"
              access: anyone Cloudflare Access lets in, on the server
              flows: [FL-113]
              terms: [CTX-007, TERM-120]
              status: active
    - id: SCR-111
      name: Project workspace
      path: "/p/{project}"
      access: anyone Cloudflare Access lets in, on the server
      flows: [FL-117, FL-118]
      terms: none
      status: active
      children:
        - id: SCR-112
          name: Picture stage
          path: "/p/{project}/{part}/{picture stage}"
          access: anyone Cloudflare Access lets in, on the server
          flows: [FL-113, FL-115, FL-116, FL-118, FL-119, FL-125]
          terms: [CTX-014, TERM-111]
          status: active
        - id: SCR-113
          name: Document stage
          path: "/p/{project}/{part}/{document stage}"
          access: anyone Cloudflare Access lets in, on the server
          flows: [FL-113, FL-118, FL-119]
          terms: [CTX-007, TERM-120]
          status: active
        - id: SCR-114
          name: Talk
          path: "/p/{project}/{part}/{stage}#talk={comment}"
          access: anyone Cloudflare Access lets in, on the server
          flows: [FL-117, FL-119]
          terms: [CTX-014, TERM-111]
          status: active
        - id: SCR-115
          name: Item
          path: "/p/{project}/{part}/{stage}#item={id}"
          access: anyone Cloudflare Access lets in, on the server
          flows: [FL-118, FL-119]
          terms: [CTX-014, TERM-111]
          status: active
        - id: SCR-130
          name: Project data
          path: "/p/{project}#data"
          access: anyone Cloudflare Access lets in, on the server
          flows: [FL-114, FL-118, FL-127]
          terms: none
          status: planned
- id: SCR-101
  name: Hub page
  path: /
  access: anyone Cloudflare Access lets in, or the device's user
  flows: [FL-105, FL-113]
  terms: none
  status: removed
# without a screen: TERM-148, TERM-149
