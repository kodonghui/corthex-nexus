name: check

on:
  push:
    branches: [main, codex/nexus-0.2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix nexus
      - run: node --test nexus/test/*.test.js

  nexus-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/nexus-worker"

  hub-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORTHEX_HUB_CHECKOUT: ${{ github.workspace }}/../corthex-hub-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python tools/fetch_hub_ref.py --destination "$CORTHEX_HUB_CHECKOUT"
      - run: python -m unittest discover -s tests -v

  nexus-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORTHEX_HUB_CHECKOUT: ${{ github.workspace }}/../corthex-hub-reference
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ github.workspace }}/../nexus-contract-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: python tools/fetch_hub_ref.py --destination "$CORTHEX_HUB_CHECKOUT"
      - name: Install external pinned contract tools
        run: |
          python -m venv "$RUNNER_TEMP/nexus-contract-env"
          "$RUNNER_TEMP/nexus-contract-env/bin/python" -m pip install -r .github/requirements-qa.txt
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" -m openapi_spec_validator docs/06-api/nexus.openapi.yaml'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_response_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_planned_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/screen_states_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/default_response_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/hub_contract_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_hooks_check.py'
      - run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/contract_sanitizer_check.py'
      - name: Exercise standalone HTTP and SQLite with Schemathesis
        run: '"$RUNNER_TEMP/nexus-contract-env/bin/python" nexus/test/standalone_contract_check.py'

  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python tools/public_history_check.py HEAD
      - name: Scan history with checksum-verified Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner --log-level=error --gitleaks-ignore-path=.gitleaksignore

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORTHEX_HUB_CHECKOUT: ${{ github.workspace }}/../corthex-hub-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      # The hub suite builds the device's file with the pinned hub (TASK-281, TC-1766).
      - run: python tools/fetch_hub_ref.py --destination "$CORTHEX_HUB_CHECKOUT"
      - name: Locate the runner's installed Chrome
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable)
          test -n "$chrome"
          printf 'NEXUS_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"
          printf 'NEXUS_QA_ARTIFACTS=%s/nexus-browser-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: python nexus/test/browser_check.py
      - name: Keep synthetic regression receipts and captures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-browser-regression
          path: |
            ${{ env.NEXUS_QA_ARTIFACTS }}/pages-*/*.json
            ${{ env.NEXUS_QA_ARTIFACTS }}/pages-*/*.png
            ${{ env.NEXUS_QA_ARTIFACTS }}/hub-*/*.json
            ${{ env.NEXUS_QA_ARTIFACTS }}/hub-*/*.png
          if-no-files-found: ignore
          retention-days: 7

  all-checks:
    if: ${{ always() }}
    needs: [server-tests, nexus-build, hub-bridge, nexus-contracts, public-safety, browser-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
